  var h='<div class="sau-rule">'+zHead('Peso','peso',null)+zVal(at,fmtKg);
  if(m30!=null&&at){
    var d=at.v-m30;
    h+='<div class="sau-rf">sua média 30d '+esc(fmtKg(m30))+' · '+
      (Math.abs(d)<0.05?'em cima dela':(fmtN(Math.abs(d),1)+' kg '+(d<0?'abaixo':'acima')))+
      ' <span class="muted">(a média é a leitura; o dia é ruído)</span></div>';
  }else if(m30!=null)h+='<div class="sau-rf">sua média 30d '+esc(fmtKg(m30))+'</div>';
  return h+'</div>';
}

/**
 * Colunas cronológicas de um mapa {'2026-07':valor} (ordena por mês).
 * Base DESLOCADA de propósito: numa escala começando em 0, uma variação de poucos kg
 * ao longo do ano vira uma linha reta. o={fmt,cor,pico}.
 */
function saudeCols(map,o){
  o=o||{};
  var keys=Object.keys(map).sort();
  if(!keys.length)return '<div class="muted" style="font-size:12px">Sem dados na janela.</div>';
  var vals=keys.map(function(k){return map[k];});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),d=mx-mn;
  var base=mn-(d*0.45||Math.abs(mx*0.05)||1),top=mx+(d*0.12||Math.abs(mx*0.05)||1);
  var span=(top-base)||1;
  var f=o.fmt||function(v){return fmtN(v,1);};
  var cor=o.cor||'var(--ind2)';
  var pk=null;if(o.pico)pk=keys.reduce(function(a,b){return map[b]>map[a]?b:a;});
  return '<div class="sau-cols">'+keys.map(function(k){
    var hp=Math.max(5,Math.min(100,Math.round((map[k]-base)/span*100)));
    var isPk=(k===pk);
    return '<div class="sau-col"'+(isPk?' title="pico da janela"':'')+'><span class="sau-cv">'+esc(f(map[k]))+'</span>'+
      '<div class="sau-ct"><div class="sau-cf" style="height:'+hp+'%;background:'+(isPk?'var(--gold)':cor)+'"></div></div>'+
      '<span class="sau-cl'+(isPk?' pico':'')+'">'+esc(monLbl(k))+'</span></div>';
  }).join('')+'</div>';
}

/** Soma de uma série na janela (t_* vêm em MINUTOS). */
function saudeTot(m){return saudeSerie(m).reduce(function(a,b){return a+b.v;},0);}

/* Rótulos de APRESENTAÇÃO. As chaves (t_racket/t_other) são as do relógio e do
 * saude-baseline.json — não renomear no dado, só aqui:
 *  · t_other: a Garmin joga o BJJ no balde "outros"; na tela é BJJ, que é o que é.
 *  · t_racket: na prática é tennis. */
var SAU_MODAL=[['t_gym','Musculação'],['t_racket','Tennis'],['t_run','Corrida'],['t_other','BJJ']];

/* ---------------------- PRONTIDÃO: risco do dia + carga (ACWR) + insight ----------------------
 * Função-bloco da PÁGINA Saúde (via saudeProntidaoBloco). É o PISO, calculado no cliente e offline;
 * a "Leitura da rodada" (saudeInsHTML, na mesma página) é o TETO opcional que a nuvem escreve. */
function riskCor(n){return n==='Alto'?'var(--miss)':(n==='Moderado'?'var(--gold)':'var(--ok)');}
function acwrCor(s){return s==='Perigo'?'var(--miss)':(s==='Atenção'?'var(--gold)':(s==='Ideal'?'var(--ok)':'var(--muted)'));}
/** Barra de zonas do ACWR: destreino (neutro) · ideal · atenção · perigo, nesta ordem — cortes iguais aos do acwrCalc. */
function acwrZonaBar(v){
  var LO=0,HI=2;function pc(x){return Math.max(0,Math.min(100,(x-LO)/(HI-LO)*100));}
  return '<div class="sau-ztrack">'+
    '<span class="sau-zz" style="left:0;width:'+pc(0.8).toFixed(1)+'%;background:var(--muted)"></span>'+
    '<span class="sau-zz" style="left:'+pc(0.8).toFixed(1)+'%;width:'+(pc(1.3)-pc(0.8)).toFixed(1)+'%;background:var(--ok)"></span>'+
    '<span class="sau-zz" style="left:'+pc(1.3).toFixed(1)+'%;width:'+(pc(1.5)-pc(1.3)).toFixed(1)+'%;background:var(--gold)"></span>'+
    '<span class="sau-zz" style="left:'+pc(1.5).toFixed(1)+'%;width:'+(100-pc(1.5)).toFixed(1)+'%;background:var(--miss)"></span>'+
    '<span class="sau-rmark" style="left:'+pc(v).toFixed(1)+'%"></span>'+
  '</div><div class="sau-zax"><span>destreino</span><span>0,8 · 1,3 · 1,5</span><span>perigo</span></div>';
}
function saudeReadinessHTML(){
  var p=saudeProntidao(),r=p.risk,a=p.acwr,ins=p.ins;
  var anyColeta=(p.hrv.coleta||p.fc.coleta||a.coleta);
  var h='<div class="card sau-ready"><div class="grp-h">🚦 Prontidão de hoje</div><div class="sau-ready-grid">';
  /* Risco do dia */
  h+='<div class="sau-ready-box"><div class="sau-rh"><span class="sau-rt">Risco do dia'+infoBtn('risco')+'</span>'+
     '<span class="sau-pill" style="background:'+riskCor(r.nivel)+'">'+esc(r.nivel)+'</span></div>'+
     '<div class="sau-score" style="color:'+riskCor(r.nivel)+'">'+r.score+'<span class="sau-score-x">/100</span></div>';
  if(r.fatores.length)h+='<div class="sau-fatores">'+r.fatores.map(function(x){return '<span class="sau-fat">'+esc(x.l)+' <b>+'+x.p+'</b></span>';}).join('')+'</div>';
  else h+='<div class="sau-rf">Nenhum fator de risco hoje.'+(anyColeta?' Alguns indicadores ainda coletando baseline.':'')+'</div>';
  h+='</div>';
  /* Carga — ACWR */
  h+='<div class="sau-ready-box"><div class="sau-rh"><span class="sau-rt">Carga de treino'+infoBtn('acwr')+'</span>'+
     (a.coleta?'':'<span class="sau-pill" style="background:'+acwrCor(a.status)+'">'+esc(a.status)+'</span>')+'</div>';
  if(a.coleta){
    h+='<div class="sau-score sau-score-na">—</div><div class="sau-coleta">'+esc(a.msg)+'</div>';
  }else{
    h+='<div class="sau-score" style="color:'+acwrCor(a.status)+'">'+fmtN(a.acwr,2)+(a.parcial?'<span class="sau-score-x">parcial</span>':'')+'</div>';
    h+=acwrZonaBar(a.acwr);
    h+='<div class="sau-rf">Carga desta semana vs. média das últimas 4. Baseado em '+a.cov.n+' de '+a.cov.m+
       ' sessões com esforço registrado'+(a.parcial?' — cobertura baixa, número estimado.':'.')+'</div>';
  }
  h+='</div></div>';   /* /grid */
  /* Insight em destaque (o piso; a Leitura da rodada, quando existe, enriquece por cima) */
  h+='<div class="sau-insight sev-'+ins.sev+'"><span class="sau-insight-i">💡</span>'+
     '<div class="sau-insight-m">'+esc(ins.msg)+'<span class="sau-insight-src">'+esc(ins.src)+'</span></div></div>';
  return h+'</div>';
}

/* ============================ SAÚDE — DUAS SUPERFÍCIES, UMA FONTE ============================
 * O split é por PROPÓSITO, não por cópia: as funções-bloco (saudeReadinessHTML, saudeReguaHTML,
 * peso/volume/modalidade aqui) são ÚNICAS; cada superfície monta o SUBCONJUNTO que lhe cabe.
 *  · saudeIndicadoresHTML() → Indicadores › Saúde: números/histórico (peso · volume · modalidade · endurance).
 *  · saudeProntidaoBloco()/saudeReguaBloco() → Página Saúde: vivo/acionável (prontidão no topo, régua no meio).
 * Nada de render duplicado: um bloco aparece em UMA superfície só. */
function saudeIndicadoresHTML(){
  if(!saudeOk()){
    if(saudeErr)return '<div class="card"><div class="hempty">Não consegui carregar seu histórico agora.<br><button class="btn btn-sm" style="margin-top:10px" onclick="saudeRetry()">Tentar de novo</button></div></div>';
    return '<div class="card"><div class="hempty">Carregando seu histórico…</div></div>';
  }
  function K(n,l,c){return '<div class="kpi'+(c?' '+c:'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
  var jan=(SAUDE.janela||[]);
  var h='<div class="muted" style="font-size:12px;margin:-4px 0 12px">Carga histórica do relógio · janela '+esc(jan[0]?monLbl(jan[0].slice(0,7)):'?')+' → '+esc(jan[1]?monLbl(jan[1].slice(0,7)):'?')+' (não segue o seletor de período).</div>';

  /* ---- B: peso / IMC — nunca o diário cru (outlier de balança) ----
   * DUAS bases, cada uma rotulada, de propósito:
   *  · "hoje" = média móvel 30d — peso E IMC na MESMA base, então o par fecha
   *    (peso30 / altura² = imc30) e o card é auditável por quem conferir a conta;
   *  · delta da janela = média MENSAL do 1º mês contra o último, a mesma base do
   *    gráfico logo abaixo — é outra afirmação (tendência entre extremos).
   * Misturar as duas sem dizer qual é qual faz o app parecer errado. */
  var pm=saudeMensal('peso'),pk=Object.keys(pm).sort();
  var im=saudeMensal('imc');
  var peso30=saudeTailMean('peso',30),imc30=saudeTailMean('imc',30),a2=saudeAlt2();
  var pIni=pk.length?pm[pk[0]]:null,pFim=pk.length?pm[pk[pk.length-1]]:null;
  var dPeso=(pIni!=null&&pFim!=null)?(pFim-pIni):null;
  var kgAte25=(imc30!=null&&a2)?((imc30-25)*a2):null;
  h+='<div class="grp-h">⚖️ Peso &amp; IMC</div>';
  h+='<div class="kpis">'+
    K((peso30==null?'—':fmtN(peso30,1)+' kg'),'Peso hoje · média 30d')+
    K((imc30==null?'—':fmtN(imc30,1)),'IMC hoje · média 30d',(imc30!=null&&imc30<25)?'ok':'gold')+
    K((kgAte25==null?'—':(kgAte25>0?'−'+fmtN(kgAte25,1)+' kg':'atingido ✓')),'Até IMC 25,0')+
    K((dPeso==null?'—':(dPeso<0?'−':'+')+fmtN(Math.abs(dPeso),1)+' kg'),'Desde '+(pk.length?monLbl(pk[0]):'—')+' · média mensal',(dPeso!=null&&dPeso<0)?'ok':'')+
  '</div>';
  if(kgAte25!=null&&kgAte25>0&&a2)h+='<div class="muted" style="font-size:12px;margin:-6px 0 12px">Sair do sobrepeso (IMC 25,0) ≈ '+fmtN(25*a2,1)+' kg.</div>';
  h+='<div class="indcols"><div class="card"><div class="grp-h">Peso — média do mês (kg)</div>'+saudeCols(pm,{fmt:function(v){return fmtN(v,1);}})+'</div>'+
     '<div class="card"><div class="grp-h">IMC — média do mês</div>'+saudeCols(im,{fmt:function(v){return fmtN(v,1);},cor:'var(--ind1)'})+'</div></div>';

  /* ---- C: volume & endurance (mensal, 12 meses; pico vs. atual é a leitura) ---- */
  var vm=saudeMensal('vol_musc'),em=saudeMensal('endur');
  var vPico=saudePico('vol_musc'),vAtu=saudeUlt('vol_musc');
  var ePico=saudePico('endur'),eAtu=saudeUlt('endur');
  var vQueda=(vPico&&vAtu&&vPico.v)?Math.round((vAtu.v-vPico.v)/vPico.v*100):null;
  var ton=function(v){return fmtN(v/1000,1);};
  h+='<div class="grp-h">🏋️ Volume &amp; endurance</div>';
  h+='<div class="kpis">'+
    K((vPico?ton(vPico.v)+' t':'—'),'Musculação · pico '+(vPico?monLbl(vPico.d.slice(0,7)):'—'),'gold')+
    K((vAtu?ton(vAtu.v)+' t':'—'),'Musculação · atual'+(vQueda!=null?' ('+(vQueda>0?'+':'')+vQueda+'%)':''))+
    K((ePico?fmtN(ePico.v,0):'—'),'Endurance · pico '+(ePico?monLbl(ePico.d.slice(0,7)):'—'),'gold')+
    K((eAtu?fmtN(eAtu.v,0):'—'),'Endurance · atual')+
  '</div>';
  h+='<div class="indcols"><div class="card"><div class="grp-h">Volume de musculação — por mês (toneladas)</div>'+saudeCols(vm,{fmt:ton,pico:true})+'</div>'+
     '<div class="card"><div class="grp-h">Endurance Score — por mês</div>'+saudeCols(em,{fmt:function(v){return fmtN(v,0);},cor:'var(--saude)',pico:true})+'</div></div>';
  var mod={};
  // minutos → horas, arredondado p/ 1 casa (fmtH mostra até 2 e o resto do app usa 1)
  SAU_MODAL.forEach(function(p){var t=saudeTot(p[0]);if(t>0)mod[p[1]]=Math.round(t/60*10)/10;});
  h+='<div class="card"><div class="grp-h">⏱️ Tempo por modalidade — total da janela</div>'+donut(mod,'_modal')+'</div>';
  return h;
}

/* Página Saúde — vivo/acionável: régua (hoje vs. baseline dele) + prontidão (risco+ACWR+insight).
 * Reusa o MESMO guard e as MESMAS funções-bloco de antes; só monta o outro subconjunto. */
/* saudePaginaHTML foi DESMEMBRADO na ordem nova da página (alerta em cima, registro embaixo):
 * a Prontidão sobe pro TOPO e a Régua fica no MEIO, com blocos entre elas. As funções-bloco
 * (saudeReadinessHTML/saudeReguaHTML) continuam ÚNICAS — só muda a ordem da montagem no
 * renderSaude. O guard saudeOk() mostra o loading/erro UMA vez, no bloco de cima. */
function saudeProntidaoBloco(){
  if(!saudeOk()){
    if(saudeErr)return '<div class="card"><div class="hempty">Não consegui carregar seu histórico agora.<br><button class="btn btn-sm" style="margin-top:10px" onclick="saudeRetry()">Tentar de novo</button></div></div>';
    return '<div class="card"><div class="hempty">Carregando seu histórico…</div></div>';
  }
  return saudeReadinessHTML();   /* prontidão do dia: risco + ACWR + insight */
}
function saudeReguaBloco(){
  if(!saudeOk())return '';   /* o loading/erro já saiu no bloco de prontidão, em cima */
  return saudeReguaHTML();
}

/* ============================ PÁGINA SAÚDE ============================
 * DUAS SUPERFÍCIES, UMA FONTE: cada página chama o SUBCONJUNTO de funções-bloco que lhe cabe
 * (ver saudeIndicadoresHTML / saudePaginaHTML acima) — nunca copia render. A página só
 * ACRESCENTA camadas em volta (registro, treinos, lesões, jogos, leitura).
 * Ordem da página: o que ele ESCREVE primeiro, o que o relógio MEDE depois. */

/** '13/07 seg' — rótulo curto de data para as listas desta página. */
function dLbl(iso){var d=parseISO(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+DOW[(d.getDay()+6)%7].slice(0,3).toLowerCase();}

/* Ordem da página (aprovada pelo dono): AÇÃO em cima, REGISTRO embaixo.
 *  1 prontidão + insights  → consolidação em ação
 *  2 lesões                → alerta (ativas primeiro)
 *  3 régua                 → as leituras (editável via check-in)
 *  4 treinos               → cards do que foi feito
 *  5 registro de peso      → entrada manual (peso + hora)
 *  6 jogos                 → partidas */
function renderSaude(){
  saudeLoad(); saudeInsLoad();
  var h='<div class="page-head"><h1>Saúde</h1><div class="sub">Seu registro, seus treinos e o que o relógio mede</div></div>';
  h+=saudeProntidaoBloco();  // 1 prontidão de hoje (risco + ACWR + insight; guard saudeOk)
  h+=saudeInsHTML();         // 1 leitura da rodada da nuvem (some limpo enquanto não existe)
  h+=saudeLesoesHTML();      // 2 registro de lesões (boneco + EVA + status)
  h+=saudeReguaBloco();      // 3 régua — onde ele está na própria baseline
  h+=saudeTreinosHTML();     // 4 treinos feitos em cards (RPE/sensação/anotação/lesão)
  h+=saudePerfilCard();      // 5 registro de peso (+ hora) + IMC calculado
  h+=saudeJogosHTML();       // 6 partidas
  /* .flowpage = quem dá a distância entre os cards empilhados (ver Style.html).
     Sem ele, `.card` sem margin encosta no vizinho e o box-shadow vaza por cima. */
  el('view').innerHTML='<div class="flowpage">'+h+'</div>';
  spHoraInit();   // liga o drum-roll da hora do registro de peso (DOM já montado)
  spwInit();      // liga o drum-roll do peso (kg + decimal), idem
}

/* ---- Hora do registro de peso: o MESMO drum-roll do sono (rolagem de relógio), porém
 * relógio de 24h (00–23 : 00–55, passo 5min · sem vírgula/decimal). Estado próprio (SP_HORA)
 * e ids próprios (sph/spm) para NÃO tocar no drum do sono — reaproveita só as classes .drum*
 * e o DRUM_H. Default = agora, editável. Round-trip guarda a string 'HH:MM'. */
var SP_HS=[];(function(){for(var i=0;i<24;i++)SP_HS.push(i);})();
var SP_HORA=null,spMoved=false,SP_OPEN=false;   /* {h,m} escolhido; null → default = agora · SP_OPEN: roda aberta? */
function spHoraNow(){var d=new Date(),m=Math.round(d.getMinutes()/5)*5,h=d.getHours();if(m>=60){m=0;h=(h+1)%24;}return {h:h,m:m};}
function spHoraParts(){return (SP_HORA==null)?spHoraNow():{h:SP_HORA.h,m:SP_HORA.m};}
function spHoraStr(){var p=spHoraParts();return pad(p.h)+':'+pad(p.m);}
function spDrumColHTML(id,items,lbl){
  var s='',i;
  for(i=0;i<items.length;i++)s+='<div class="drum-i" onclick="spHoraPick(\''+id+'\','+i+')">'+pad(items[i])+'</div>';
  return '<div class="drum-col"><div class="drum-lbl">'+esc(lbl)+'</div>'+
    '<div class="drum" id="drum_'+id+'" tabindex="0" role="spinbutton" aria-label="'+esc(lbl)+'">'+
      '<div class="drum-sel"></div><div class="drum-list" id="druml_'+id+'">'+s+'</div>'+
    '</div></div>';
}
function spChipInner(){return '<span class="drum-chip-v">'+esc(spHoraStr())+'</span><span class="drum-chip-ed">✎</span>';}
function spCollapsePaint(){var w=el('sphwrap');if(w)w.className='drum-wrap sp-hora-wrap'+(SP_OPEN?' open':'');
  var c=el('sphchip');if(c)c.innerHTML=spChipInner();}
function spHoraToggle(){SP_OPEN=!SP_OPEN;spCollapsePaint();if(SP_OPEN)spHoraPaint();}
function spHoraHTML(){
  return '<div class="field sp-hora-field"><label>Hora</label>'+
    '<div class="drum-wrap sp-hora-wrap" id="sphwrap">'+
      '<button type="button" class="drum-chip drum-chip-sm" id="sphchip" onclick="spHoraToggle()" aria-label="Editar a hora do registro">'+spChipInner()+'</button>'+
      '<div class="drum-open">'+
        '<div class="drums">'+spDrumColHTML('sph',SP_HS,'hora')+
          '<span class="drum-sep">:</span>'+spDrumColHTML('spm',DRUM_MS,'min')+'</div>'+
        '<div class="drum-done-row"><button type="button" class="btn btn-sm btn-primary drum-done" onclick="spHoraToggle()">Pronto</button></div>'+
      '</div>'+
    '</div></div>';
}
function spDrumPos(id,idx){
  var l=el('druml_'+id);if(!l||idx<0)return;
  l.style.transform='translateY('+((2-idx)*DRUM_H)+'px)';
  var ch=l.children,i;for(i=0;i<ch.length;i++)ch[i].className=(i===idx)?'drum-i on':'drum-i';
  var d=el('drum_'+id);if(d)d.setAttribute('aria-valuenow',String((id==='sph'?SP_HS:DRUM_MS)[idx]));
}
function spHoraPaint(){var p=spHoraParts();spDrumPos('sph',SP_HS.indexOf(p.h));spDrumPos('spm',DRUM_MS.indexOf(p.m));
  var c=el('sphchip');if(c)c.innerHTML=spChipInner();}
function spHoraSet(h,m){SP_HORA={h:Math.max(0,Math.min(23,h)),m:Math.max(0,Math.min(55,m))};spHoraPaint();}
function spHoraPick(id,i){if(spMoved)return;var p=spHoraParts(),arr=(id==='sph')?SP_HS:DRUM_MS;spHoraSet((id==='sph')?arr[i]:p.h,(id==='spm')?arr[i]:p.m);}
function spHoraMove(id,d){var p=spHoraParts(),arr=(id==='sph')?SP_HS:DRUM_MS;var cur=arr.indexOf((id==='sph')?p.h:p.m);var ni=Math.max(0,Math.min(arr.length-1,cur+d));spHoraSet((id==='sph')?arr[ni]:p.h,(id==='spm')?arr[ni]:p.m);}
function spHoraBind(id){
  var d=el('drum_'+id);if(!d)return;
  var acc=0,last=0,drag=false;
  d.addEventListener('pointerdown',function(ev){drag=true;acc=0;last=ev.clientY;spMoved=false;try{d.setPointerCapture(ev.pointerId);}catch(e){}d.classList.add('drag');try{d.focus();}catch(e){}});
  d.addEventListener('pointermove',function(ev){if(!drag)return;ev.preventDefault();var dy=last-ev.clientY;last=ev.clientY;acc+=dy;if(Math.abs(acc)>=DRUM_H){var st=(acc>0?1:-1)*Math.floor(Math.abs(acc)/DRUM_H);spHoraMove(id,st);acc-=st*DRUM_H;spMoved=true;}});
  function stop(ev){drag=false;d.classList.remove('drag');try{d.releasePointerCapture(ev.pointerId);}catch(e){}}
  d.addEventListener('pointerup',stop);d.addEventListener('pointercancel',stop);
  d.addEventListener('wheel',function(ev){ev.preventDefault();spHoraMove(id,(ev.deltaY>0)?1:-1);},{passive:false});
  d.addEventListener('keydown',function(ev){var k=(ev.key==='ArrowUp')?-1:((ev.key==='ArrowDown')?1:0);if(!k)return;ev.preventDefault();spHoraMove(id,k);});
}
function spHoraInit(){if(!el('drum_sph'))return;SP_OPEN=false;spHoraPaint();spHoraBind('sph');spHoraBind('spm');spCollapsePaint();}

/* ---- Peso do registro: drum-roll de 2 colunas (kg 0–100 · decimal 0–9) ----
 * Mesmo padrão do drum da hora: chip recolhido → toca → roda → Pronto. Estado (SPW),
 * ids (spwk/spwd) e funções próprias: NÃO reaproveita as funções do sono nem as da hora
 * de propósito — as três rodas compartilham só as classes .drum* e o DRUM_H, para que
 * mexer numa não possa regredir as outras (decisão já tomada quando a hora nasceu).
 * As colunas são INDEPENDENTES (kg e decimal rolam separados), como horas/minutos.
 * Exibe com VÍRGULA e uma casa (kg,decimal); o que vai para a API é número com ponto.
 * (sem número de exemplo aqui: peso escrito em comentário do cliente é peso publicado.)
 * Nasce posicionado no ÚLTIMO peso registrado, que vem do DADO em runtime
 * (saudeSerieRaw), nunca de constante — número de peso escrito aqui seria o peso dele
 * no código que vai para o repo público. Sem histórico: posição NEUTRA (meio da escala,
 * que é propriedade da faixa 0–100, não um chute) e chip "definir". */
var SPW_KG=[],SPW_DEC=[];
(function(){var i;for(i=0;i<=100;i++)SPW_KG.push(i);for(i=0;i<=9;i++)SPW_DEC.push(i);})();
var SPW_NEUTRO=50;   /* meio da coluna 0–100: onde a roda para quando não há histórico */
var SPW=null,spwMoved=false,SPW_OPEN=false;   /* {k,d} escolhido; null → herda do último registro */
/** Último peso registrado → {k,d}, ou null se ainda não há ponto nenhum. */
function spwSerie(){
  var ps=saudeSerieRaw('peso'),u=ps.length?ps[ps.length-1]:null;
  if(!u||u.v==null||isNaN(u.v))return null;
  var v=Math.round(Number(u.v)*10),k=Math.floor(v/10),d=v-k*10;
  if(k<0)return {k:0,d:0};
  if(k>100)return {k:100,d:9};
  return {k:k,d:d};
}
/** Posição das rodas: escolha do usuário › último registro › neutro. */
function spwParts(){var p=SPW||spwSerie();return p?{k:p.k,d:p.d}:{k:SPW_NEUTRO,d:0};}
/** Valor em kg (número) ou null quando não há escolha nem histórico — só null bloqueia o salvar. */
function spwVal(){var p=SPW||spwSerie();return p?((p.k*10+p.d)/10):null;}
function spwColHTML(id,items,lbl){
  var s='',i;
  for(i=0;i<items.length;i++)s+='<div class="drum-i" onclick="spwPick(\''+id+'\','+i+')">'+items[i]+'</div>';
  return '<div class="drum-col"><div class="drum-lbl">'+esc(lbl)+'</div>'+
    '<div class="drum" id="drum_'+id+'" tabindex="0" role="spinbutton" aria-label="'+esc(lbl)+'">'+
      '<div class="drum-sel"></div><div class="drum-list" id="druml_'+id+'">'+s+'</div>'+
    '</div></div>';
}
function spwChipInner(){var v=spwVal();
  return '<span class="drum-chip-v'+(v==null?' muted':'')+'">'+(v==null?'definir':esc(fmtN(v,1)+' kg'))+'</span><span class="drum-chip-ed">✎</span>';}
function spwCollapsePaint(){
  var w=el('spwwrap');
  if(w)w.className='drum-wrap sp-val-wrap drumw'+((spwVal()==null)?' empty':'')+(SPW_OPEN?' open':'');
  var c=el('spwchip');if(c)c.innerHTML=spwChipInner();
}
function spwToggle(){SPW_OPEN=!SPW_OPEN;spwCollapsePaint();if(SPW_OPEN)spwPaint();}
function spwHTML(){
  return '<div class="field sp-val-field"><label>Peso</label>'+
    '<div class="drum-wrap sp-val-wrap drumw" id="spwwrap">'+
      '<button type="button" class="drum-chip drum-chip-sm" id="spwchip" onclick="spwToggle()" aria-label="Editar o peso do registro">'+spwChipInner()+'</button>'+
      '<div class="drum-open">'+
        '<div class="drums">'+spwColHTML('spwk',SPW_KG,'kg')+
          '<span class="drum-sep">,</span>'+spwColHTML('spwd',SPW_DEC,'dec')+'</div>'+
        '<div class="drum-done-row"><button type="button" class="btn btn-sm btn-primary drum-done" onclick="spwToggle()">Pronto</button></div>'+
      '</div>'+
    '</div></div>';
}
function spwPos(id,idx){
  var l=el('druml_'+id);if(!l||idx<0)return;
  l.style.transform='translateY('+((2-idx)*DRUM_H)+'px)';   /* 2 = slot central de 5 visíveis */
  var ch=l.children,i;for(i=0;i<ch.length;i++)ch[i].className=(i===idx)?'drum-i on':'drum-i';
  var d=el('drum_'+id);if(d)d.setAttribute('aria-valuenow',String((id==='spwk'?SPW_KG:SPW_DEC)[idx]));
}
function spwPaint(){var p=spwParts();spwPos('spwk',SPW_KG.indexOf(p.k));spwPos('spwd',SPW_DEC.indexOf(p.d));spwCollapsePaint();}
function spwSet(k,d){SPW={k:Math.max(0,Math.min(100,k)),d:Math.max(0,Math.min(9,d))};spwPaint();}
function spwPick(id,i){if(spwMoved)return;var p=spwParts(),arr=(id==='spwk')?SPW_KG:SPW_DEC;spwSet((id==='spwk')?arr[i]:p.k,(id==='spwd')?arr[i]:p.d);}
function spwMove(id,n){var p=spwParts(),arr=(id==='spwk')?SPW_KG:SPW_DEC;var cur=arr.indexOf((id==='spwk')?p.k:p.d);var ni=Math.max(0,Math.min(arr.length-1,cur+n));spwSet((id==='spwk')?arr[ni]:p.k,(id==='spwd')?arr[ni]:p.d);}
function spwBind(id){
  var d=el('drum_'+id);if(!d)return;
  var acc=0,last=0,drag=false;
  d.addEventListener('pointerdown',function(ev){drag=true;acc=0;last=ev.clientY;spwMoved=false;try{d.setPointerCapture(ev.pointerId);}catch(e){}d.classList.add('drag');try{d.focus();}catch(e){}});
  d.addEventListener('pointermove',function(ev){if(!drag)return;ev.preventDefault();var dy=last-ev.clientY;last=ev.clientY;acc+=dy;if(Math.abs(acc)>=DRUM_H){var st=(acc>0?1:-1)*Math.floor(Math.abs(acc)/DRUM_H);spwMove(id,st);acc-=st*DRUM_H;spwMoved=true;}});
  function stop(ev){drag=false;d.classList.remove('drag');try{d.releasePointerCapture(ev.pointerId);}catch(e){}}
  d.addEventListener('pointerup',stop);d.addEventListener('pointercancel',stop);
  d.addEventListener('wheel',function(ev){ev.preventDefault();spwMove(id,(ev.deltaY>0)?1:-1);},{passive:false});
  d.addEventListener('keydown',function(ev){var k=(ev.key==='ArrowUp')?-1:((ev.key==='ArrowDown')?1:0);if(!k)return;ev.preventDefault();spwMove(id,k);});
}
function spwInit(){if(!el('drum_spwk'))return;SPW_OPEN=false;spwPaint();spwBind('spwk');spwBind('spwd');spwCollapsePaint();}

/* ---- Registro: peso manual + altura + IMC calculado ---- */
function saudePerfilCard(){
  var a=saudeAltura();
  var ps=saudeSerieRaw('peso'), ult=ps.length?ps[ps.length-1]:null;
  var imcUlt=(ult&&a)?(ult.v/(a*a)):null;
  var h='<div class="card sau-reg"><div class="grp-h">⚖️ Registrar peso</div>';
  /* Uma linha só (desktop): peso + dia + hora (chip recolhido) + botão. Em ≤560px quebra sozinho. */
  h+='<div class="sau-reg-row sau-reg-one">'+
    spwHTML()+      // peso — chip recolhido (kg,decimal), roda em duas colunas; nasce no último registro
    '<div class="field sp-date-field"><label>Dia</label><input id="sp_date" type="date" value="'+isoOf(TODAY)+'"></div>'+
    spHoraHTML()+   // hora do dia — chip recolhido (H:MM), default = agora
    '<button class="btn btn-sm btn-primary" id="sp_btn" onclick="saudePesoSave()">Registrar</button>'+
    '</div>';
  /* O IMC do card é CALCULADO da altura do perfil — não espera a balança sincronizar.
     O rótulo diz de onde veio cada número (regra da casa: "média 30d" e afins). */
  h+='<div class="sau-reg-now">';
  h+='<span><b>'+(ult?fmtN(ult.v,1)+' kg':'—')+'</b> <span class="muted">último registro'+(ult?' · '+dLbl(ult.d)+((ult.f==='manual'&&ult.hora)?(' '+esc(ult.hora)):'')+(ult.f==='manual'?' · registrado':' · relógio'):'')+'</span></span>';
  h+='<span><b>'+(imcUlt==null?'—':fmtN(imcUlt,1))+'</b> <span class="muted">IMC calculado · '+(a!=null?('altura '+fmtN(a,2)+' m'):'cadastre sua altura em Sistema › Perfil')+'</span></span>';
  h+='</div>';
  h+='<div class="muted" style="font-size:11px;margin-top:6px">Altura é constante sua — edite em <b>Sistema › Perfil</b>. No mesmo dia, o peso registrado no app prevalece sobre o da balança.</div>';
  h+='</div>';
  return h;
}
function saudePesoSave(){
  /* O peso vem da RODA, não de um input: a faixa é a que a roda permite (0,1–100,9).
     A antiga trava de 30–300 era contra erro de digitação — que não existe mais aqui;
     o que precisa barrar é só o "nada escolhido" e o zero. */
  var v=spwVal(), d=el('sp_date').value;
  if(v==null||!(v>0)){toast('Escolha o peso');return;}
  if(!d){toast('Escolha o dia');return;}
  var b=el('sp_btn'); if(b){b.disabled=true;b.textContent='Salvando…';}
  api('saveSaudePonto',{data:d,metrica:'peso',valor:String(v),periodo:'d',hora:spHoraStr()}).then(function(r){
    if(r&&r.error){toast(r.error);if(b){b.disabled=false;b.textContent='Registrar';}return;}
    toast('Peso registrado ✓');
    SP_HORA=null;    /* próximo registro volta a nascer na hora atual */
    SPW=null;        /* e o peso volta a herdar do último registro (que acabou de mudar) */
    saudeReload();   /* re-busca: a precedência manual×relógio é do backend */
  }).catch(function(){toast('Falha ao registrar');if(b){b.disabled=false;b.textContent='Registrar';}});
}

/* ---- Slot de insights (rotina de nuvem; o app NÃO chama LLM) ----
 * Contrato do JSON: ver getSaudeInsights() em Code.gs. Tudo é opcional menos `gerado` —
 * campo que faltar simplesmente não é desenhado. `sauArr` blinda contra JSON torto:
 * quem escreve o arquivo é outro processo, e um campo malformado não pode apagar a página. */
var SAUINS=null,sauInsTry=false,sauInsDone=false;
function sauArr(v){return (Object.prototype.toString.call(v)==='[object Array]')?v:[];}
function saudeInsLoad(){
  if(sauInsTry)return; sauInsTry=true;
  api('getSaudeInsights').then(function(x){SAUINS=(x&&x.gerado)?x:null;sauInsDone=true;if(page==='saude')renderSaude();})
  .catch(function(){sauInsDone=true;if(page==='saude')renderSaude();});
}
function saudeInsHTML(){
  /* TETO OPCIONAL: esta é a leitura RICA escrita pela rotina de nuvem. O PISO é o insight
   * calculado no cliente (saudeReadinessHTML, sempre presente e offline). Por isso aqui,
   * sem JSON, não desenha NADA — nem "Carregando…" eterno, nem um placeholder que
   * contradiga o insight que já aparece logo abaixo. Existe JSON → enriquece por cima. */
  if(!sauInsDone||!SAUINS)return '';
  var x=SAUINS;
  var h='<div class="card sau-ins">';
  h+='<div class="sau-ins-h"><h3>'+esc(x.titulo||'Sua leitura de saúde')+'</h3><span class="sau-ins-d">'+esc(x.dataLabel||x.gerado||'')+'</span></div>';
  if(x.resumo)h+='<p class="sau-ins-lead">'+esc(x.resumo)+'</p>';
  var dst=sauArr(x.destaques);
  if(dst.length)h+='<div class="sau-chips">'+dst.map(function(d){
    var s=(d&&d.sinal==='bom')?' good':((d&&d.sinal==='atencao')?' warn':'');
    return '<div class="sau-chip'+s+'"><span class="sau-chip-t">'+esc((d&&d.t)||'')+'</span><span class="sau-chip-d">'+esc((d&&d.d)||'')+'</span></div>';
  }).join('')+'</div>';
  sauArr(x.blocos).forEach(function(b){
    if(!b)return;
    h+='<div class="sau-ins-b"><div class="grp-h">'+esc(b.nome||'')+'</div>';
    h+=sauArr(b.itens).map(function(it){
      if(!it)return '';
      return '<div class="sau-ins-i"><b>'+esc(it.titulo||'')+'</b>'+
        (it.texto?'<div>'+esc(it.texto)+'</div>':'')+
        (it.porque?'<div class="sau-ins-p">'+esc(it.porque)+'</div>':'')+'</div>';
    }).join('');
    h+='</div>';
  });
  var sug=sauArr(x.sugestoes);
  if(sug.length)h+='<div class="sau-ins-b"><div class="grp-h">O que fazer com isso</div><ul class="sau-ul">'+sug.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>';
  if(x.note)h+='<div class="sau-ins-note">'+esc(x.note)+'</div>';
  h+='</div>';
  return h;
}

/* ---- Treinos feitos em CARDS: data · modalidade · duração · RPE/sensação · nota · lesão ----
 * Só sessões `done` (o que aconteceu de fato). RPE/sensação/nota são a MESMA captura da v3.6.0,
 * editável depois do fato: o card inteiro abre o openRpe (não há indicador novo aqui). A duração
 * vem do start/end do evento (durH); a lesão vinculada casa por evento_id (a mesma da leva 3). */
/* ORGANIZAÇÃO DO BLOCO (o CARD em si não mudou — só o que existe em volta dele):
 *  · filtro de MODALIDADE derivado do DADO (as modalidades que existem nas sessões feitas).
 *    NUNCA uma lista fixa no código: no cliente, código é publicação — modalidade hardcoded
 *    seria specific real do usuário vazando. A lista sai de `treinoModal()` sobre os eventos.
 *  · filtro de PERÍODO. Convenção escolhida: "ÚLTIMOS N DIAS CORRIDOS contados a partir de
 *    hoje, hoje incluso" — Semana = 7 dias (hoje −6), Mês = 30 dias (hoje −29). NÃO é
 *    semana-calendário nem mês-corrente: janela deslizante é previsível e não esvazia
 *    sozinha no dia 1º. Default 'mes' (dá contexto sem virar lista gigante).
 *  · PAGINAÇÃO de SAU_TREINO_PG por página → o bloco tem altura previsível, não importa
 *    quantas sessões existam (foi isso que aposentou o antigo teto de 20 + "+N mais antigas").
 * Estado só em memória (não persiste): trocar filtro volta pra página 1. O repaint é do
 * MIOTO do card (`sauTrPaint` → innerHTML de #sauTrCard), nunca `renderSaude()` inteiro —
 * reconstruir a página a cada clique faz o scroll pular (mesmo bug já corrigido na agenda). */
var SAU_TREINO_PG=7;        // cards por página (fixo)
var SAU_TR_MOD='*';         // '*' = todas as modalidades
var SAU_TR_PER='mes';       // 'semana' | 'mes' | 'tudo'
var SAU_TR_PG=1;            // página atual, 1-based (clampada no render)
function treinosFeitos(){
  return EVENTS.filter(function(e){return (e.subtipo==='Treino'||e.subtipo==='Esporte'||e.subtipo==='Jogo')&&e.status==='done';})
    .sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(toMin(b.start)-toMin(a.start)));});
}
/** Modalidade de uma sessão: o 3º nível quando existe, senão o subtipo. Só do dado. */
function treinoModal(e){return e.subsub||e.subtipo||'—';}
/** ISO de corte da janela deslizante; null = 'tudo' (sem corte). */
function sauTrCut(){
  var n=(SAU_TR_PER==='semana')?7:((SAU_TR_PER==='mes')?30:0);
  if(!n)return null;
  var d=new Date(TODAY.getTime()); d.setDate(d.getDate()-(n-1)); return isoOf(d);
}
function treinosPer(){var c=sauTrCut(),all=treinosFeitos();return c?all.filter(function(e){return e.date>=c;}):all;}
function treinosFiltrados(){var ts=treinosPer();return (SAU_TR_MOD==='*')?ts:ts.filter(function(e){return treinoModal(e)===SAU_TR_MOD;});}
function sauTrSetMod(m){SAU_TR_MOD=m;SAU_TR_PG=1;sauTrPaint();}
function sauTrSetPer(p){SAU_TR_PER=p;SAU_TR_PG=1;sauTrPaint();}
function sauTrNav(n){SAU_TR_PG+=n;sauTrPaint();}   /* clamp fica no render — extremo já vem desabilitado */
function sauTrPaint(){var n=el('sauTrCard');if(n)n.innerHTML=sauTrInnerHTML();else renderSaude();}
function saudeTreinosHTML(){
  var all=treinosFeitos();
  var h='<div class="grp-h">🏋️ Treinos &amp; sessões'+(all.length?'<span class="muted" style="font-weight:400"> · '+all.length+' feita'+(all.length===1?'':'s')+'</span>':'')+'</div>';
  if(!all.length)return h+'<div class="card"><div class="hempty">Nenhum treino ou esporte concluído ainda. Marque uma sessão como feita na agenda para avaliar RPE e sensação.</div></div>';
  return h+'<div class="card" id="sauTrCard">'+sauTrInnerHTML()+'</div>';
}
function sauTrInnerHTML(){
  var all=treinosFeitos(),per=treinosPer(),list=treinosFiltrados();
  /* Modalidades: universo = TODAS as sessões feitas (chips estáveis ao trocar período);
     contagem exibida = a do período corrente (0 inclusive → chip apagado, informação útil). */
  var tot={},cnt={};
  all.forEach(function(e){var m=treinoModal(e);tot[m]=(tot[m]||0)+1;});
  per.forEach(function(e){var m=treinoModal(e);cnt[m]=(cnt[m]||0)+1;});
  var mods=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]||(a<b?-1:(a>b?1:0));});
  function modBtn(v,lbl,n){
    return '<button class="sau-trmod'+(SAU_TR_MOD===v?' active':'')+(n?'':' zero')+'" onclick="sauTrSetMod(\''+esc(jsq(v))+'\')">'+
      esc(lbl)+'<span class="sau-trmod-n">'+n+'</span></button>';
  }
  var h='<div class="sau-trbar"><div class="seg sau-trseg">'+
    [['semana','Semana'],['mes','Mês'],['tudo','Tudo']].map(function(p){
      return '<button class="'+(SAU_TR_PER===p[0]?'active':'')+'" onclick="sauTrSetPer(\''+p[0]+'\')">'+p[1]+'</button>';
    }).join('')+'</div><div class="sau-trmods">'+modBtn('*','Todas',per.length)+
    mods.map(function(m){return modBtn(m,m,cnt[m]||0);}).join('')+'</div></div>';
  if(!list.length){
    var perLbl=(SAU_TR_PER==='semana')?'nos últimos 7 dias':((SAU_TR_PER==='mes')?'nos últimos 30 dias':'no histórico');
    return h+'<div class="hempty">'+(SAU_TR_MOD==='*'?'Nenhuma sessão '+perLbl+'.':'Nenhuma sessão de '+esc(SAU_TR_MOD)+' '+perLbl+'.')+' Troque o filtro acima para ver outras.</div>';
  }
  var pages=Math.max(1,Math.ceil(list.length/SAU_TREINO_PG));
  if(SAU_TR_PG>pages)SAU_TR_PG=pages; if(SAU_TR_PG<1)SAU_TR_PG=1;
  var ts=list.slice((SAU_TR_PG-1)*SAU_TREINO_PG,(SAU_TR_PG-1)*SAU_TREINO_PG+SAU_TREINO_PG);
  h+='<div class="sau-tcards">';
  h+=ts.map(function(e){
    var r=num0(e.rpe),s=num0(e.sensacao),dh=durH(e);
    var tags=(e.subsub?'<span class="sau-tag">'+esc(e.subsub)+'</span>':'')+(e.detalhe?'<span class="sau-tag">'+esc(e.detalhe)+'</span>':'');
    var mp=[];if(r!=null)mp.push('RPE '+r);if(s!=null)mp.push('sensação '+s+'/5');
    var met=mp.length?'<div class="sau-tcard-met">'+esc(mp.join(' · '))+'</div>':'<div class="sau-tcard-met empty">Sem avaliação — toque para preencher</div>';
    var inj=LESOES.filter(function(l){return l.evento_id&&l.evento_id===e.id;});
    var injTxt=inj.length?'<div class="sau-tcard-inj">🩹 '+inj.map(function(l){return esc(lesaoCod(l))+(l.status==='ativa'?'':' (rec.)');}).join(' · ')+'</div>':'';
    return '<div class="sau-tcard" role="button" tabindex="0" title="Avaliar / anotar" onclick="openRpe(\''+e.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openRpe(\''+e.id+'\');}">'+
      '<div class="sau-tcard-h"><span>'+esc(dLbl(e.date))+'</span><span class="sau-tcard-dur">'+fmtHm(dh)+'</span></div>'+
      '<div class="sau-tcard-t">'+esc(e.titulo)+tags+'</div>'+
      met+
      (e.nota_sessao?'<div class="sau-tcard-n">'+esc(e.nota_sessao)+'</div>':'')+
      injTxt+
    '</div>';
  }).join('');
  h+='</div>';
  h+='<div class="sau-trpg">'+
    '<button class="icbtn"'+(SAU_TR_PG<=1?' disabled':'')+' onclick="sauTrNav(-1)" aria-label="Página anterior">‹</button>'+
    '<span>página '+SAU_TR_PG+' de '+pages+'</span>'+
    '<button class="icbtn"'+(SAU_TR_PG>=pages?' disabled':'')+' onclick="sauTrNav(1)" aria-label="Próxima página">›</button>'+
    '<span class="sau-trpg-n">'+list.length+(list.length===1?' sessão':' sessões')+' no filtro</span>'+
  '</div>';
  return h;
}

/* ---- Jogos (tennis & cia) ---- */
function uniqJogoId(){var id;do{id='jogo-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e7).toString(36);}while(JOGOS.some(function(j){return j.id===id;}));return id;}
function jogosOrd(){return JOGOS.slice().sort(function(a,b){return a.data<b.data?1:(a.data>b.data?-1:0);});}
function saudeJogosHTML(){
  var js=jogosOrd();
  var v=0,d=0;js.forEach(function(j){if(j.resultado==='V')v++;else if(j.resultado==='D')d++;});
  var h='<div class="grp-h" style="display:flex;align-items:center;gap:8px">🎾 Jogos'+
    (js.length?'<span class="muted" style="font-weight:400">· '+v+'V–'+d+'D em '+js.length+'</span>':'')+
    '<span style="flex:1"></span><button class="btn btn-sm" onclick="openJogo()">＋ Jogo</button></div>';
  if(!js.length)return h+'<div class="card"><div class="hempty">Nenhum jogo registrado ainda.</div></div>';
  h+='<div class="card"><div class="sau-list">';
  h+=js.map(function(j){
    var res=(j.resultado==='V')?'<span class="sau-res v">V</span>':((j.resultado==='D')?'<span class="sau-res d">D</span>':'');
    var sub=[];
    if(j.modalidade)sub.push(esc(j.modalidade));
    if(j.local)sub.push(esc(j.local));
    if(j.evento_id&&EVENTS.some(function(e){return e.id===j.evento_id;}))sub.push('🗓️ na agenda');
    return '<div class="sau-row">'+
      '<div class="sau-row-d">'+esc(dLbl(j.data))+'</div>'+
      '<div class="sau-row-m">'+
        '<div class="sau-row-t">'+res+esc(j.adversario||'—')+(j.placar?'<span class="sau-plac">'+esc(j.placar)+'</span>':'')+'</div>'+
        (sub.length?'<div class="sau-row-met">'+sub.join(' · ')+'</div>':'')+
        (j.nota?'<div class="sau-row-n">'+esc(j.nota)+'</div>':'')+
      '</div>'+
      '<button class="icbtn" title="Editar" onclick="openJogo(\''+j.id+'\')">✎</button>'+
    '</div>';
  }).join('');
  h+='</div></div>';
  return h;
}
/**
 * Modal do jogo. `evento_id` é OPCIONAL de propósito: ele registra a partida tendo
 * agendado ou não. O seletor de sessão segue o padrão contextual do fillDetalhe —
 * as opções dependem do DIA escolhido, e por isso são repintadas ao trocar a data.
 */
function openJogo(id){
  var j=id?JOGOS.find(function(x){return x.id===id;}):null;
  var isNew=!j;
  if(!j)j={id:'',data:isoOf(TODAY),modalidade:'Tennis',adversario:'',placar:'',resultado:'V',local:'',nota:'',evento_id:''};
  openModal('<div class="modal-head"><h3>'+(isNew?'Novo jogo':'Editar jogo')+'</h3><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="grid2"><div class="field"><label>Dia</label><input id="j_date" type="date" value="'+esc(j.data)+'" onchange="fillJogoEv()"></div>'+
      '<div class="field"><label>Modalidade</label><input id="j_mod" value="'+esc(j.modalidade||'')+'" placeholder="Tennis"></div></div>'+
    '<div class="field"><label>Adversário</label><input id="j_adv" value="'+esc(j.adversario||'')+'" placeholder="Nome de quem jogou contra"></div>'+
    '<div class="grid2"><div class="field"><label>Placar</label><input id="j_plac" value="'+esc(j.placar||'')+'" placeholder="Ex.: 6/4 3/6 7/5"></div>'+
      '<div class="field"><label>Resultado</label><select id="j_res"><option value="V"'+(j.resultado==='V'?' selected':'')+'>Vitória</option><option value="D"'+(j.resultado==='D'?' selected':'')+'>Derrota</option><option value=""'+(!j.resultado?' selected':'')+'>—</option></select></div></div>'+
    '<div class="field"><label>Local</label><input id="j_loc" value="'+esc(j.local||'')+'" placeholder="Ex.: Clube"></div>'+
    '<div class="field"><label>Sessão na agenda (opcional)</label><select id="j_ev"></select><div class="hint" id="j_evh"></div></div>'+
    '<div class="field"><label>Como foi</label><textarea id="j_nota" rows="3" placeholder="Leitura do jogo, o que funcionou, o que treinar…">'+esc(j.nota||'')+'</textarea></div>'+
    '</div>'+
    '<div class="modal-foot"><div>'+(isNew?'':'<button class="btn btn-sm btn-ghost" style="color:var(--miss)" onclick="delJogo(\''+j.id+'\')">Excluir</button>')+'</div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="saveJogo(\''+(j.id||'')+'\')">Salvar</button></div></div>');
  fillJogoEv(j.evento_id);
}
/** Sessões agendadas do DIA escolhido (Esporte/Jogo). Nenhuma? O jogo é avulso — e tudo bem. */
function fillJogoEv(sel){
  var w=el('j_ev');if(!w)return;
  var d=el('j_date').value;
  var evs=EVENTS.filter(function(e){return e.date===d&&(e.subtipo==='Esporte'||e.subtipo==='Jogo');})
    .sort(function(a,b){return toMin(a.start)-toMin(b.start);});
  var cur=(sel!==undefined&&sel!==null)?sel:w.value;
  w.innerHTML='<option value="">— nenhuma (jogo avulso) —</option>'+evs.map(function(e){
    return '<option value="'+esc(e.id)+'"'+(e.id===cur?' selected':'')+'>'+esc(e.start+' · '+e.titulo)+'</option>';}).join('');
  var hint=el('j_evh');
  if(hint)hint.textContent=evs.length?'Vincule à sessão deste dia, se quiser.':'Nada agendado neste dia — pode registrar assim mesmo.';
}
function saveJogo(id){
  var o={data:el('j_date').value,modalidade:el('j_mod').value.trim(),adversario:el('j_adv').value.trim(),
    placar:el('j_plac').value.trim(),resultado:el('j_res').value,local:el('j_loc').value.trim(),
    nota:el('j_nota').value.trim(),evento_id:el('j_ev').value};
  if(!o.data){toast('Escolha o dia');return;}
  if(!o.adversario&&!o.placar){toast('Diga ao menos o adversário ou o placar');return;}
  if(id){Object.assign(JOGOS.find(function(x){return x.id===id;}),o);}
  else{o.id=uniqJogoId();JOGOS.push(o);}
  saveJogos();closeModal();toast('Jogo salvo');renderSaude();
}
function delJogo(id){
  var j=JOGOS.find(function(x){return x.id===id;});if(!j)return;
  if(!confirm('Excluir o jogo de '+dLbl(j.data)+(j.adversario?(' contra '+j.adversario):'')+'?'))return;
  JOGOS=JOGOS.filter(function(x){return x.id!==id;});
  saveJogos();closeModal();toast('Jogo excluído');renderSaude();
}

/* ============================ LESÕES (registro clínico + boneco anatômico) ============================
 * Wizard de 6 passos portado da prior art do dono (fluxo clínico do PainReportWizard): boneco →
 * local → tipo → natureza → EVA → descrição. Nomenclatura clínica preservada (EVA, quirodáctilo,
 * aguda/crônica); ZERO vocabulário de modalidade. Anatomia é neutra.
 * DOIS pontos de entrada, MESMO wizard: checkbox no report do treino (lesão VINCULADA ao evento)
 * e botão "＋ Registrar lesão" na Saúde (lesão AVULSA). A contagem de ativas alimenta o risk score
 * (activeInjuriesCount → saudeProntidao). */
var INJ_MACRO=[
  {id:'head-neck',   label:'Cabeça / Pescoço',        lado:''},
  {id:'trunk',       label:'Tronco / Coluna / Pelve',  lado:''},
  {id:'upper-right', label:'Membro Superior Direito',  lado:'D'},
  {id:'upper-left',  label:'Membro Superior Esquerdo', lado:'E'},
  {id:'lower-right', label:'Membro Inferior Direito',  lado:'D'},
  {id:'lower-left',  label:'Membro Inferior Esquerdo', lado:'E'}
];
var INJ_MICRO={
  'head-neck':   ['Cabeça','Pescoço','Cervical Alta','Cervical Baixa'],
  'trunk':       ['Trapézio','Coluna Torácica','Coluna Lombar','Costelas','Abdômen','Sacro / Cóccix','Pelve'],
  'upper-right': ['Ombro','Braço','Cotovelo','Antebraço','Punho','Mão'],
  'upper-left':  ['Ombro','Braço','Cotovelo','Antebraço','Punho','Mão'],
  'lower-right': ['Quadril','Coxa','Joelho','Perna','Tornozelo','Pé'],
  'lower-left':  ['Quadril','Coxa','Joelho','Perna','Tornozelo','Pé']
};
var INJ_TIPOS=[['Muscular','No músculo — piora com contração'],['Articular','Na articulação — piora com movimento'],['Tendinosa','No tendão — piora com esforço específico'],['Óssea','No osso — dor intensa e localizada']];
var INJ_NAT=[['aguda','Aguda','Aconteceu agora ou nas últimas horas'],['crônica','Crônica','Persiste há semanas ou meses']];
/* Dedos individuais com a nomenclatura clínica do dono. Membro superior → quirodáctilos (QDD dir. /
 * QDE esq.); inferior → pododáctilos (PDD / PDE). O código curto é o 1º token do descritivo (antes do parêntese). */
function injFingers(macroId){
  var isUpper=(macroId==='upper-right'||macroId==='upper-left');
  var lado=(macroId==='upper-right'||macroId==='lower-right')?'D':'E';
  var pre=(isUpper?'QD':'PD')+lado;
  var names=isUpper?['polegar','indicador','médio','anelar','mínimo']:['hálux','','','','mínimo'];
  var out=[],i;
  for(i=0;i<5;i++){var code=(i+1)+'º'+pre;out.push({code:code,desc:code+(names[i]?(' ('+names[i]+')'):'')});}
  return out;
}
function injIsFinger(s){return !!s&&(s.indexOf('QD')>=0||s.indexOf('PD')>=0);}
function injMacroByLabel(lbl){for(var i=0;i<INJ_MACRO.length;i++)if(INJ_MACRO[i].label===lbl)return INJ_MACRO[i];return null;}
function injEvaCor(n){if(n==null)return 'var(--line)';if(n<=2)return '#10b981';if(n<=4)return '#84cc16';if(n<=6)return '#eab308';if(n<=8)return '#f97316';return '#ef4444';}
function injEvaLbl(n){if(n==null)return '';if(n===0)return 'Sem dor';if(n<=3)return 'Leve';if(n<=6)return 'Moderada';if(n<=8)return 'Intensa';if(n===9)return 'Muito intensa';return 'Máxima';}
/* FUNCIONAL (0–10): quanto a lesão ATRAPALHA, não quanto dói. 0 = função muito limitada;
 * 10 = função plena. Escala INVERTIDA da EVA — verde é o topo (bom), vermelho é o piso. */
function injFuncCor(n){if(n==null)return 'var(--line)';if(n<=2)return '#ef4444';if(n<=4)return '#f97316';if(n<=6)return '#eab308';if(n<=8)return '#84cc16';return '#10b981';}
function injFuncLbl(n){if(n==null)return '';if(n<=1)return 'Muito limitado';if(n<=3)return 'Limitado';if(n<=6)return 'Parcial';if(n<=8)return 'Quase pleno';return 'Função plena';}
/* Log de evolução da lesão: array [{d,eva,func,nota?}]. Guardado como JSON no campo `evolucao`
 * (texto numa célula). Lesão SEM log (as antigas) → sintetiza a 1ª entrada do estado inicial
 * (eva congelada em `eva`, func desconhecido). Sempre devolve ≥1 entrada. */
function evolParse(l){
  if(!l)return [];
  var raw=l.evolucao;
  if(raw&&typeof raw==='string'){try{var a=JSON.parse(raw);if(a&&a.length)return a;}catch(e){}}
  else if(raw&&raw.length)return raw;   /* defensivo: já veio array */
  var ev=(l.eva===''||l.eva==null)?null:Number(l.eva);
  return [{d:l.inicio||l.data||'',eva:ev,func:null}];
}
function evolCur(l){var a=evolParse(l);return a[a.length-1]||{eva:null,func:null,d:''};}
function evolFirst(l){var a=evolParse(l);return a[0]||{eva:null,func:null,d:''};}
function uniqLesaoId(){var id;do{id='lesao-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e7).toString(36);}while(LESOES.some(function(l){return l.id===id;}));return id;}

var INJ_TMP={editId:'',evento_id:'',step:1,macroId:'',regiao:'',lado:'',dedoMode:false,local:'',tipo:'',natureza:'',eva:5,inicio:'',descricao:''};
/* Data do EVENTO vinculado (''=avulsa/não achado). Mesmo espírito do `jo={data:e.date}` do
 * saveRpe: quem conhece a sessão herda a data DELA, nunca a de hoje. */
function injEvDate(id){if(!id)return '';var e=EVENTS.find(function(x){return x.id===id;});return (e&&e.date)||'';}
/** Abre o wizard. eventoId → vincula ao treino (checkbox); editId → edita lesão existente (prefill).
 *  DATA DE INÍCIO ≠ data do REGISTRO: veio de uma sessão? o default é a data DAQUELA SESSÃO.
 *  (Bug real: lesões de 16/07 e 02/07 nasceram com 17/07 — o dia em que foram digitadas.)
 *  Só cai em hoje na lesão avulsa ou quando o evento não é achado. O campo segue editável. */
function openInjuryWizard(eventoId,editId){
  var evIso=injEvDate(eventoId);
  var b={editId:editId||'',evento_id:eventoId||'',step:1,macroId:'',regiao:'',lado:'',dedoMode:false,local:'',tipo:'',natureza:'',eva:5,inicio:(evIso||isoOf(TODAY)),descricao:''};
  if(editId){
    var l=null,i;for(i=0;i<LESOES.length;i++)if(LESOES[i].id===editId)l=LESOES[i];
    if(l){var m=injMacroByLabel(l.regiao);
      b.macroId=m?m.id:'';b.regiao=l.regiao||'';b.lado=l.lado||'';b.local=l.local||'';b.dedoMode=injIsFinger(l.local);
      b.tipo=l.tipo||'';b.natureza=l.natureza||'';b.eva=(l.eva===''||l.eva==null)?5:Number(l.eva);
      b.evento_id=l.evento_id||'';b.descricao=l.descricao||'';
      /* Edição NUNCA reescreve o que já está gravado — o hint do passo 6 é que avisa quando a
         sessão vinculada é de outro dia. Correção é do dono, não automática. */
      b.inicio=l.inicio||l.data||injEvDate(b.evento_id)||isoOf(TODAY);}
  }
  INJ_TMP=b;injRender();
}
/* Declara a BASE da data: de onde veio o default, ou aviso de divergência com a sessão.
 * Só explica — jamais altera o campo. Repintado quando data/sessão mudam (injIniHintSync). */
function injIniHintHTML(){
  var d=injEvDate(INJ_TMP.evento_id),ini=INJ_TMP.inicio||'';
  var txt;
  if(!d)txt='Lesão avulsa — o padrão é hoje. Ajuste se a dor começou antes.';
  else if(d===ini)txt='Data da sessão vinculada ('+dLbl(d)+') — ajuste se a dor começou em outro dia.';
  else txt='⚠️ A sessão vinculada é de '+dLbl(d)+' — confira se a data acima está certa.';
  return '<div class="hint" id="inj_ini_hint">'+esc(txt)+'</div>';
}
function injIniHintSync(){injStash();var h=el('inj_ini_hint');if(h)h.outerHTML=injIniHintHTML();}
/** Guarda o que o passo atual tem em campos de texto ANTES de trocar de passo (senão o
 *  usuário perde o que digitou ao Voltar). RPE/EVA já vivem em INJ_TMP ao vivo. */
function injStash(){if(INJ_TMP.step===6){var i=el('inj_ini'),d=el('inj_desc'),v=el('inj_ev');if(i)INJ_TMP.inicio=i.value;if(d)INJ_TMP.descricao=d.value;if(v)INJ_TMP.evento_id=v.value;}}
/* Sessões (Treino/Esporte FEITAS) às quais uma lesão pode ser vinculada — mesmo espírito do
 * fillJogoEv, mas por RECÊNCIA (não por dia): a lesão avulsa antiga aponta pra sessão que a
 * causou e passa a aparecer no card do treino. A atual (fora da janela) é sempre incluída. */
function injEvOptionsHTML(sel){
  var evs=EVENTS.filter(function(e){return (e.subtipo==='Treino'||e.subtipo==='Esporte'||e.subtipo==='Jogo')&&e.status==='done';})
    .sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(toMin(b.start)-toMin(a.start)));}).slice(0,40);
  if(sel&&!evs.some(function(e){return e.id===sel;})){var c=EVENTS.find(function(e){return e.id===sel;});if(c)evs.unshift(c);}
  return '<option value="">— nenhuma —</option>'+evs.map(function(e){
    return '<option value="'+esc(e.id)+'"'+(e.id===sel?' selected':'')+'>'+esc(dLbl(e.date)+' · '+e.titulo)+'</option>';}).join('');
}

    reg('head-neck','<circle cx="70" cy="28" r="22"/><rect x="63" y="50" width="14" height="12" rx="4"/>','Cabeça / Pescoço')+
    reg('trunk','<rect x="34" y="60" width="72" height="88" rx="8"/>','Tronco / Coluna / Pelve')+
    reg('upper-right','<rect x="8" y="65" width="24" height="60" rx="9"/><rect x="8" y="127" width="24" height="46" rx="9"/>','Membro Superior Direito')+
    reg('upper-left','<rect x="108" y="65" width="24" height="60" rx="9"/><rect x="108" y="127" width="24" height="46" rx="9"/>','Membro Superior Esquerdo')+

/** Mão/Pé são pontos de DRILL-DOWN, não folhas: clicar abre a mão/pé inteira + os dedos

function injIsDrill(m){return m==='Mão'||m==='Pé';}

  return h;

function injRender(){
  var s=INJ_TMP.step,body='',foot='';
  if(s===1){body='<div class="injmap">'+injBodySVG()+'<div class="injmap-leg">Toque na região com dor · <b>D</b> = direito · <b>E</b> = esquerdo</div></div>';}
  else if(s===2){body=injStep2HTML();}
  else if(s===3){body='<div class="injopts">'+INJ_TIPOS.map(function(t){return '<button type="button" class="injopt block'+(INJ_TMP.tipo===t[0]?' sel':'')+'" onclick="injPickTipo(\''+t[0]+'\')"><span>'+esc(t[0])+'</span><span class="injopt-d">'+esc(t[1])+'</span></button>';}).join('')+'</div>';}
  else if(s===4){body='<div class="injopts">'+INJ_NAT.map(function(n){return '<button type="button" class="injopt block'+(INJ_TMP.natureza===n[0]?' sel':'')+'" onclick="injPickNat(\''+n[0]+'\')"><span>'+esc(n[1])+'</span><span class="injopt-d">'+esc(n[2])+'</span></button>';}).join('')+'</div>';}
  else if(s===5){body=injEvaHTML();foot='<button class="btn btn-sm btn-primary" onclick="injGo(6)">Próximo ›</button>';}
  else if(s===6){body='<div class="field"><label>Data de início</label><input id="inj_ini" type="date" value="'+esc(INJ_TMP.inicio||isoOf(TODAY))+'" onchange="injIniHintSync()">'+injIniHintHTML()+'</div>'+
      '<div class="field"><label>Sessão que causou (opcional)</label><select id="inj_ev" onchange="injIniHintSync()">'+injEvOptionsHTML(INJ_TMP.evento_id)+'</select><div class="hint">Vincule a um treino ou esporte já feito — a lesão passa a aparecer no card daquela sessão.</div></div>'+
      '<div class="field"><label>Descrição (opcional)</label><textarea id="inj_desc" rows="3" placeholder="Quando apareceu, o que piora, o que melhora…">'+esc(INJ_TMP.descricao||'')+'</textarea></div>';
    foot='<button class="btn btn-sm btn-primary" onclick="injFinish()">'+(INJ_TMP.editId?'Salvar lesão':'Registrar lesão')+'</button>';}
  var back=(s>1)?'<button type="button" class="injback" onclick="injBack()">‹ Voltar</button>':'<span></span>';
  openModal('<div class="modal-head"><h3>🩹 '+(INJ_TMP.editId?'Editar lesão':'Registrar lesão')+'</h3><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body injwiz">'+injStepHTML()+body+'</div>'+
    '<div class="modal-foot">'+back+'<div style="display:flex;gap:8px;align-items:center">'+foot+'</div></div>');
  /* EVA: estrutura já saiu no body (1x por render) → pinta MUTANDO → liga o trackBind.
     Mesma ordem e mesma regra do openRpe: o #inj_track não pode ser recriado durante o arrasto. */
  if(s===5){injPaintEva();injEvaBind();}
}
/* EVA — reaproveita o trackBind (mouse+toque) das levas 1/2. Pinta mutando (thumb/número

    '<div class="eva-track empty" id="inj_track" role="slider" tabindex="0" aria-label="Intensidade da dor (EVA)" aria-valuemin="0" aria-valuemax="10">'+

function injPaintEva(){
  var v=INJ_TMP.eva,col=injEvaCor(v),t=el('inj_track');if(!t)return;
  var th=el('inj_thumb'),n=el('inj_evan'),l=el('inj_eval');
  th.style.left=((v==null)?0:(v/10*100))+'%';th.style.background=col;th.style.display=(v==null)?'none':'';
  n.textContent=(v==null)?'—':String(v);n.style.color=(v==null)?'var(--muted)':col;
  l.textContent=injEvaLbl(v);
  if(v==null)t.classList.add('empty');else t.classList.remove('empty');
  t.setAttribute('aria-valuenow',(v==null)?'':String(v));
  t.setAttribute('aria-valuetext',(v==null)?'não preenchido':(v+' — '+injEvaLbl(v)));
}
/* O dono CORRIGIU a data de início na edição? A 1ª entrada do log (estado inicial) anda junto —
 * senão o gráfico de evolução continua começando no dia em que a lesão foi digitada. Mexe SÓ na
 * entrada que estava ancorada no início antigo, nunca nas avaliações posteriores, e só se a nova
 * data não passar por cima da avaliação seguinte. Não é correção automática: é o dono editando. */
function injSyncEvolIni(l,novoIni){
  var old=l.inicio||l.data||'';
  if(!novoIni||!old||novoIni===old)return;
  var a=evolParse(l).slice();
  if(!a.length||a[0].d!==old)return;
  if(a.length>1&&a[1].d&&novoIni>a[1].d)return;
  a[0]=Object.assign({},a[0],{d:novoIni});
  l.evolucao=JSON.stringify(a);
}
function injEvaBind(){var t=el('inj_track');if(!t)return;trackBind(t,{rng:function(){return {lo:0,hi:10};},step:1,get:function(){return INJ_TMP.eva;},set:function(v){INJ_TMP.eva=Math.max(0,Math.min(10,Math.round(v)));injPaintEva();}});}
function injFinish(){
  injStash();
  if(!INJ_TMP.macroId||!INJ_TMP.local){toast('Escolha a região e o local');return;}
  if(!INJ_TMP.tipo){toast('Escolha o tipo de dor');return;}
  if(!INJ_TMP.natureza){toast('Escolha a natureza');return;}
  /* `inicio` = quando a lesão COMEÇOU (herdada da sessão, editável). Último fallback ainda é a
     sessão vinculada — hoje só quando não há sessão nenhuma. */
  var o={regiao:INJ_TMP.regiao,local:INJ_TMP.local,lado:INJ_TMP.lado||'',tipo:INJ_TMP.tipo,natureza:INJ_TMP.natureza,
    eva:(INJ_TMP.eva==null?'':INJ_TMP.eva),inicio:(INJ_TMP.inicio||injEvDate(INJ_TMP.evento_id)||isoOf(TODAY)),descricao:(INJ_TMP.descricao||'').trim(),evento_id:INJ_TMP.evento_id||''};
  if(INJ_TMP.editId){var ex=LESOES.find(function(x){return x.id===INJ_TMP.editId;});if(ex){injSyncEvolIni(ex,o.inicio);Object.assign(ex,o);}}   /* preserva id/data/status/fim/evolucao */
  else{o.id=uniqLesaoId();o.data=isoOf(TODAY);o.status='ativa';o.fim='';   /* `data` = dia do REGISTRO (auditoria), nunca usado como início */
    /* 1ª entrada do log = estado inicial (dor da EVA; funcional ainda desconhecido). */
    o.evolucao=JSON.stringify([{d:o.inicio,eva:(o.eva===''?null:o.eva),func:null}]);
    LESOES.push(o);}
  saveLesoes();closeModal();toast(INJ_TMP.editId?'Lesão atualizada ✓':'Lesão registrada ✓');
  if(page==='saude')renderSaude();else renderAgenda();
}

function openLesaoUpdate(id){
  var l=LESOES.find(function(x){return x.id===id;});if(!l)return;
  var cur=evolCur(l);
  /* Aqui HOJE é o certo: `d` é a data da AVALIAÇÃO (como a lesão está agora), não a do início
     da lesão — nada a herdar de sessão. Campo editável para lançar avaliação de outro dia. */
  LUP_TMP={id:id,eva:(cur.eva==null||cur.eva==='')?5:Number(cur.eva),func:(cur.func==null||cur.func==='')?5:Number(cur.func),d:isoOf(TODAY),nota:''};
  openModal('<div class="modal-head"><h3>📈 Atualizar lesão</h3><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="hint">'+esc((l.regiao||'')+(l.local?(' · '+l.local):''))+' — como está hoje.</div>'+
    lupEvaHTML()+lupFuncHTML()+
    '<div class="field"><label>Data</label><input id="lup_date" type="date" value="'+esc(LUP_TMP.d)+'"></div>'+
    '<div class="field"><label>Nota (opcional)</label><textarea id="lup_nota" rows="2" placeholder="O que mudou, o que ajudou…"></textarea></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-sm btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="saveLesaoUpdate()">Salvar</button></div>');
  lupPaintEva();lupPaintFunc();lupBind();
}
function saveLesaoUpdate(){
  var l=LESOES.find(function(x){return x.id===LUP_TMP.id;});if(!l){closeModal();return;}
  var di=el('lup_date'),d=(di&&di.value)||isoOf(TODAY);
  var nt=el('lup_nota'),nota=nt?nt.value.trim():'';
  var a=evolParse(l).slice();   /* materializa a 1ª entrada (estado inicial) se ainda era sintética */
  var e={d:d,eva:LUP_TMP.eva,func:LUP_TMP.func};if(nota)e.nota=nota;
  a.push(e);
  l.evolucao=JSON.stringify(a);
  saveLesoes();closeModal();
  if(l.status==='ativa'&&LUP_TMP.func>=8&&LUP_TMP.eva<=2)toast('Função quase plena — pode marcar como recuperada');
  else toast('Evolução registrada ✓');
  if(page==='saude')renderSaude();else renderAgenda();
}

/* ---- Registro de lesões na página Saúde (bloco à parte) ----
 * Filtro + paginação no MESMO padrão do bloco de Treinos (sauTr*), pelos mesmos motivos:
 *  · filtro de STATUS, default ATIVAS. Lesão recuperada é histórico: deixar o card apagado
 *    na tela para sempre só engorda o bloco e enterra o que ainda dói.
 *  · filtro de DATA só por MÊS/ANO e derivado DO DADO (os meses que têm lesão) — nunca uma
 *    lista fixa de períodos, que geraria opção morta. O universo do seletor é TODAS as lesões,
 *    não o status corrente, para o mês escolhido não sumir debaixo do dedo ao trocar de status
 *    (mesma convenção dos chips de modalidade dos treinos).
 *  · PAGINAÇÃO de SAU_LESAO_PG por página. Mantido o N dos treinos (7): a linha de lesão é
 *    mais alta que o card de treino, então 7 já enche a tela — subir o número só devolveria
 *    a rolagem infinita que a paginação veio matar.
 * A data que manda no filtro é a de INÍCIO (l.inicio||l.data) — a mesma que o card exibe.
 * Estado só em memória (não persiste): trocar filtro volta pra página 1. O repaint é do
 * MIOLO do card (`sauLsPaint` → innerHTML de #sauLsCard), nunca `renderSaude()` inteiro —
 * reconstruir a página a cada clique faz o scroll pular (mesmo bug já corrigido na agenda). */
var SAU_LESAO_PG=7;        // lesões por página (fixo)
var SAU_LS_ST='ativa';     // 'ativa' | 'rec' | '*'
var SAU_LS_MES='*';        // '*' = todos os meses | 'AAAA-MM'
var SAU_LS_PG=1;           // página atual, 1-based (clampada no render)
function lesaoCod(l){var loc=String(l.local||'');return injIsFinger(loc)?loc.split(' ')[0]:loc;}
/** Data de início da lesão (o card mostra esta mesma) e o mês dela, 'AAAA-MM'. */
function lesaoIni(l){return String(l.inicio||l.data||'');}
function lesaoMes(l){var d=lesaoIni(l);return (d.length>=7)?d.slice(0,7):'';}
/** 'AAAA-MM' → 'mmm/AAAA' (mês e ano, sem dia — é a granularidade do filtro). */
function mesLbl(k){var p=String(k).split('-');return (MON[Number(p[1])-1]||'?')+'/'+p[0];}
/** Ordem canônica: ativas primeiro, depois por início decrescente. */
function lesoesOrd(){
  return LESOES.slice().sort(function(a,b){var aa=(a.status==='ativa')?0:1,bb=(b.status==='ativa')?0:1;if(aa!==bb)return aa-bb;var ai=lesaoIni(a),bi=lesaoIni(b);return ai<bi?1:(ai>bi?-1:0);});
}
/** Meses que EXISTEM no dado, mais recente primeiro. Universo do seletor. */
function lesoesMeses(){
  var seen={},out=[];
  LESOES.forEach(function(l){var k=lesaoMes(l);if(k&&!seen[k]){seen[k]=1;out.push(k);}});
  out.sort(function(a,b){return a<b?1:(a>b?-1:0);});
  return out;
}
function lesoesDoMes(){var o=lesoesOrd();return (SAU_LS_MES==='*')?o:o.filter(function(l){return lesaoMes(l)===SAU_LS_MES;});}
function lesoesFiltradas(){var ms=lesoesDoMes();return (SAU_LS_ST==='*')?ms:ms.filter(function(l){return (l.status==='ativa')===(SAU_LS_ST==='ativa');});}
function sauLsSetSt(s){SAU_LS_ST=s;SAU_LS_PG=1;sauLsPaint();}
function sauLsSetMes(m){SAU_LS_MES=m||'*';SAU_LS_PG=1;sauLsPaint();}
function sauLsNav(n){SAU_LS_PG+=n;sauLsPaint();}   /* clamp fica no render — extremo já vem desabilitado */
function sauLsPaint(){var n=el('sauLsCard');if(n)n.innerHTML=sauLsInnerHTML();else renderSaude();}
function saudeLesoesHTML(){
  var ls=lesoesOrd();
  var nat=0;ls.forEach(function(l){if(l.status==='ativa')nat++;});
  var h='<div class="grp-h" style="display:flex;align-items:center;gap:8px">🩹 Lesões'+
    (ls.length?'<span class="muted" style="font-weight:400">· '+nat+' ativa'+(nat===1?'':'s')+' de '+ls.length+'</span>':'')+
    '<span style="flex:1"></span><button class="btn btn-sm" onclick="openInjuryWizard(\'\')">＋ Registrar lesão</button></div>';
  if(!ls.length)return h+'<div class="card"><div class="hempty">Nenhuma lesão registrada.</div></div>';
  return h+'<div class="card" id="sauLsCard">'+sauLsInnerHTML()+'</div>';
}
function sauLsInnerHTML(){
  /* O mês selecionado pode ter DEIXADO de existir (a última lesão dele foi excluída ou teve a
     data corrigida). Sem esta normalização o <select> cairia na 1ª opção ("Todos os meses")
     enquanto a lista continuaria filtrada por um mês vazio — tela mentindo. */
  var ms=lesoesMeses();
  if(SAU_LS_MES!=='*'&&ms.indexOf(SAU_LS_MES)<0){SAU_LS_MES='*';SAU_LS_PG=1;}
  var mes=lesoesDoMes(),list=lesoesFiltradas();
  /* Contagens dos botões de status = dentro do MÊS corrente (informação útil: "0 ativas
     em jun/2026" diz que o mês está limpo, não que o filtro quebrou). */
  var nAt=0,nRe=0;
  mes.forEach(function(l){if(l.status==='ativa')nAt++;else nRe++;});
  function stBtn(v,lbl,n){
    return '<button class="'+(SAU_LS_ST===v?'active':'')+'" onclick="sauLsSetSt(\''+v+'\')">'+esc(lbl)+' '+n+'</button>';
  }
  var sel='<select class="sau-lssel" aria-label="Filtrar lesões por mês" onchange="sauLsSetMes(this.value)">'+
    '<option value="*"'+(SAU_LS_MES==='*'?' selected':'')+'>Todos os meses</option>'+
    ms.map(function(k){return '<option value="'+esc(k)+'"'+(SAU_LS_MES===k?' selected':'')+'>'+esc(mesLbl(k))+'</option>';}).join('')+
    '</select>';
  var h='<div class="sau-lsbar"><div class="seg">'+
    stBtn('ativa','Ativas',nAt)+stBtn('rec','Recuperadas',nRe)+stBtn('*','Todas',mes.length)+
    '</div>'+sel+'</div>';
  if(!list.length){
    var qual=(SAU_LS_ST==='ativa')?'ativa':((SAU_LS_ST==='rec')?'recuperada':'registrada');
    var quando=(SAU_LS_MES==='*')?'no histórico':('em '+mesLbl(SAU_LS_MES));
    return h+'<div class="hempty">Nenhuma lesão '+qual+' '+quando+' — troque o filtro acima.</div>';
  }
  var pages=Math.max(1,Math.ceil(list.length/SAU_LESAO_PG));
  if(SAU_LS_PG>pages)SAU_LS_PG=pages; if(SAU_LS_PG<1)SAU_LS_PG=1;
  var pg=list.slice((SAU_LS_PG-1)*SAU_LESAO_PG,(SAU_LS_PG-1)*SAU_LESAO_PG+SAU_LESAO_PG);
  h+='<div class="sau-list">'+pg.map(lesaoRowHTML).join('')+'</div>';
  h+='<div class="sau-lspg">'+
    '<button class="icbtn"'+(SAU_LS_PG<=1?' disabled':'')+' onclick="sauLsNav(-1)" aria-label="Página anterior">‹</button>'+
    '<span>página '+SAU_LS_PG+' de '+pages+'</span>'+
    '<button class="icbtn"'+(SAU_LS_PG>=pages?' disabled':'')+' onclick="sauLsNav(1)" aria-label="Próxima página">›</button>'+
    '<span class="sau-lspg-n">'+list.length+(list.length===1?' lesão':' lesões')+' no filtro</span>'+
  '</div>';
  return h;
}
function lesaoRowHTML(l){
    var ativa=(l.status==='ativa'),cod=lesaoCod(l);
    /* Estado ATUAL (última entrada do log), com a tendência vs. o inicial. A lesão deixa
       de ficar travada no valor de EVA da criação — a costela "aguda 7" pode virar "7→2". */
    var cur=evolCur(l),ini=evolFirst(l);
    var evn=(cur.eva==null||cur.eva==='')?null:Number(cur.eva);
    var fnc=(cur.func==null||cur.func==='')?null:Number(cur.func);
    var iniEva=(ini.eva==null||ini.eva==='')?null:Number(ini.eva);
    var tags='<span class="sau-tag">'+esc(cod)+'</span>'+(l.lado?'<span class="sau-tag">'+(l.lado==='D'?'dir.':'esq.')+'</span>':'');
    var meta=[];if(l.tipo)meta.push(esc(l.tipo));if(l.natureza)meta.push(esc(l.natureza));
    if(evn!=null){
      var evaTxt='EVA '+evn+'/10';
      if(iniEva!=null&&iniEva!==evn)evaTxt='EVA '+iniEva+'→'+evn+(evn<iniEva?' ↓':' ↑');
      meta.push(evaTxt);
    }
    if(fnc!=null)meta.push('funcional '+fnc+'/10');
    if(l.evento_id&&EVENTS.some(function(e){return e.id===l.evento_id;}))meta.push('🗓️ na sessão');
    var bar=(evn!=null)?'<div class="eva-bar"><div class="eva-bar-f" style="width:'+(evn/10*100)+'%;background:'+injEvaCor(evn)+'"></div></div>':'';
    var recHint=(ativa&&fnc!=null&&fnc>=8&&evn!=null&&evn<=2)?'<div class="sau-row-n" style="color:var(--ok,#1F9D57)">Função quase plena e dor baixa — pode marcar como recuperada.</div>':'';
    return '<div class="sau-row'+(ativa?'':' pend')+'">'+
      '<div class="sau-row-d">'+esc(dLbl(l.inicio||l.data))+'</div>'+
      '<div class="sau-row-m">'+
        '<div class="sau-row-t">'+esc(l.regiao||'')+' · '+esc(l.local||'')+tags+'<span class="lstat '+(ativa?'ativa':'rec')+'">'+(ativa?'ativa':'recuperada')+'</span></div>'+
        (meta.length?'<div class="sau-row-met">'+meta.join(' · ')+'</div>':'')+bar+recHint+
        (!ativa&&l.fim?'<div class="sau-row-met">recuperada em '+esc(dLbl(l.fim))+'</div>':'')+
        (l.descricao?'<div class="sau-row-n">'+esc(l.descricao)+'</div>':'')+
      '</div>'+
      '<div class="sau-acts">'+
        (ativa?'<button class="icbtn" title="Atualizar dor e função" onclick="openLesaoUpdate(\''+l.id+'\')">📈</button>':'')+
        '<button class="icbtn" title="'+(ativa?'Marcar recuperada':'Reabrir')+'" onclick="toggleLesaoStatus(\''+l.id+'\')">'+(ativa?'✔':'↺')+'</button>'+
        '<button class="icbtn" title="Editar" onclick="openInjuryWizard(\'\',\''+l.id+'\')">✎</button>'+
        '<button class="icbtn" title="Excluir" onclick="delLesao(\''+l.id+'\')">×</button>'+
      '</div>'+
    '</div>';
}
function toggleLesaoStatus(id){
  var l=LESOES.find(function(x){return x.id===id;});if(!l)return;
  if(l.status==='ativa'){l.status='recuperada';l.fim=isoOf(TODAY);}else{l.status='ativa';l.fim='';}
  saveLesoes();toast(l.status==='ativa'?'Lesão reaberta':'Lesão recuperada ✓');
  if(page==='saude')renderSaude();else renderAgenda();
}
function delLesao(id){
  var l=LESOES.find(function(x){return x.id===id;});if(!l)return;
  if(!confirm('Excluir a lesão em '+(l.regiao||'—')+(l.local?(' · '+l.local):'')+'?'))return;
  LESOES=LESOES.filter(function(x){return x.id!==id;});
  saveLesoes();toast('Lesão excluída');
  if(page==='saude')renderSaude();else renderAgenda();
}

/* ============================ COMPROMISSOS FINANCEIROS (cat:'fin') ============================
 * Recorrentes, guardados como config (sem migrar schema): ordem=dia do mês, pai=regra de dia útil
 * ('exato'|'antes'|'depois'), cor=periodicidade (''=mensal | 'tri:1,4,7,10'=trimestral, meses 1-based).
 * Ajuste de dia útil considera fins de semana + feriados NACIONAIS FIXOS (móveis/municipais não). */
var BR_HOL=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];  // nacionais de data fixa
function isBizDay(d){var wd=d.getDay();if(wd===0||wd===6)return false;return BR_HOL.indexOf(pad(d.getMonth()+1)+'-'+pad(d.getDate()))<0;}
function finMonths(cor){var m=/^tri:([\d,]+)/.exec(cor||'');return m?m[1].split(',').map(function(x){return (+x)-1;}):null;}   // →0-based, null=mensal
function finApplies(item,m0){var mm=finMonths(item.cor);return !mm||mm.indexOf(m0)>=0;}
function finEffDate(dia,rule,y,m0){var dim=new Date(y,m0+1,0).getDate();var d=new Date(y,m0,Math.min(dia,dim));if(rule==='exato')return d;var step=(rule==='antes')?-1:1;var g=0;while(!isBizDay(d)&&g<15){d.setDate(d.getDate()+step);g++;}return d;}
function finUpcoming(win){var t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());var end=new Date(t);end.setDate(end.getDate()+win);var out=[];
  byCat('fin').forEach(function(it){[0,1].forEach(function(mo){var ref=new Date(t.getFullYear(),t.getMonth()+mo,1);if(!finApplies(it,ref.getMonth()))return;var d=finEffDate(+it.ordem||1,it.pai||'exato',ref.getFullYear(),ref.getMonth());if(d>=t&&d<=end)out.push({item:it,date:d});});});
  out.sort(function(a,b){return a.date-b.date;});return out;}
function finRelDay(d){var t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());var n=Math.round((d-t)/86400000);return n===0?'hoje':(n===1?'amanhã':'em '+n+' dias');}
var FIN_RULES={exato:'no dia exato',antes:'ou dia útil anterior',depois:'ou dia útil posterior'};
function finRuleLabel(c){return (+c.ordem===1&&c.pai==='depois')?'1º dia útil':(FIN_RULES[c.pai||'exato']||'');}
/* NÃO recriar uma lista-padrão de compromissos aqui.
 * Existia um FIN_PRESETS (+ finSeedDefaults) com os compromissos REAIS do usuário
 * hardcoded no cliente. O `docs/` publicado é a casca — ou seja, o código do cliente
 * VAI para um repositório público: a lista deixava cartões, dívida, escolas, contador
 * e perfil tributário legíveis para qualquer um, sem ele ter escolhido isso.
 * É a mesma regra do CLAUDE.md ("NUNCA espelhar a taxonomia viva do usuário no seed"),
 * aqui pelo motivo mais forte: no cliente, seed = publicação.
 * Bootstrap de compromisso é pelo botão "＋ Compromisso" (dado nasce do usuário, no BD). */
function sysFin(){
  var items=byCat('fin');
  var h='<div class="muted" style="font-size:12px;margin-bottom:8px">Compromissos <b>recorrentes</b> (dia do mês + regra de dia útil). Aparecem na Home (próximos vencimentos) e servem de base para os itens de agenda. Ajuste considera fins de semana + feriados nacionais fixos.</div>';
  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px"><button class="btn btn-sm btn-primary" onclick="openFin(\'\')">＋ Compromisso</button></div>';
  if(!items.length)return h+'<div class="hempty" style="text-align:center;padding:22px">Nenhum compromisso ainda.<br>Clique em <b>＋ Compromisso</b> para cadastrar o primeiro.</div>';
  h+='<table class="tbl"><thead><tr><th style="width:56px">Dia</th><th>Compromisso</th><th style="width:160px">Regra</th><th style="width:96px">Período</th><th style="width:76px">Ações</th></tr></thead><tbody>';
  items.forEach(function(c){h+='<tr><td><b>'+esc(String(c.ordem||''))+'</b></td><td>'+esc(c.valor)+'</td><td class="muted" style="font-size:12px">'+esc(finRuleLabel(c))+'</td><td class="muted" style="font-size:12px">'+(finMonths(c.cor)?'Trimestral':'Mensal')+'</td><td><button class="icbtn" onclick="openFin(\''+c.id+'\')">✎</button> <button class="icbtn" onclick="delCfg(\''+c.id+'\')">×</button></td></tr>';});
  return h+'</tbody></table>';

/* ============================ LIVROS (cat:'livro') ============================
 * Guardados como config sem migrar schema: valor=título, pai=status ('espera'|'lendo'|'lido'),
 * cor="iniciado|concluido" (ISO), ordem. "Em leitura" = livro ativo; tempo de leitura = dias início→fim.
 * Ao marcar um evento Leitura→Livro como feito, o app usa o livro ativo (pergunta se houver >1). */
var LIVRO_ST={espera:'Na lista de espera',lendo:'Em leitura',lido:'Lido'};
function livros(){return CFG.filter(function(x){return x.cat==='livro';}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function livrosByStatus(s){return livros().filter(function(l){return (l.pai||'espera')===s;});}
function livroDts(l){var p=String(l.cor||'').split('|');return {ini:p[0]||'',fim:p[1]||'',horas:parseFloat(p[2])||0,modo:p[3]||''};}
function livroSetDts(l,d){l.cor=(d.ini||'')+'|'+(d.fim||'')+'|'+(d.horas||0)+'|'+(d.modo||'');}
function livroModoLbl(m){return {fisico:'📕 Físico',kindle:'📱 Kindle',phygital:'📖 Phygital'}[m]||'';}
function daysBetween(a,b){return Math.max(0,Math.round((parseISO(b)-parseISO(a))/86400000));}
/** Frase de tempo AMARRADA AO STATUS (não só à presença das datas): 'lido em' só para livro
 *  lido, 'lendo há' só para livro em leitura. Como as datas agora são preservadas ao voltar
 *  para 'espera' (ver livroApplyStatus), sem essa amarração um livro na espera exibiria
 *  tempo de leitura. Datas guardadas, simplesmente não narradas. */
function livroDiasLbl(n){return n+' dia'+(n===1?'':'s');}
function livroTempo(l){var d=livroDts(l),st=(l.pai||'espera'),hrs=livroHoras(l),parts=[];
  if(st==='lido'&&d.ini&&d.fim)parts.push('lido em '+livroDiasLbl(daysBetween(d.ini,d.fim)||1));
  else if(st==='lendo'&&d.ini)parts.push('lendo há '+livroDiasLbl(daysBetween(d.ini,isoOf(TODAY))||0));
  if(hrs)parts.push(fmtHm(hrs)+' lidas'+livroHorasComp(l));if(d.modo)parts.push(livroModoLbl(d.modo));return parts.join(' · ');}
function sysLivros(){
  var h='<div class="muted" style="font-size:12px;margin-bottom:8px">Seus livros por status. <b>Em leitura</b> = livro ativo. O <b>tempo de leitura</b> conta os dias de início→fim — e essas datas são <b>suas</b>: edite o livro (✎) e corrija <b>Início</b>/<b>Fim</b> se começou antes de cadastrar aqui. Mudar o status só preenche data vazia, nunca apaga a que você digitou. As <b>horas</b> vêm das sessões marcadas ✓ feito (desmarcar devolve o tempo); se aparecer <b>“de ajuste”</b>, é o valor manual do campo <b>Ajuste manual</b> — edite o livro (✎) para revisar ou zerar. Ao marcar a leitura de <b>Livro</b> na agenda, o sistema usa o livro ativo (pergunta se houver mais de um).</div>';
  h+='<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-sm btn-primary" onclick="openLivro(\'\')">＋ Livro</button></div>';
  if(!livros().length)return h+'<div class="hempty" style="text-align:center;padding:22px">Nenhum livro ainda. Adicione o que está lendo.</div>';
  [['lendo','📖 Em leitura'],['espera','🕒 Na lista de espera'],['lido','✓ Lido']].forEach(function(g){
    var items=livrosByStatus(g[0]); if(!items.length)return;
    h+='<div class="grp-h"><b>'+g[1]+'</b> <span class="muted" style="font-size:11px">('+items.length+')</span></div>';

/** CRITÉRIO de horas de leitura, em DUAS parcelas separadas de propósito:

function livroHorasSplit(l){var base=livroDts(l).horas||0;

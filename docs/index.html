(function(){var av=document.getElementById('appVer'); if(av)av.textContent='v'+APP_VERSION;})();

/* ============================ AGENDA ============================ */
function weekDays(){var m=weekStart();var a=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);a.push(d);}return a;}
function eventsOf(iso){return EVENTS.filter(function(e){return e.date===iso;}).sort(function(a,b){return toMin(a.start)-toMin(b.start);});}
function renderAgenda(){ if(agView==='dia')return renderDay(); if(agView==='mes')return renderMonth(); return renderWeek(); }
/* Acordeon da semana: colapsa o corpo do dia, deixando só o cabeçalho (data/clima/local/horas). */
var agCollapsed=(function(){try{return JSON.parse(localStorage.getItem('hub_wk_collapsed')||'{}');}catch(e){return {};}})();
function saveCollapsed(){try{localStorage.setItem('hub_wk_collapsed',JSON.stringify(agCollapsed));}catch(e){}}
function toggleDay(iso){agCollapsed[iso]=!agCollapsed[iso];saveCollapsed();var el2=document.querySelector('.day[data-iso="'+iso+'"]');if(el2)el2.classList.toggle('collapsed',!!agCollapsed[iso]);}
function collapseAllDays(v){weekDays().forEach(function(d){agCollapsed[isoOf(d)]=v;});saveCollapsed();renderWeek();}
function navAg(n){ if(agView==='dia')cur.setDate(cur.getDate()+n); else if(agView==='mes')cur.setMonth(cur.getMonth()+n); else cur.setDate(cur.getDate()+n*7); cur=new Date(cur); renderAgenda(); window.scrollTo(0,0); }
function agHeader(label,sub){
  return '<div class="page-head"><h1>Agenda</h1><div class="seg">'+
    [['mes','Mês'],['semana','Semana'],['dia','Dia']].map(function(v){return '<button class="'+(agView===v[0]?'active':'')+'" onclick="agView=\''+v[0]+'\';renderAgenda();window.scrollTo(0,0)">'+v[1]+'</button>';}).join('')+'</div>'+
    '<div class="spacer"></div><button class="btn btn-sm" onclick="reloadAgenda()">↻ Atualizar</button><button class="btn btn-primary" onclick="openEvent(null)">＋ Evento</button></div>'+
    '<div class="agenda-bar"><div class="wknav"><button class="icbtn" onclick="navAg(-1)">◀</button><span class="lbl">'+label+'</span><button class="icbtn" onclick="navAg(1)">▶</button><button class="btn btn-sm" onclick="goToday()">Hoje</button></div>'+(sub?'<div class="muted" style="font-size:12.5px">'+sub+'</div>':'')+'</div>';
}
function dayHeadHTML(d,iso){return '<div class="day-head"><div class="row"><div><div class="dow">'+DOW[(d.getDay()+6)%7]+'</div><div class="dt">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</div></div>'+wxChip(iso)+'</div>'+locSelect(iso,getLoc(iso))+'</div>';}
function renderWeek(){
  var days=weekDays(), label=pad(days[0].getDate())+'–'+pad(days[6].getDate())+' '+MON[days[6].getMonth()]+' '+days[6].getFullYear();
  var w=0,p=0; EVENTS.forEach(function(e){if(days.some(function(d){return isoOf(d)===e.date;})){if(isWork(e))w+=durH(e);else p+=durH(e);}});
  var h=agHeader(label,'<b>'+fmtHm(w)+'</b> trab · '+fmtHm(p)+' pess')+wxBarHTML();
  var allCol=days.every(function(d){return agCollapsed[isoOf(d)];});
  h+='<div class="wkbar"><button class="btn btn-sm" onclick="collapseAllDays('+(allCol?'false':'true')+')">'+(allCol?'▾ Expandir todos':'▸ Colapsar todos')+'</button></div>';
  h+='<div class="weekgrid">';
  days.forEach(function(d){
    var iso=isoOf(d),evs=eventsOf(iso),today=isoOf(d)===isoOf(TODAY),wH=0;evs.forEach(function(e){if(isWork(e))wH+=durH(e);});
    h+='<div class="day'+(today?' today':'')+(agCollapsed[iso]?' collapsed':'')+'" data-iso="'+iso+'" ondragover="evDragOver(event)" ondragenter="evDragEnter(event)" ondragleave="evDragLeave(event)" ondrop="evDrop(event,\''+iso+'\')"><div class="day-head"><div class="row dh-toggle" onclick="toggleDay(\''+iso+'\')" title="Colapsar/expandir dia"><div class="dh-t"><span class="chev">▾</span><div><div class="dow">'+DOW[(d.getDay()+6)%7]+'</div><div class="dt">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</div></div></div>'+wxChip(iso)+'</div>'+locSelect(iso,getLoc(iso))+'<div class="day-sum">'+(wH?('<b>'+fmtHm(wH)+'</b> trabalho'):'&nbsp;')+(evs.length?'<span class="day-n">'+evs.length+' ev</span>':'')+'</div></div><div class="day-body">';
    if(!evs.length)h+='<div class="empty-day">Sem compromissos</div>';
    evs.forEach(function(e){h+=evCard(e);});
    h+='</div></div>';
  });
  h+='</div>';
  el('view').innerHTML=h;
}
function renderDay(){
  var d=new Date(cur), iso=isoOf(d), evs=eventsOf(iso), w=0,p=0;
  evs.forEach(function(e){if(isWork(e))w+=durH(e);else p+=durH(e);});
  var label=DOW[(d.getDay()+6)%7]+', '+pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear();
  var h=agHeader(label,(w?'<b>'+fmtHm(w)+'</b> trab':'')+(p?((w?' · ':'')+fmtHm(p)+' pess'):'')+((w||p)&&evs.length?' · ':'')+(evs.length?evs.length+' evento'+(evs.length>1?'s':''):''))+wxBarHTML();
  h+='<div class="dayview"><div class="day">'+dayHeadHTML(d,iso)+'<div class="dayview-body">';
  if(!evs.length)h+='<div class="empty-day">Sem compromissos</div>';
  evs.forEach(function(e){h+=evCard(e);});
  h+='</div></div></div>';
  el('view').innerHTML=h;
}
function renderMonth(){
  var first=new Date(cur.getFullYear(),cur.getMonth(),1), gridStart=mondayOf(first);
  var monthH=0; EVENTS.forEach(function(e){var dt=parseISO(e.date);if(dt.getMonth()===cur.getMonth()&&dt.getFullYear()===cur.getFullYear()&&isWork(e))monthH+=durH(e);});
  var h=agHeader(MONFULL[cur.getMonth()]+' '+cur.getFullYear(),'<b>'+fmtHm(monthH)+'</b> trabalho no mês')+wxBarHTML();
  h+='<div class="month"><div class="month-dows">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="month-grid">';
  for(var i=0;i<42;i++){
    var d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    var iso=isoOf(d), evs=eventsOf(iso), inM=d.getMonth()===cur.getMonth(), today=iso===isoOf(TODAY);
    h+='<div class="mcell'+(inM?'':' out')+(today?' today':'')+'" onclick="cur=parseISO(\''+iso+'\');agView=\'dia\';renderAgenda();window.scrollTo(0,0)">'+
      '<div class="mcell-h"><span>'+d.getDate()+'</span>'+(wxOf(iso)?'<span class="mcell-wx" title="'+esc(wxOf(iso).desc||'')+'">'+(wxOf(iso).icon||'')+'</span>':'')+'</div><div class="mcell-evs">'+
      evs.slice(0,4).map(function(e){var c=colorOf(e);return '<div class="mev" style="background:'+hex2bg(c)+';color:'+c+'">'+esc(e.start)+' '+esc(e.titulo)+'</div>';}).join('')+
      (evs.length>4?'<div class="mmore">+'+(evs.length-4)+' mais</div>':'')+'</div></div>';
  }
  h+='</div></div>';
  el('view').innerHTML=h;
}
function evCard(e){
  var col=colorOf(e),st=e.status,cls=st==='done'?'done':(st==='miss'?'miss':'');
  var sub=cfgFind('subtipo',e.subtipo);
  var chips='';
  if(e.projeto){var p=cfgFind('projeto',e.projeto);chips+='<span class="chip" style="background:'+hex2bg(p?p.cor:col)+';color:'+(p?p.cor:col)+'"><span class="dot" style="background:'+(p?p.cor:col)+'"></span>'+e.projeto+'</span>';}
  if(e.subtipo)chips+='<span class="chip" style="background:#EEF0FA;color:#5a5f86">'+e.subtipo+'</span>';
  if(e.subsub)chips+='<span class="chip" style="background:#F4EFE3;color:#7a5300">'+esc(e.subsub)+(e.detalhe?': '+esc(e.detalhe):'')+'</span>';
  var tlabel=e.start+'–'+e.end;
  return '<div class="ev '+cls+'" data-id="'+e.id+'" draggable="true" ondragstart="evDragStart(event,\''+e.id+'\')" ondragend="evDragEnd(event)" style="border-left-color:'+col+'" onclick="openEvent(\''+e.id+'\')">'+
    '<div class="ev-actions"><button class="stbtn stdone'+(st==='done'?' on':'')+'" title="Confirmar que fez" aria-label="Fiz" aria-pressed="'+(st==='done'?'true':'false')+'" onclick="event.stopPropagation();setStatus(\''+e.id+'\',\'done\')">✅</button><button class="stbtn stmiss'+(st==='miss'?' on':'')+'" title="Marcar como não feito" aria-label="Não fiz" aria-pressed="'+(st==='miss'?'true':'false')+'" onclick="event.stopPropagation();setStatus(\''+e.id+'\',\'miss\')">❌</button><button class="ev-del" title="Cancelar evento" onclick="event.stopPropagation();delEvent(\''+e.id+'\')">×</button></div>'+
    '<div class="t">'+tlabel+'</div>'+
    '<div class="ti">'+esc(e.titulo)+'</div>'+
    '<div class="meta">'+(e.fonte==='user'?'<span class="ev-man" title="Evento manual — não alterado pelo cron">✎ manual</span>':'')+chips+'</div>'+(e.note?'<div class="note-line">'+noteHTML(e.note)+'</div>':'')+'</div>';
}
function hex2bg(hex){return hex+'1a';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/** Escapa TEXTO LIVRE que vai para dentro de uma string JS entre aspas simples num atributo
 *  (ex.: onclick="f('...')"). Aplicar ANTES do esc(): jsq cuida do JS, esc cuida do HTML.
 *  Sem isto, um valor vindo do dado com apóstrofo (uma modalidade "Muay Thai's", um título)
 *  fecha a string e quebra o handler. Só necessário para texto do usuário — id gerado é seguro. */
function jsq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
/** Renderiza a nota: suporta hiperlink com rótulo [texto](url) e também linka URLs nuas. */
function noteHTML(raw){
  raw=String(raw==null?'':raw);
  function anchor(url,label){return '<a class="note-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+esc(label)+'</a>';}
  var re=/\[([^\]]+)\]\(\s*((?:https?|file|mailto):[^\s)]+)\s*\)|((?:https?|file):\/\/[^\s]+|mailto:[^\s]+)/g;
  var out='',idx=0,m;
  while((m=re.exec(raw))){ out+=esc(raw.slice(idx,m.index)); if(m[1]){out+=anchor(m[2],m[1]);} else {out+=anchor(m[3],m[3]);} idx=re.lastIndex; }
  out+=esc(raw.slice(idx));
  return out;
}
function goToday(){cur=new Date(TODAY);renderAgenda();window.scrollTo(0,0);}
function cycleStatus(id){var e=EVENTS.find(function(x){return x.id===id;});if(!e)return;e.status=e.status===''?'done':(e.status==='done'?'miss':'');saveEv();renderAgenda();}
/* done/miss INDEPENDENTES: setar 'miss' nunca passa por 'done' (mata a raiz do bug do tri-estado). Tocar no botão já ativo desfaz p/ pendente. */
function setStatus(id,target){var e=EVENTS.find(function(x){return x.id===id;});if(!e)return;e.status=(e.status===target)?'':target;saveEv();
  /* Muta SÓ o card clicado no lugar (className do root + .on/aria-pressed dos 2 botões) — reconstruir a view inteira
   * com innerHTML zerava o scroll da página E do .day-body. Nada mais na agenda depende do status (horas usam durH).
   * Fallback: se o nó não existe (chamado fora da agenda), cai pro renderAgenda(). */
  var st=e.status, node=el('view')?el('view').querySelector('.ev[data-id="'+id+'"]'):null;
  if(node){
    node.className='ev '+(st==='done'?'done':(st==='miss'?'miss':''));
    var bd=node.querySelector('.stbtn.stdone'), bm=node.querySelector('.stbtn.stmiss');
    if(bd){bd.classList.toggle('on',st==='done');bd.setAttribute('aria-pressed',st==='done'?'true':'false');}
    if(bm){bm.classList.toggle('on',st==='miss');bm.setAttribute('aria-pressed',st==='miss'?'true':'false');}
  }else{renderAgenda();}
  /* Treino/Esporte recém-marcado como FEITO → pergunta RPE/sensação (opcional). ESTE é o único lugar que coleta
   * esforço: perguntar na agenda (ao AGENDAR) era pedir o dado antes de o treino existir. 'miss' e desmarcar nunca abrem. */
  if(target==='done'&&e.status==='done'&&(e.subtipo==='Treino'||e.subtipo==='Esporte'||e.subtipo==='Jogo'))openRpe(id,true);}
  /* CONFIRMADO: horas de leitura NÃO são somadas aqui. Nenhum toggle escreve tempo em lugar
   * nenhum — livroHorasSplit().ev relê os eventos com status FINAL 'done', então desmarcar uma
   * sessão (✓→✗ ou ✓→pendente) faz o tempo dela SAIR do total na próxima renderização.
   * O único número que não desce é o `base` (ajuste manual do modal), e é por isso que ele
   * agora aparece separado na tela — resíduo do bug antigo do tri-estado mora ali, não aqui. */

/* ===== Drag & drop na visão Semana: arrastar card p/ outra coluna muda a DATA (mantém start/end). Só desktop; toque não dispara. ===== */
function evDragStart(ev,id){window.__dragEv=id;try{ev.dataTransfer.setData('text/plain',id);ev.dataTransfer.effectAllowed='move';}catch(e){}try{ev.currentTarget.classList.add('dragging');}catch(e){}}
function evDragEnd(ev){try{ev.currentTarget.classList.remove('dragging');}catch(e){}window.__dragEv=null;var hot=document.querySelectorAll('.day.drop-hot');for(var i=0;i<hot.length;i++)hot[i].classList.remove('drop-hot');}
function evDragOver(ev){ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}}
function evDragEnter(ev){ev.preventDefault();try{ev.currentTarget.classList.add('drop-hot');}catch(e){}}
function evDragLeave(ev){if(ev.currentTarget&&ev.relatedTarget&&ev.currentTarget.contains(ev.relatedTarget))return;try{ev.currentTarget.classList.remove('drop-hot');}catch(e){}}
function evDrop(ev,targetIso){ev.preventDefault();var id=(ev.dataTransfer&&ev.dataTransfer.getData('text/plain'))||window.__dragEv;try{ev.currentTarget.classList.remove('drop-hot');}catch(e){}if(id)moveEventToDay(id,targetIso);}
function moveEventToDay(id,iso){var e=EVENTS.find(function(x){return x.id===id;});if(!e||e.date===iso)return;e.date=iso;saveEv();renderAgenda();var pd=parseISO(iso);toast('Movido para '+DOW[(pd.getDay()+6)%7]+' '+pad(pd.getDate())+'/'+pad(pd.getMonth()+1));}


/* ============================ MODAL EVENTO ============================ */
function openModal(html){el('modal').innerHTML=html;el('overlay').classList.remove('hidden');}
function closeModal(){el('overlay').classList.add('hidden');}
el('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
window.addEventListener('afterprint',function(){if(page==='did')renderDID();});   // didPrint troca o #view pelo layout de export → restaura depois
function openEvent(id, prefill){
  var e=id?EVENTS.find(function(x){return x.id===id;}):(prefill||null);
  var isNew=!id;
  if(!e){e={id:'',date:isoOf(TODAY),start:'09:00',end:'10:00',titulo:'',subtipo:'Reunião',subsub:'',projeto:'',local:'',note:''};}   /* evento novo já vem com a data de HOJE */
  var tipo=tipoOf(e.subtipo)||'Trabalho';
  var tipoOpts=byCat('tipo').map(function(t){return '<option value="'+t.valor+'"'+(t.valor===tipo?' selected':'')+'>'+t.valor+'</option>';}).join('');
  var projOpts='<option value="">—</option>'+byCat('projeto').map(function(p){return '<option value="'+p.valor+'"'+(p.valor===e.projeto?' selected':'')+'>'+p.valor+'</option>';}).join('');
  var locOpts='<option value="">—</option>'+locOptgroups(e.local);
  openModal('<div class="modal-head"><h3>'+(isNew?'Novo evento':'Editar evento')+'</h3><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="field"><label>Título</label><input id="m_ti" value="'+esc(e.titulo)+'" placeholder="Ex.: Reunião de equipe"></div>'+
    '<div class="grid2"><div class="field"><label>Dia</label><input id="m_date" type="date" value="'+esc(e.date)+'"></div>'+
      '<div class="field"><label>Local</label><select id="m_loc">'+locOpts+'</select></div></div>'+
    '<div class="grid2"><div class="field"><label>Início</label><input id="m_start" type="time" step="900" value="'+e.start+'"></div>'+
      '<div class="field"><label>Fim</label><input id="m_end" type="time" step="900" value="'+e.end+'"></div></div>'+
    '<div class="grid2"><div class="field"><label>Tipo</label><select id="m_tipo" onchange="fillSub()">'+tipoOpts+'</select></div>'+
      '<div class="field"><label>Subtipo</label><select id="m_sub" onchange="fillSubsub()"></select></div></div>'+
    '<div class="field" id="m_subsub_wrap" style="display:none"><label id="m_subsub_lbl">Detalhe</label><select id="m_subsub" onchange="fillDetalhe()"></select></div>'+
    '<div class="field" id="m_detalhe_wrap" style="display:none"><label id="m_detalhe_lbl">Detalhe</label><select id="m_detalhe"></select></div>'+
    '<div class="field"><label>Projeto / Empresa</label><select id="m_proj">'+projOpts+'</select></div>'+
    '<div class="field"><label>Nota (opcional)</label><textarea id="m_note" rows="2" placeholder="Observação — link: [texto curto](https://… ou file:///…)">'+esc(e.note)+'</textarea><div class="hint">Dica: <code>[Minutas NSP](https://…)</code> mostra só o texto e abre o link.</div></div>'+
    '<div class="muted" id="m_calc" style="font-size:12px"></div>'+
    '</div>'+
    '<div class="modal-foot"><div style="display:flex;gap:8px">'+(isNew?'':'<button class="btn btn-sm btn-ghost" onclick="dupEvent()">⧉ Duplicar</button><button class="btn btn-sm btn-ghost" style="color:var(--miss)" onclick="delEvent(\''+e.id+'\')">Excluir</button>')+'</div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="saveEvent(\''+(e.id||'')+'\')">Salvar</button></div></div>');
  fillSub(e.subtipo); fillSubsub(e.subsub); fillDetalhe(e.detalhe);
  el('m_start').addEventListener('change',autoEnd);   // ao mudar o início, fim vai p/ +1h automaticamente
  ['m_end','m_tipo'].forEach(function(idd){el(idd).addEventListener('change',calcDur);});calcDur();
}
/** Ao escolher a hora de início, joga o fim para 1h depois (padrão 1h). */
function autoEnd(){var a=toMin(el('m_start').value);var b=(a+60)%1440;el('m_end').value=pad(Math.floor(b/60))+':'+pad(b%60);calcDur();}
/** Duplica o evento aberto: abre um NOVO com os mesmos dados (ajuste a data/hora e salve → vira outro). */
function dupEvent(){var ss=(el('m_subsub_wrap').style.display==='none')?'':el('m_subsub').value;var pf={titulo:el('m_ti').value.trim(),date:el('m_date').value,start:el('m_start').value,end:el('m_end').value,subtipo:el('m_sub').value,subsub:ss,projeto:el('m_proj').value,local:el('m_loc').value,note:el('m_note').value.trim(),detalhe:(el('m_detalhe_wrap')&&el('m_detalhe_wrap').style.display!=='none'&&el('m_detalhe'))?el('m_detalhe').value:''};openEvent(null,pf);toast('Duplicado — ajuste data/hora e salve');}
function fillSub(sel){var tipo=el('m_tipo').value;var subs=subtiposOf(tipo);el('m_sub').innerHTML=subs.map(function(s){return '<option value="'+s.valor+'"'+(s.valor===sel?' selected':'')+'>'+s.valor+'</option>';}).join('');}
function fillSubsub(sel){var tipo=el('m_tipo').value,sub=el('m_sub').value;var nn=subsubOf(tipo,sub);var w=el('m_subsub_wrap');
  if(!nn.length){w.style.display='none';el('m_subsub').innerHTML='';fillDetalhe();return;}
  w.style.display='';el('m_subsub_lbl').textContent=(sub==='Leitura'?'O que está lendo / estudando':'Detalhe ('+sub+')');
  el('m_subsub').innerHTML='<option value="">—</option>'+nn.map(function(x){return '<option value="'+x.valor+'"'+(x.valor===sel?' selected':'')+'>'+x.valor+'</option>';}).join('');fillDetalhe();}
/** 4º nível "detalhe" — opções dependem do subsub: Livro→livros, Academia→séries, BJJ→Gi/No Gi. */
var DETALHE_OF={
  'Livro':{label:'Qual livro (para contabilizar a leitura)',opts:function(){var o={lendo:0,espera:1,lido:2};return livros().slice().sort(function(a,b){return (o[a.pai||'espera']||1)-(o[b.pai||'espera']||1);}).map(function(l){return {v:l.valor,t:l.valor+(l.pai==='lendo'?' · lendo':(l.pai==='lido'?' · lido':' · espera'))};});}},
  'Academia':{label:'Qual série',opts:function(){var o={ativa:0,encerrada:1};return series().slice().sort(function(a,b){return (o[a.pai||'ativa']||0)-(o[b.pai||'ativa']||0);}).map(function(l){return {v:l.valor,t:l.valor+(l.pai==='encerrada'?' · encerrada':' · ativa')};});}},
  'BJJ':{label:'Modalidade',opts:function(){return [{v:'Gi',t:'🥋 Gi'},{v:'No Gi',t:'No Gi'}];}}
};
function fillDetalhe(sel){var w=el('m_detalhe_wrap');if(!w)return;var ss=el('m_subsub')?el('m_subsub').value:'';var cfg=DETALHE_OF[ss];
  if(!cfg){w.style.display='none';return;}

/** ID de evento GARANTIDAMENTE único (evita colisão entre duplicados → marcar um marcava o outro). */
function uniqEvtId(){var id;do{id='evt-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e7).toString(36);}while(EVENTS.some(function(e){return e.id===id;}));return id;}

function delEvent(id){var e=EVENTS.find(function(x){return x.id===id;});if(!e)return;if(!confirm('Cancelar o evento "'+(e.titulo||'')+'"?'))return;EVENTS=EVENTS.filter(function(x){return x.id!==id;});saveEv();closeModal();toast('Evento cancelado');

  var r=ev.currentTarget.getBoundingClientRect(),W=Math.min(300,window.innerWidth-16);

  if(window.innerHeight-r.bottom>=hh+8||r.top<hh+8)d.style.top=(r.bottom+6)+'px';

/* ==================== CHECK-IN DIÁRIO + CARGA DO TREINO ====================
 * Captura crua (carga × recuperação): check-in da manhã (Garmin + subjetivo) e
 * RPE/sensação do treino. Só coleta — nenhum indicador é derivado aqui. */
/* ---- Gauges do check-in: arrasta/rola, não digita ---------------------------------
 * Cada eixo tem DUAS faixas, não confundir:
 *  · lo/hi   = faixa de VALIDAÇÃO, espelho de HUB_READY_FIELDS_ (Database.gs). Erra cedo, antes do POST.
 *  · gLo/gHi = faixa DESENHADA (só apresentação). Arrastar HRV de 15 a 200 deixaria a faixa basal
 *    do usuário num fiapo de poucos px; o gauge desenha a vizinhança útil e o clamp de ckRange
 *    garante que arrastar NUNCA produza valor fora de lo/hi.
 *    (A faixa basal REAL não se escreve aqui: comentário deste arquivo vai para o repo público.)
 * `base` = chave do baseline do relógio (SAUDE.baseline) — a banda sai DE LÁ, nada hardcoded.
 * Body Battery tem base:null de propósito: o relógio não publica basal de BB, então a escala é a
 * natural dele, 0–100. Sono é decimal no storage (contrato do backend) e H:MM só na tela. */
var CK_TMP={hrv:null,sono_h:null,fc_rep:null,bb:null,energia:null};
var CK_NUM=[   /* mesmas faixas do backend (hubReadinessUpsert_) — erra cedo, antes do POST */
  {k:'hrv',     lo:15, hi:200, nome:'HRV',           lbl:'HRV',          un:'ms',  gLo:20, gHi:110, step:1,    base:'hrv',   goodHigh:true},
  {k:'sono_h',  lo:0,  hi:14,  nome:'Sono',          lbl:'Sono',         un:'',    gLo:3,  gHi:11,  step:1/12, base:'sono',  clock:true, drum:true},
  {k:'fc_rep',  lo:30, hi:100, nome:'FC de repouso', lbl:'FC repouso',   un:'bpm', gLo:35, gHi:85,  step:1,    base:'fcrep', goodHigh:false},
  {k:'bb',      lo:0,  hi:100, nome:'Body Battery',  lbl:'Body Battery', un:'',    gLo:0,  gHi:100, step:1,    base:null,    goodHigh:true},
  {k:'energia', lo:1,  hi:5,   nome:'Energia',       lbl:'Energia',      un:'/5',  gLo:1,  gHi:5,   step:1,    base:null,    goodHigh:true, seg:true}
];
function ckDef(k){for(var i=0;i<CK_NUM.length;i++)if(CK_NUM[i].k===k)return CK_NUM[i];return null;}
/** Faixa desenhada: abre p/ caber o range basal DO USUÁRIO (seja ele qual for) e o valor já gravado,
 *  depois fecha no lo/hi do backend. Só EXPANDE — por isso não realimenta ao arrastar. */
function ckRange(f){
  var lo=f.gLo,hi=f.gHi,b=f.base?saudeBase(f.base):null,t;
  if(b){
    if(b.lo!=null)lo=Math.min(lo,b.lo-5);
    if(b.hi!=null)hi=Math.max(hi,b.hi+5);
    if(b.need!=null){lo=Math.min(lo,b.need/60-1);hi=Math.max(hi,b.need/60+1);}
    var u=saudeUltRelogio(f.base);   /* última leitura do relógio (era `hoje`, campo congelado) */
    if(u){t=f.clock?(u.v/60):u.v;lo=Math.min(lo,t-1);hi=Math.max(hi,t+1);}
  }
  var cv=CK_TMP[f.k];   /* valor legado fora da vizinhança nunca deixa o thumb sair da trilha */
  if(cv!=null){lo=Math.min(lo,cv);hi=Math.max(hi,cv);}
  lo=Math.max(lo,f.lo);hi=Math.min(hi,f.hi);
  if(hi<=lo)hi=lo+1;
  return {lo:lo,hi:hi};
}
/** Banda basal em % da trilha, ou null enquanto o baseline não chegou (degrada limpo: gauge segue usável). */
function ckBand(f){
  var b=f.base?saudeBase(f.base):null;if(!b)return null;
  var r=ckRange(f),sp=(r.hi-r.lo)||1;
  function pc(x){return Math.max(0,Math.min(100,(x-r.lo)/sp*100));}
  if(b.lo!=null&&b.hi!=null)return {a:pc(b.lo),b:pc(b.hi),t:null};
  if(b.need!=null)return {a:null,b:null,t:pc(b.need/60)};   /* sono: alvo, não faixa */
  return null;
}
function ckFmt(f,v){if(v==null)return '—';if(f.clock)return fmtClock(v*60);
  return fmtN(v,0)+(f.un?((f.un==='/5')?f.un:(' '+f.un)):'');}
/** Cor do gauge: neutro DENTRO do seu normal, verde quando o sinal é bom, âmbar quando não. */
function ckColor(f,v){
  if(v==null)return 'var(--line)';
  if(f.k==='energia')return ['#C8462F','#E07A3C','#E5A93C','#5FB86A','#1F9D57'][Math.round(v)-1]||'var(--ind2)';
  var b=f.base?saudeBase(f.base):null,e;
  if(b&&b.lo!=null&&b.hi!=null){e=saudeEval(v,b.lo,b.hi,f.goodHigh);return e.dir===0?'var(--ind2)':(e.good?'var(--ok)':'var(--gold)');}
  if(f.k==='sono_h'&&b&&b.need!=null)return (v*60>=b.need-15)?'var(--ok)':'var(--gold)';
  if(f.k==='bb')return (v>=60)?'var(--ok)':((v>=30)?'var(--gold)':'var(--miss)');
  return 'var(--ind2)';
}
/** Referência sob o gauge — sai do baseline; sem ele, vira a dica de uso. */
function ckRef(f){
  var b=f.base?saudeBase(f.base):null;
  if(f.k==='energia')return '1 baixa · 5 alta';
  if(f.k==='bb')return 'escala do relógio · 0–100';
  if(!b)return 'arraste ou role p/ ajustar';
  if(f.k==='sono_h')return 'sua necessidade '+fmtClock(b.need)+(b.dur!=null?' · sua média '+fmtClock(b.dur):'');
  if(b.lo!=null&&b.hi!=null)return 'seu normal '+b.lo+'–'+b.hi+(f.un?(' '+f.un):'')+(b.d7!=null?(' · 7d '+b.d7+(f.un?(' '+f.un):'')):'');
  return 'arraste ou role p/ ajustar';
}
function ckGaugeHTML(f){
  var band=ckBand(f),seg='',i;
  if(f.seg)for(i=0;i<5;i++)seg+='<span class="gau-tick" style="left:'+(i/4*100)+'%"></span>';
  return '<div class="gau">'+
    '<div class="gau-h"><span class="gau-l">'+esc(f.lbl)+infoBtn(f.k)+'</span>'+
      '<span class="gau-set"><button type="button" class="gau-nudge" aria-label="Diminuir '+esc(f.nome)+'" onclick="ckNudge(\''+f.k+'\',-1)">−</button>'+
      '<span class="gau-v" id="gauv_'+f.k+'">—</span>'+
      '<button type="button" class="gau-nudge" aria-label="Aumentar '+esc(f.nome)+'" onclick="ckNudge(\''+f.k+'\',1)">+</button></span></div>'+
    '<div class="gau-track empty" id="gaut_'+f.k+'" role="slider" tabindex="0" aria-label="'+esc(f.nome)+'">'+

      (band&&band.a!=null?'<span class="gau-band" style="left:'+band.a+'%;width:'+Math.max(0.6,band.b-band.a)+'%"></span>':'')+
      (band&&band.t!=null?'<span class="gau-target" style="left:'+band.t+'%"></span>':'')+
      seg+
      '<span class="gau-thumb" id="gaum_'+f.k+'"></span>'+
    '</div>'+
    '<div class="gau-f"><span class="gau-ref">'+esc(ckRef(f))+'</span>'+
      '<button type="button" class="gau-clear" onclick="ckClear(\''+f.k+'\')">limpar</button></div>'+
  '</div>';
}
/** Prende no passo do eixo. Sono guarda 3 casas: 7:05 → 7.083 → volta 425min = 7:05 (round-trip fecha). */
function ckSnap(f,v){
  var r=ckRange(f);
  v=Math.max(r.lo,Math.min(r.hi,v));
  v=r.lo+Math.round((v-r.lo)/f.step)*f.step;
  v=Math.max(r.lo,Math.min(r.hi,v));
  return f.clock?(Math.round(v*1000)/1000):(Math.round(v*100)/100);
}
function ckSet(k,v){var f=ckDef(k);if(!f)return;CK_TMP[k]=ckSnap(f,v);ckPaint(k);}
/** ± um passo. Em branco, o 1º toque cai no meio da trilha (não pula direto p/ o extremo). */
function ckNudge(k,d){var f=ckDef(k);if(!f)return;var r=ckRange(f);
  if(CK_TMP[k]==null){ckSet(k,(r.lo+r.hi)/2);return;}
  ckSet(k,CK_TMP[k]+d*f.step);}
function ckClear(k){CK_TMP[k]=null;ckPaint(k);}
function ckPaint(k){
  var f=ckDef(k);if(!f)return;
  if(f.drum){ckDrumPaint();return;}   /* sono não tem trilha — quem pinta é o drum */
  var v=CK_TMP[k],t=el('gaut_'+k);if(!t)return;
  var r=ckRange(f),pct=(v==null)?0:Math.max(0,Math.min(100,(v-r.lo)/((r.hi-r.lo)||1)*100));
  var col=ckColor(f,v),fill=el('gauf_'+k),th=el('gaum_'+k),vv=el('gauv_'+k);
  fill.style.width=pct+'%';fill.style.background=col;
  th.style.left=pct+'%';th.style.borderColor=col;th.style.display=(v==null)?'none':'';
  vv.innerHTML=(v==null)?'<span class="gau-na">—</span>':esc(ckFmt(f,v));

/** Arrastar / rolar / teclar numa trilha HORIZONTAL. Pointer Events cobrem MOUSE e TOQUE
 *  num caminho só; o touch-action:none da trilha (Style.html) impede a página de roubar
 *  o gesto no celular.
 *
 *  UM mecanismo, dois usuários: os gauges do check-in e o slider de RPE do treino. O
 *  segundo nasceu depois; copiar este bloco para lá deixaria dois arrastos com o mesmo
 *  contrato e uma divergência marcada para a primeira correção que só um dos dois receber.
 *  o={rng,step,get,set} — `rng` é FUNÇÃO porque a faixa do check-in cresce quando o
 *  baseline chega; `set` recebe valor CRU e é quem arredonda (cada dono tem seu snap).
 */
function trackBind(t,o){
  /* Trilha sem largura = nó destacado do documento, escondido, ou ainda sem layout.
   * Devolve null: sem trilha na tela não existe posição na trilha, e a resposta certa
   * é NÃO gravar. O `(b.width||1)` que morava aqui fazia pior que falhar — dividia por
   * 1px, e qualquer pointermove virava (cx−left)×(hi−lo)+lo, cravando o topo da escala
   * (RPE 10 "Máximo") silenciosamente. Erro barulhento > dado errado calado. */
  function fromX(cx){var b=t.getBoundingClientRect(),r=o.rng();
    if(!b.width)return null;
    return r.lo+((cx-b.left)/b.width)*(r.hi-r.lo);}
  function move(ev){ev.preventDefault();var v=fromX(ev.clientX);if(v==null)return;o.set(v);}
  function stop(ev){t.classList.remove('drag');t.removeEventListener('pointermove',move);
    try{t.releasePointerCapture(ev.pointerId);}catch(e){}}
  function step(d){var c=o.get(),r=o.rng();
    if(c==null){o.set((r.lo+r.hi)/2);return;}   /* vazio: 1º toque cai no meio, não no extremo */
    o.set(c+d*o.step);}
  t.addEventListener('pointerdown',function(ev){
    try{t.setPointerCapture(ev.pointerId);}catch(e){}
    t.classList.add('drag');try{t.focus();}catch(e){}
    move(ev);t.addEventListener('pointermove',move);});
  t.addEventListener('pointerup',stop);
  t.addEventListener('pointercancel',stop);
  t.addEventListener('wheel',function(ev){ev.preventDefault();step((ev.deltaY<0)?1:-1);},{passive:false});
  t.addEventListener('keydown',function(ev){
    var d=(ev.key==='ArrowRight'||ev.key==='ArrowUp')?1:((ev.key==='ArrowLeft'||ev.key==='ArrowDown')?-1:0);
    if(!d)return;ev.preventDefault();step(d);});
}
function ckBind(k){

  trackBind(t,{rng:function(){return ckRange(f);},step:f.step,

}
/* ---- Sono: rolagem de relógio, não régua ----------------------------------------
 * Sono é a única medida do check-in que ele lê como HORA (7:05), não como posição numa
 * escala. Na trilha do gauge, mirar 5 minutos virava ~1,5px de arrasto — o passo existia
 * mas não dava para acertar. O drum é o seletor de hora que todo celular já tem: duas
 * colunas, passo de 5 min, e o valor sai ESCOLHIDO em vez de estimado.
 *
 * O storage continua decimal (contrato sono_h 0–14 do backend) e o round-trip fecha:
 * 7:05 → 7 + 5/60 = 7.083 → ×60 = 424,98 → fmtClock arredonda → 425min → 7:05.
 * Pointer Events (o MESMO mecanismo dos gauges) cobrem mouse e toque num caminho só. */
var DRUM_H=34;   /* px por item — espelha .drum-i no Style.html; mudou lá, muda aqui, senão o snap desalinha */

(function(){var i;for(i=0;i<=14;i++)DRUM_HS.push(i);for(i=0;i<60;i+=5)DRUM_MS.push(i);})();

/** Onde o drum nasce quando o campo está vazio: a necessidade DELE (arredondada em 5min),
 *  não 0:00 — a primeira rolagem começa perto da resposta, não no fim da escala. */
function ckDrumDef(){
  var b=saudeBase('sono'),n=(b&&b.need!=null)?b.need:480;

function ckDrumBind(id){

    jgBlock='<div class="field"><label class="rp-check"><input type="checkbox" id="rp_partida"'+(jHas?' checked':'')+' onchange="rpTogglePartida()"> Foi uma partida? <span class="muted">registrar resultado</span></label>'+
      '<div id="rp_partida_fields"'+(jHas?'':' style="display:none"')+'>'+jFieldsHtml+'</div></div>';
  }
  openModal('<div class="modal-head"><h3>🏋️ Como foi'+(isSport?'?':' o treino?')+'</h3><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body">'+
    '<div class="hint">'+esc(e.titulo)+' · '+esc(dLbl(e.date))+' — tudo opcional.</div>'+
    '<div class="field"><label>Como você se sentiu?'+infoBtn('sensacao')+'</label><div id="rp_sens"></div></div>'+
    '<div class="field"><label>Esforço percebido'+infoBtn('rpe')+'</label><div id="rp_rpe"></div></div>'+
    jgBlock+
    injBlock+
    '<div class="field"><label class="rp-check"><input type="checkbox" id="rp_lesao"> Teve '+(linkedInj.length?'outra ':'alguma ')+'lesão nesta sessão?</label><div class="hint">Marque e clique em Salvar: o RPE e a sensação são gravados PRIMEIRO, aí você indica onde foi e a gravidade.</div></div>'+
    '<div class="field"><label>Anotação da sessão</label><textarea id="rp_nota" rows="3" placeholder="O que treinou, como o corpo respondeu, o que ajustar…">'+esc(e.nota_sessao||'')+'</textarea></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-sm btn-ghost" onclick="closeModal()">'+(novo?'Pular':'Cancelar')+'</button><button class="btn btn-sm btn-primary" onclick="saveRpe()">Salvar</button></div>');
  /* estrutura 1x → pinta → liga. Nesta ordem, e só aqui: depois disto o #rp_track é
     estável e nenhum paint volta a recriá-lo (senão o arrasto morre no 1º commit). */
  el('rp_rpe').innerHTML=rpRpeHTML();
  rpPaintSens();rpPaintRpe();rpBind();}
/** Mostra/esconde os campos da partida sob o toggle (só INTENÇÃO até o Salvar). */
function rpTogglePartida(){var c=el('rp_partida'),f=el('rp_partida_fields');if(f)f.style.display=(c&&c.checked)?'':'none';}
function saveRpe(){var e=EVENTS.find(function(x){return x.id===RPE_TMP.id;});if(!e){closeModal();return;}
  /* LÊ o DOM (checkbox + nota + partida) ANTES de qualquer troca de modal — o wizard de lesão
     substitui este modal e apaga estes nós; ler depois pegaria vazio. */
  var querLesao=(function(){var c=el('rp_lesao');return !!(c&&c.checked);})();
  /* Partida: coleta os campos agora; o commit vem DEPOIS do RPE (mesma ordem da lesão).
     Jogo NÃO tem o checkbox (campos são diretos) → sempre quer registrar; Esporte depende do toggle. */
  var pc=el('rp_partida'),querJogo=(e.subtipo==='Jogo')||!!(pc&&pc.checked);
  var jFields=querJogo?{adversario:((el('rp_j_adv')||{}).value||'').trim(),placar:((el('rp_j_plac')||{}).value||'').trim(),
    resultado:(el('rp_j_res')||{}).value||'',local:((el('rp_j_loc')||{}).value||'').trim()}:null;
  var n=el('rp_nota');
  /* COMMIT do RPE PRIMEIRO — sempre, com ou sem lesão. É o único ponto de gravação:
     o checkbox virou só INTENÇÃO (não abre mais o wizard na hora), então o RPE já está
     salvo no evento e no backend antes de o wizard existir. Mata a corrida que perdia o
     RPE quando a lesão era marcada (o wizard tirava o modal antes do commit). */
  e.rpe=(RPE_TMP.rpe==null)?'':RPE_TMP.rpe;e.sensacao=(RPE_TMP.sensacao==null)?'':RPE_TMP.sensacao;
  if(n)e.nota_sessao=n.value.trim();
  saveEv();
  /* Partida marcada: cria/atualiza o JOGO vinculado (evento_id=e.id). Editar o existente
     (RPE_TMP.jogoId) NÃO duplica; nota/modalidade próprios são preservados no Object.assign
     (jo não os inclui). Sem adversário nem placar não grava — nada útil para registrar. */
  if(querJogo&&jFields&&(jFields.adversario||jFields.placar)){
    var ex=RPE_TMP.jogoId?JOGOS.find(function(x){return x.id===RPE_TMP.jogoId;}):null;
    var jo={data:e.date,modalidade:(e.subsub||(ex&&ex.modalidade)||'Tennis'),adversario:jFields.adversario,
      placar:jFields.placar,resultado:jFields.resultado,local:jFields.local,evento_id:e.id};
    if(ex)Object.assign(ex,jo);
    else{jo.id=uniqJogoId();jo.nota='';JOGOS.push(jo);}
    saveJogos();
  }
  /* repinta QUEM está na tela (o modal abre da agenda E da página de Saúde) — a página
     atrás já reflete o RPE mesmo que a lesão seja cancelada no wizard. */
  if(page==='saude')renderSaude();else renderAgenda();
  /* SÓ ENTÃO, se marcou lesão, abre o wizard vinculado ao evento — com o RPE já salvo. */
  if(querLesao){openInjuryWizard(RPE_TMP.id);return;}
  closeModal();toast('Registrado ✓');}

/* ============================ SAÚDE (baseline Garmin) ============================
 * Carga histórica única (jul/25→jul/26): régua do check-in + peso/IMC + volume/endurance.
 * SAUDE={} até carregar — CUIDADO: {} é truthy, o guard testa SAUDE.series.
 * Buscado sob demanda (fora do bootstrap): 1ª abertura da subaba Saúde ou da Home. */
var SAUDE={},saudeTry=false,saudeErr=false;
function saudeOk(){return !!(SAUDE&&SAUDE.series&&SAUDE.series.length);}
function saudeLoad(){
  if(saudeOk()||saudeTry)return;
  saudeTry=true;saudeErr=false;
  api('getSaude').then(function(x){
    if(x&&!x.error&&x.series&&x.series.length)SAUDE=x;else saudeErr=true;
    saudeRepaint();
  }).catch(function(){saudeErr=true;saudeRepaint();});
}
/** Falhou (offline/sem token)? Deixa tentar de novo — senão o card fica "Carregando…" p/ sempre. */
function saudeRetry(){saudeTry=false;saudeErr=false;saudeLoad();saudeRepaint();}
/** Repinta a tela que depende do baseline (chamada 1x, quando o fetch volta). */
function saudeRepaint(){if(page==='ind')renderInd();else if(page==='home')renderHome();else if(page==='saude')renderSaude();}
/** Invalida o cache e busca de novo (depois de gravar peso: a precedência
 *  manual×relógio quem resolve é o backend — refazer a conta aqui seria uma 2ª
 *  implementação da mesma regra, pronta pra divergir). */
function saudeReload(){SAUDE={};saudeTry=false;saudeErr=false;saudeLoad();}
/** Baseline de um eixo ('hrv'|'fcrep'|'sono') ou null se ainda não carregou. */
function saudeBase(k){return (SAUDE&&SAUDE.baseline&&SAUDE.baseline[k])?SAUDE.baseline[k]:null;}
/** Última leitura DO RELÓGIO de um eixo: {v,iso} ou null.
 *  `ultimo`+`ultimoEm` é o contrato novo do seed; `hoje` é o campo antigo (seed já
 *  implantado lá fora) — aceito na leitura, nunca escrito, e SEM data: por isso
 *  saudeAtual() o rotula como "última leitura", jamais como "hoje". */
function saudeUltRelogio(k){
  var b=saudeBase(k);if(!b)return null;
  var v=(b.ultimo!=null)?b.ultimo:((b.hoje!=null)?b.hoje:null);
  if(v==null)return null;
  return {v:v,iso:b.ultimoEm||''};
}

/* ============ MOTOR ESTATÍSTICO: BASELINE INDIVIDUAL ============
 * Não existe threshold universal para HRV — a baseline individual é o único padrão
 * cientificamente válido (Shaffer & Ginsberg, 2017). Daí o status sair de z-score
 * contra a média DELE, e não de uma faixa fixa: faixa fixa diverge do relógio dele
 * e não tem como estar certa para todo mundo ao mesmo tempo. */
var Z_MIN_OBS=7;   /* < 7 observações válidas: amostra não sustenta um σ — a tela diz isso, não finge status */
/** {mean,stdDev,count} ignorando null/NaN. σ POPULACIONAL (divide por N, não N−1):
 *  a janela É a população de interesse (os 30 dias dele), não uma amostra dela. */
function zStats(vals){
  var valid=[],i,v,s=0,va=0;
  for(i=0;i<vals.length;i++){v=vals[i];if(typeof v==='number'&&isFinite(v))valid.push(v);}
  if(!valid.length)return {mean:0,stdDev:0,count:0};
  for(i=0;i<valid.length;i++)s+=valid[i];
  var mean=s/valid.length;
  for(i=0;i<valid.length;i++)va+=Math.pow(valid[i]-mean,2);
  return {mean:mean,stdDev:Math.sqrt(va/valid.length),count:valid.length};
}
/** (v−média)/σ. σ=0 → 0: sem dispersão não existe distância padronizada (e dividir daria ±∞). */
function zScore(v,mean,sd){if(sd===0||!isFinite(sd))return 0;return (v-mean)/sd;}

/* Eixos da régua e onde cada um acha a observação DIÁRIA dele.
 *  · m    = métrica na série do relógio · ck = campo do check-in (READINESS)
 *  · conv = série → unidade do check-in (sono vem em MINUTOS, o check-in é em horas) */
var Z_AXIS={
  hrv:  {m:'hrv',      ck:'hrv',    conv:null},
  fcrep:{m:'fcrep',    ck:'fc_rep', conv:null},
  sono: {m:'sono_dur', ck:'sono_h', conv:function(v){return v/60;}},
  peso: {m:'peso',     ck:null,     conv:null}
};
var Z_JANELA=30;   /* dias de baseline (Shaffer & Ginsberg: baseline recente, não histórico inteiro) */
/**
 * Histórico DIÁRIO de um eixo na janela, do mais recente p/ o mais antigo:
 * série do relógio + check-ins, unificados por data. Empate no mesmo dia: o check-in
 * vence (é a medida que ELE conferiu e digitou). Independe de `fonte`.
 *
 * >>> ARMADILHA ESTATÍSTICA — o filtro p==='d' é a trava desta função. <<<
 * O relógio publica hrv e peso DIÁRIOS (p:'d'), mas fcrep e sono_dur SEMANAIS (p:'w').
 * Média semanal varia MENOS que observação individual: entrando no z-score ela
 * subestima o σ, o z estoura e o indicador passa a alertar à toa. Média semanal pode
 * informar a média EXIBIDA — nunca o desvio padrão.
 * Consequência aceita, e visível na tela em vez de escondida: HRV nasce funcionando
 * (28 pontos diários), FC e sono ficam em "coletando baseline" até os check-ins
 * acumularem Z_MIN_OBS dias. É a resposta honesta: o dado diário não existe ainda.
 */
function saudeHistD(k,dias){
  var ax=Z_AXIS[k];if(!ax||!saudeOk())return [];
  var by={},i,s,r,v,cut=new Date(TODAY);
  cut.setDate(cut.getDate()-(dias||Z_JANELA));
  var ci=isoOf(cut),hoje=isoOf(TODAY);
  var ser=saudeSerieRaw(ax.m);
  for(i=0;i<ser.length;i++){
    s=ser[i];
    if(s.p!=='d')continue;                       /* <<< a trava: só observação diária entra */
    if(s.d<ci||s.d>hoje)continue;
    v=ax.conv?ax.conv(s.v):s.v;
    if(typeof v==='number'&&isFinite(v))by[s.d]=v;
  }
  if(ax.ck)for(i=0;i<READINESS.length;i++){
    r=READINESS[i];if(!r||!r.date||r.date<ci||r.date>hoje)continue;
    v=num0(r[ax.ck]);
    if(v!=null&&isFinite(v))by[r.date]=v;        /* check-in vence no mesmo dia */
  }
  return Object.keys(by).sort().reverse().map(function(d){return by[d];});
}

/** Estado comum de "ainda não dá p/ falar": nunca inventa status, diz quanto falta. */
function zColeta(n,src){
  return {status:'Normal',coleta:true,z:0,mean:null,count:n,
    msg:'Coletando baseline. Disponível após '+Math.max(0,Z_MIN_OBS-n)+' dia(s).',source:src};
}
/**
 * HRV vs. baseline individual. z > −0.5 Normal · −1.5 ≤ z ≤ −0.5 Atenção · z < −1.5 Baixo.
 * HRV BAIXO é o sinal ruim (sistema nervoso sob estresse) — daí o corte ser negativo.
 */
function zHrvStatus(atual,hist){
  var st=zStats(hist||[]);
  if(st.count<Z_MIN_OBS||atual==null)return zColeta(st.count,SRC_HRV);
  var z=zScore(atual,st.mean,st.stdDev),m=Math.round(st.mean);
  if(z>-0.5)  return {status:'Normal', z:z,mean:m,count:st.count,source:SRC_HRV,
    msg:'Dentro do seu normal (média '+m+'ms). Sistema nervoso recuperado.'};
  if(z>=-1.5) return {status:'Atenção',z:z,mean:m,count:st.count,source:SRC_HRV,
    msg:Math.abs(z).toFixed(1)+'σ abaixo da sua média ('+m+'ms). Corpo sob estresse.'};
  return {status:'Baixo',z:z,mean:m,count:st.count,source:SRC_HRV,
    msg:Math.abs(z).toFixed(1)+'σ abaixo da sua média ('+m+'ms). Fadiga ou infecção possível.'};
}
/**
 * FC de repouso vs. baseline individual. MESMA estrutura do HRV com o SINAL INVERTIDO:
 * aqui o valor ALTO é que é ruim. z < 0.5 Normal · 0.5 ≤ z < 1.5 Atenção · z > 1.5 Elevado.
 * (Para quem treina, 40–60 bpm é normal e saudável — threshold absoluto classificaria
 *  a boa forma dele como bradicardia.)
 */
function zFcStatus(atual,hist){
  var st=zStats(hist||[]);
  if(st.count<Z_MIN_OBS||atual==null)return zColeta(st.count,SRC_FC);
  var z=zScore(atual,st.mean,st.stdDev),m=Math.round(st.mean);
  if(z<0.5)  return {status:'Normal', z:z,mean:m,count:st.count,source:SRC_FC,
    msg:'Dentro do seu normal (média '+m+' bpm). Boa recuperação.'};
  if(z<1.5)  return {status:'Atenção',z:z,mean:m,count:st.count,source:SRC_FC,
    msg:z.toFixed(1)+'σ acima da sua média ('+m+' bpm). Possível falta de recuperação.'};
  return {status:'Elevado',z:z,mean:m,count:st.count,source:SRC_FC,
    msg:z.toFixed(1)+'σ acima da sua média ('+m+' bpm). O corpo não recuperou totalmente.'};
}
/** Sono: horas ABSOLUTAS (≥8 Excelente · ≥7 Bom · <7 Insuficiente) — aqui a
 *  recomendação É populacional e vale threshold, ao contrário de HRV/FC. */
function zSonoStatus(h){
  if(h==null)return {status:null,source:SRC_SONO,msg:''};
  if(h>=8)return {status:'Excelente',source:SRC_SONO,msg:'Excelente para recuperação.'};
  if(h>=7)return {status:'Bom',      source:SRC_SONO,msg:'Dentro da recomendação (7–9h).'};
  return {status:'Insuficiente',     source:SRC_SONO,msg:'Abaixo do recomendado de 7h.'};
}
/**
 * Privação crônica de sono — sono abaixo de 7h de forma SUSTENTADA.
 * Charest & Grandner (2020): o que pesa não é a noite ruim, é a sequência; o risco de
 * lesão sobe com ~14 dias de lag. Devolve {cronico,n,tot,media,base} ou null.
 *
 * Duas evidências, nesta ordem — a 1ª que existir vence:
 *  · DIÁRIA (check-ins): ≥10 das últimas 14 abaixo de 7h. Dez-em-14, e não 14
 *    consecutivas, de propósito: uma única noite boa não desfaz duas semanas de
 *    privação, e a regra "consecutiva" zeraria a contagem justamente aí.
 *  · SEMANAL (relógio, p:'w'): semanas seguidas com MÉDIA abaixo de 7h. Threshold
 *    sobre média é leitura legítima do dado semanal — o que a média semanal não pode
 *    informar é σ (ver saudeHistD), e aqui não existe σ nenhum. Sem esta perna o
 *    detector nunca falaria: o relógio dele não publica sono diário.
 */
function zSonoCronico(){
  var d=saudeHistD('sono',14),i,n=0;
  if(d.length>=14){
    for(i=0;i<14;i++)if(d[i]<7)n++;
    return {cronico:(n>=10),n:n,tot:14,base:'dia',
      media:zStats(d.slice(0,14)).mean};
  }
  var w=saudeSerieRaw('sono_dur').filter(function(s){return s.p==='w';});
  if(!w.length)return null;
  var seq=0,soma=0;
  for(i=w.length-1;i>=0;i--){if(w[i].v/60>=7)break;seq++;soma+=w[i].v;}
  if(!seq)return null;
  return {cronico:(seq>=2),n:seq,tot:w.length,base:'semana',media:(soma/seq)/60};
}

/* ============ CARGA DE TREINO: sRPE + ACWR (Gabbett 2016) ============
 * Carga de sessão (sRPE) = RPE × duração em minutos. Só entram eventos Treino/Esporte
 * FEITOS e COM RPE registrado (o openRpe coleta ao marcar feito). É indicador DERIVADO
 * dos eventos, nunca acumulado em toggle — a mesma regra do resto do app.
 *   Aguda   = Σ sRPE dos últimos 7 dias.
 *   Crônica = Σ dos últimos 28 dias ÷ 4 (média SEMANAL). O ÷4 é a normalização: sem ele
 *             a razão nasce ~0,25 e nunca sai da zona ideal (erro do DOC de referência
 *             que o CÓDIGO da prior art, calculateAcwr, não comete — seguimos o código).
 *   ACWR = aguda / crônica.
 * Zonas (Gabbett — cortes exatos no código logo abaixo e no tooltip INFO.acwr): faixa
 *   central Ideal, depois Atenção e Perigo conforme a razão sobe; abaixo do piso é
 *   Destreino — fora-de-faixa NEUTRO, não alarme (carga baixa demais, não risco de lesão).
 * BURACO HONESTO, declarado e não mascarado: sessão sem RPE não entra e subestima a
 * carga. A cobertura (N de M sessões com esforço) vai para a tela; cobertura <60% marca
 * o número como parcial/estimado em vez de cravar um valor que parece exato — mesmo
 * princípio de "declarar a base" do peso/IMC. */
function sessaoSRPE(e){var r=num0(e.rpe);if(r==null)return null;var min=durH(e)*60;return (min>0)?r*min:null;}
function isSessao(e){return (e.subtipo==='Treino'||e.subtipo==='Esporte'||e.subtipo==='Jogo')&&e.status==='done';}
var ACWR_MIN_DIAS=28;   /* < ~28 dias de histórico: a crônica não tem sentido — estado "coletando" */
function acwrCalc(){
  var hoje=isoOf(TODAY),i,e,ini7=new Date(TODAY),ini28=new Date(TODAY);
  ini7.setDate(ini7.getDate()-6);ini28.setDate(ini28.getDate()-27);
  var i7=isoOf(ini7),i28=isoOf(ini28);
  var acute=0,chronic28=0,m28=0,n28=0,primeira=null;
  for(i=0;i<EVENTS.length;i++){e=EVENTS[i];if(!isSessao(e)||e.date>hoje)continue;
    if(primeira==null||e.date<primeira)primeira=e.date;   /* 1ª sessão feita de qualquer época */
    if(e.date<i28)continue;
    m28++;var s=sessaoSRPE(e);if(s==null)continue;n28++;chronic28+=s;
    if(e.date>=i7)acute+=s;
  }
  if(primeira==null)return {coleta:true,source:SRC_ACWR,
    msg:'Registre o esforço (RPE) dos seus treinos para acompanhar a carga.'};
  var histDias=daysBetween(primeira,hoje);
  if(histDias<ACWR_MIN_DIAS)return {coleta:true,faltam:ACWR_MIN_DIAS-histDias,source:SRC_ACWR,
    msg:'Coletando carga de treino. Disponível após '+(ACWR_MIN_DIAS-histDias)+' dia(s).'};
  var cov={n:n28,m:m28,pct:(m28>0?Math.round(n28/m28*100):0)};
  var chronic=chronic28/4;
  if(!(chronic>0))return {coleta:true,source:SRC_ACWR,cov:cov,
    msg:'Sem carga com esforço registrado nos últimos 28 dias.'};
  var acwr=acute/chronic,status;
  if(acwr<0.8)status='Destreino';
  else if(acwr<=1.3)status='Ideal';
  else if(acwr<=1.5)status='Atenção';
  else status='Perigo';
  /* `alta` = carga ELEVADA (Atenção/Perigo). Destreino também é !== 'Ideal', mas NÃO é
     carga alta: por isso as combinações de risco testam `alta`, não `status!=='Ideal'`. */
  return {acwr:acwr,acute:acute,chronic:chronic,status:status,alta:(status==='Atenção'||status==='Perigo'),
    cov:cov,parcial:(cov.pct<60),source:SRC_ACWR};
}

/* ============ RISK SCORE composto (0–100) ============
 * Índice PONDERADO dos indicadores do dia — NÃO é modelo preditivo (a prior art citava
 * Leckey/ML; não há ML aqui, então não se cita). Pesos EXATOS: HRV Baixo 25 / Atenção 12
 * · FC Elevado 25 / Atenção 12 · Sono Insuf. 20 · ACWR Perigo 20 / Atenção 10 · lesão
 * ativa 5 cada (máx 10). Nível: ≥60 Alto · ≥30 Moderado · <30 Baixo. Estados "coletando"
 * de HRV/FC/ACWR devolvem status neutro (Normal/undefined) → 0 ponto: sem dado, sem risco
 * inventado. */
function riskCalc(hrv,fc,sono,acwr,activeInjuries){
  var f=[],score=0,p;
  p=(hrv.status==='Baixo')?25:(hrv.status==='Atenção'?12:0);
  if(p>0)f.push({l:'HRV '+hrv.status,p:p});score+=p;
  p=(fc.status==='Elevado')?25:(fc.status==='Atenção'?12:0);
  if(p>0)f.push({l:'FC de repouso '+fc.status,p:p});score+=p;
  p=(sono&&sono.status==='Insuficiente')?20:0;
  if(p>0)f.push({l:'Sono insuficiente',p:p});score+=p;
  p=(acwr.status==='Perigo')?20:(acwr.status==='Atenção'?10:0);
  if(p>0)f.push({l:'Carga '+acwr.status+(acwr.acwr!=null?' (ACWR '+fmtN(acwr.acwr,2)+')':''),p:p});score+=p;
  /* activeInjuries: nº de lesões 'ativa' (leva 3 — registro de lesão + boneco anatômico).
     Cada lesão ativa soma 5, com teto de 10 (2 lesões já saturam o componente). */
  var inj=Math.min((activeInjuries||0)*5,10);
  if(inj>0)f.push({l:activeInjuries+' lesão(ões) ativa(s)',p:inj});score+=inj;
  var total=Math.min(score,100),nivel=total>=60?'Alto':(total>=30?'Moderado':'Baixo');
  return {score:total,nivel:nivel,fatores:f};
}

/* ============ INSIGHT DIÁRIO — rule-based, roda NO CLIENTE (offline, custo zero) ============
 * Determinístico: mesma entrada, mesma saída. NÃO chama LLM nem depende da rotina de
 * nuvem — a nuvem é enriquecimento OPCIONAL (o cliente é o piso, a nuvem o teto; ver
 * saudeInsHTML). Cascata por prioridade, portada da prior art: risco crítico →
 * combinações de risco → alertas individuais → tudo ok. Mensagens SEM vocabulário de
 * modalidade; citações alinhadas à leva 1 (HRV Shaffer & Ginsberg, FC AHA, sono Charest
 * & Grandner, carga Gabbett) — nunca uma 2ª citação para a mesma métrica. */
function insightCalc(hrv,fc,sono,acwr,activeInjuries,score){
  var alta=!!acwr.alta,ac=(acwr.acwr!=null?' (ACWR '+fmtN(acwr.acwr,2)+')':'');
  if(score>=70)return {msg:'Risco elevado hoje. Priorize descanso ou trabalho técnico muito leve (RPE até 3), sono e recuperação.',sev:'critical',src:SRC_LEITURA};
  if(hrv.status==='Baixo'&&alta)return {msg:'HRV bem abaixo da sua média com carga elevada. Reduza a intensidade (RPE até 5) e prefira trabalho técnico leve ou mobilidade.',sev:'warning',src:SRC_HRV};
  if(sono&&sono.status==='Insuficiente'&&alta)return {msg:'Sono abaixo de 7h com carga crescente. A privação atrasa a recuperação muscular — evite treino intenso hoje.',sev:'warning',src:SRC_SONO};
  if(fc.status==='Elevado')return {msg:'FC de repouso elevada. Pode indicar falta de recuperação ou início de infecção. Considere descanso ativo: mobilidade e alongamento.',sev:'warning',src:SRC_FC};
  if(activeInjuries>0&&alta)return {msg:'Lesão ativa com carga crescente'+ac+'. Evite atividades que sobrecarreguem a área afetada.',sev:'warning',src:SRC_ACWR};
  if(hrv.status==='Baixo')return {msg:'HRV bem abaixo da sua média. Priorize recuperação: sono, hidratação, alimentação. Se treinar, opte por trabalho técnico leve (RPE até 4) e evite esforço intenso.',sev:'warning',src:SRC_HRV};
  if(hrv.status==='Atenção')return {msg:'HRV levemente abaixo da sua média. Treino moderado; monitore a fadiga durante a sessão e ajuste a intensidade.',sev:'warning',src:SRC_HRV};
  if(acwr.status==='Atenção')return {msg:'Carga aguda acima da crônica'+ac+'. Aumente no máximo 10% por semana para reduzir o risco de lesão.',sev:'warning',src:SRC_ACWR};
  if(hrv.status==='Normal'&&(!sono||sono.status!=='Insuficiente')&&acwr.status==='Ideal')return {msg:'Todos os indicadores dentro do esperado. Bom momento para treino de qualidade ou trabalho técnico novo.',sev:'ok',src:SRC_LEITURA};
  return {msg:'Indicadores regulares. Monitore a intensidade durante o treino de hoje e registre ao final.',sev:'ok',src:SRC_LEITURA};
}

/* Prontidão do dia: junta HRV/FC/sono (baseline individual) + ACWR + risco + insight.
 * UMA fonte para os dois consumidores — o card da Saúde e a linha da Home. Tudo derivado
 * ao vivo, nada gravado. `activeInjuries` = nº de lesões com status 'ativa' (leva 3). */
function activeInjuriesCount(){var n=0;for(var i=0;i<LESOES.length;i++)if(LESOES[i].status==='ativa')n++;return n;}
function saudeProntidao(){
  var ah=saudeAtual('hrv'),af=saudeAtual('fcrep'),asl=saudeAtual('sono');
  var hrv=zHrvStatus(ah?ah.v:null,saudeHistD('hrv',Z_JANELA));
  var fc=zFcStatus(af?af.v:null,saudeHistD('fcrep',Z_JANELA));
  var sono=zSonoStatus(asl?asl.v:null);
  var acwr=acwrCalc(),activeInjuries=activeInjuriesCount();
  var risk=riskCalc(hrv,fc,sono,acwr,activeInjuries);
  var ins=insightCalc(hrv,fc,sono,acwr,activeInjuries,risk.score);
  return {hrv:hrv,fc:fc,sono:sono,acwr:acwr,risk:risk,ins:ins};
}
/** Tem sinal suficiente para valer uma leitura? (na Home, sem isso a linha some limpo) */
function prontidaoTemDado(p){return !p.hrv.coleta||!p.fc.coleta||!!(p.sono&&p.sono.status)||!p.acwr.coleta;}

/**
 * Valor ATUAL de um eixo e — inseparável dele — DE QUANDO ele é.
 * Devolve {v,iso,hoje,quando,fonte} ou null.
 *
 * BUG DE DESIGN QUE ESTA FUNÇÃO EXISTE PARA MATAR: o valor "de hoje" já morou num
 * campo `hoje` do baseline, que é uma exportação ESTÁTICA. Ele congelou no dia da
 * carga e a régua passou a mostrar o valor daquele dia rotulado como "hoje" — para
 * sempre. Valor e data têm de andar juntos, e "hoje" tem de ser uma CONCLUSÃO
 * (iso===TODAY), nunca um nome de campo.
 *
 * Cascata, do mais fresco ao mais velho:
 *  1. observação de HOJE (check-in ou registro do dia) → rotulada "hoje";
 *  2. a mais recente que existir → rotulada COM A DATA dela ("14/07 seg");
 *  3. nada disso → última leitura do relógio, com o dia em que foi medida.
 * Em qualquer empate de data o check-in vence: é o que ele conferiu e digitou.
 * Só p==='d' concorre: valor semanal não é "o valor de um dia".
 */
function saudeAtual(k){
  var ax=Z_AXIS[k];if(!ax)return null;
  var hoje=isoOf(TODAY),best=null,i,s,r,v;
  var ser=saudeOk()?saudeSerieRaw(ax.m):[];
  for(i=0;i<ser.length;i++){
    s=ser[i];
    if(s.p!=='d'||s.d>hoje)continue;
    v=ax.conv?ax.conv(s.v):s.v;
    if(typeof v!=='number'||!isFinite(v))continue;
    if(!best||s.d>=best.iso)best={v:v,iso:s.d,fonte:(s.f==='manual'?'você registrou':'do relógio')};
  }
  if(ax.ck)for(i=0;i<READINESS.length;i++){
    r=READINESS[i];if(!r||!r.date||r.date>hoje)continue;
    v=num0(r[ax.ck]);if(v==null||!isFinite(v))continue;
    if(!best||r.date>=best.iso)best={v:v,iso:r.date,fonte:'do seu check-in'};
  }
  if(!best){
    var u=saudeUltRelogio(k);if(!u)return null;
    best={v:(ax.conv?ax.conv(u.v):u.v),iso:u.iso,fonte:'do relógio'};
  }
  best.hoje=(best.iso===hoje);
  best.quando=best.hoje?'hoje':(best.iso?dLbl(best.iso):'última leitura');
  return best;
}

/* ---- Perfil: constantes do usuário (config cat:'perfil', chave em `pai`) ----
 * Altura é CADASTRO, não medida: não vem do relógio nem varia com o dia. */
/* Aqui NÃO mora nenhuma constante com a medida real do usuário, e não é descuido: este
 * arquivo é o que vai para o repo PÚBLICO — no cliente, código É publicação. Constante,
 * preset, placeholder ou COMENTÁRIO com um dado real do usuário publica esse dado, por
 * mais inofensiva que a linha pareça numa revisão (foi assim que o FIN_PRESETS ficou
 * meses no repo público). A altura vem do cadastro (cat:'perfil', planilha), que fica
 * atrás do token; sem cadastro a resposta é "não sei" e a tela degrada — nunca um chute
 * com a medida dele embutida. Vale para o exemplo de formato do JSDoc abaixo também. */
function perfilRow(chave){return CFG.find(function(c){return c.cat==='perfil'&&c.pai===chave;});}
/** Altura em metros — aceita vírgula ou ponto como separador decimal. Devolve null se o
 *  cadastro não chegou ou é implausível (fora de 1,00–2,50 m).
 *  Todo consumidor já trata null: o IMC cai na série do relógio (saudeSerie) e o
 *  altura² cai na estimativa peso/IMC de 30d (saudeAlt2). */
function saudeAltura(){var c=perfilRow('altura');var v=c?Number(String(c.valor).replace(',','.')):NaN;return (isFinite(v)&&v>1&&v<2.5)?v:null;}
/** Série crua, como veio do backend. */
function saudeSerieRaw(m){return (SAUDE.series||[]).filter(function(s){return s.m===m;}).sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});}
/**
 * Série de uma métrica, em ordem cronológica.
 * 'imc' é DERIVADO de peso/altura² — nunca lido pronto do relógio. Assim o IMC existe
 * para QUALQUER peso (inclusive o digitado num dia em que a balança não sincronizou),
 * e não há dois números para a mesma verdade. Sem série de peso, cai no imc do relógio.
 * Como todo consumidor (mensal/tailMean/pico/ult) passa por aqui, a regra vale em toda a tela.
 */
function saudeSerie(m){
  if(m==='imc'){var a=saudeAltura(),p=saudeSerieRaw('peso');
    if(a&&p.length)return p.map(function(s){return {d:s.d,m:'imc',v:s.v/(a*a),p:s.p,f:s.f};});}
  return saudeSerieRaw(m);
}
/** Um ponto tem origem manual? (a série carrega `f` do backend) */
function saudeTemManual(m){return saudeSerieRaw(m).some(function(s){return s.f==='manual';});}
/** Média por mês {'2026-07':<média do mês>} — peso/IMC têm outliers de balança, nunca use o diário cru.
 *  (Exemplo sem número real: valor de exemplo em comentário é dado do usuário publicado.) */
function saudeMensal(m){
  var g={},o={};
  saudeSerie(m).forEach(function(s){var k=s.d.slice(0,7);(g[k]=g[k]||[]).push(s.v);});
  Object.keys(g).sort().forEach(function(k){var a=g[k];o[k]=a.reduce(function(x,y){return x+y;},0)/a.length;});
  return o;
}
/** Último valor mensal de uma série 'm' (period=m: 1 ponto por mês). */
function saudeUlt(m){var s=saudeSerie(m);return s.length?s[s.length-1]:null;}
/** Ponto de pico (maior v) de uma série. */
function saudePico(m){var s=saudeSerie(m);if(!s.length)return null;return s.reduce(function(a,b){return b.v>a.v?b:a;});}
/** Média dos últimos N dias ANCORADA no último dado (não em TODAY) — robusta a outlier. */
function saudeTailMean(m,days){
  var s=saudeSerie(m);if(!s.length)return null;
  var cut=parseISO(s[s.length-1].d);cut.setDate(cut.getDate()-days);
  var w=s.filter(function(x){return parseISO(x.d)>=cut;});
  if(!w.length)return null;
  return w.reduce(function(a,b){return a+b.v;},0)/w.length;
}
/** altura² (m²) — do perfil (exato). Sem perfil, cai na estimativa peso/IMC de 30d. */
function saudeAlt2(){var a=saudeAltura();if(a)return a*a;
  var p=saudeTailMean('peso',30),i=saudeTailMean('imc',30);return (p&&i)?(p/i):null;}
/** '2026-07' → 'jul/26' */
function monLbl(k){var p=String(k).split('-');return MON[+p[1]-1]+'/'+p[0].slice(2);}
/**
 * Sinal discreto de "fora do seu normal". dir: 1 acima, -1 abaixo, 0 dentro.
 * good=true → verde (▲ HRV alto é bom); good=false → âmbar (▲ FC alta não é).
 * Sem alarmismo: seta pequena, nunca vermelho.
 */
function saudeSig(dir,good){if(!dir)return '';return '<span class="sausig '+(good?'good':'warn')+'" aria-hidden="true">'+(dir>0?'▲':'▼')+'</span>';}
/** Avalia hoje vs faixa → {dir,good} ('hrv'|'fcrep' com faixa lo/hi). */
function saudeEval(v,lo,hi,goodHigh){
  if(v==null||lo==null||hi==null)return {dir:0,good:true};
  if(v>hi)return {dir:1,good:!!goodHigh};
  if(v<lo)return {dir:-1,good:!goodHigh};
  return {dir:0,good:true};
}

/* ============================ INDICADORES ============================ */
var indPeriod='semana';
var indRef=new Date(TODAY);
function indMonday(){return mondayOf(indRef);}
function inRange(iso){var d=parseISO(iso);
  if(indPeriod==='alltime')return true;
  if(indPeriod==='dia')return iso===isoOf(indRef);
  if(indPeriod==='semana'){var m=indMonday(),e=new Date(m);e.setDate(m.getDate()+6);return d>=m&&d<=e;}
  if(indPeriod==='mes')return d.getFullYear()===indRef.getFullYear()&&d.getMonth()===indRef.getMonth();
  if(indPeriod==='ano')return d.getFullYear()===indRef.getFullYear();
  return true;}
function indLabel(){
  if(indPeriod==='alltime')return 'Tudo';
  if(indPeriod==='dia')return DOW[(indRef.getDay()+6)%7]+', '+pad(indRef.getDate())+'/'+pad(indRef.getMonth()+1)+'/'+indRef.getFullYear();
  if(indPeriod==='semana'){var m=indMonday(),e=new Date(m);e.setDate(m.getDate()+6);return pad(m.getDate())+'–'+pad(e.getDate())+' '+MON[e.getMonth()]+' '+e.getFullYear();}
  if(indPeriod==='mes')return MONFULL[indRef.getMonth()]+' '+indRef.getFullYear();
  if(indPeriod==='ano')return ''+indRef.getFullYear();
  return '';}
function indNav(n){
  if(indPeriod==='dia')indRef.setDate(indRef.getDate()+n);
  else if(indPeriod==='semana')indRef.setDate(indRef.getDate()+n*7);
  else if(indPeriod==='mes')indRef.setMonth(indRef.getMonth()+n);
  else if(indPeriod==='ano')indRef.setFullYear(indRef.getFullYear()+n);
  indRef=new Date(indRef);renderInd();}
function indToday(){indRef=new Date(TODAY);renderInd();}
var indTab='geral';
function renderInd(){
  if(indTab==='saude')saudeLoad();   // sob demanda, na 1ª abertura da subaba
  var evs=EVENTS.filter(function(e){return inRange(e.date);});
  var workH=0,persH=0,plan=0,venc=0,doneVenc=0,byProj={},bySub={},byBook={};
  var focoH=0,reuniaoH=0,estudoH=0,atendN=0,diasTrab={},byModalN={},byGi={},saudeH=0,familiaH=0;
  /* Aderência mede o que já VENCEU, não o que está projetado: no mês corrente os
     eventos futuros entravam no denominador e nunca podiam estar done, travando o
     indicador em ~50% no meio do mês. Granularidade de DIA, hoje incluído.
     `plan` continua contando o período inteiro — ele alimenta o KPI Eventos, onde
     contar o mês todo é o certo. Numerador e denominador na MESMA população: um
     evento futuro pré-marcado done fora daqui geraria aderência >100%.
     Comparação de string vale p/ 'AAAA-MM-DD' (ordem lexicográfica = cronológica). */
  var hojeIso=isoOf(TODAY);
  evs.forEach(function(e){var h=durH(e),w=isWork(e),dn=e.status==='done';
    if(w)workH+=h;else persH+=h;plan++;
    if(e.date<=hojeIso){venc++;if(dn)doneVenc++;}
    if(e.projeto)byProj[e.projeto]=(byProj[e.projeto]||0)+h;
    bySub[e.subtipo]=(bySub[e.subtipo]||0)+h;
    if(e.subsub==='Livro'&&dn&&e.detalhe)byBook[e.detalhe]=(byBook[e.detalhe]||0)+h;
    if(e.subtipo==='Foco')focoH+=h;else if(e.subtipo==='Reunião')reuniaoH+=h;else if(e.subtipo==='Estudo')estudoH+=h;else if(e.subtipo==='Atendimento'&&dn)atendN++;
    if(w&&dn)diasTrab[e.date]=(diasTrab[e.date]||0)+h;
    if(e.subtipo==='Treino'||e.subtipo==='Esporte'||e.subtipo==='Jogo'){var k=e.subsub||e.subtipo;if(dn)byModalN[k]=(byModalN[k]||0)+1;if(e.subsub==='BJJ'&&dn&&e.detalhe)byGi[e.detalhe]=(byGi[e.detalhe]||0)+1;}
    else if(e.subtipo==='Saúde')saudeH+=h;else if(e.subtipo==='Família')familiaH+=h;});
  /* null (não 0) quando nada venceu ainda: 0% seria mentira — leria como "falhou
     tudo" num período que ainda não começou. A UI mostra '—'. */
  var ader=venc?Math.round(doneVenc/venc*100):null;
  var metaDias=Object.keys(diasTrab).filter(function(d){return diasTrab[d]>=6;}).length;
  var deepPct=(focoH+reuniaoH)?Math.round(focoH/(focoH+reuniaoH)*100):0;
  var treinoN=Object.keys(byModalN).reduce(function(s,k){return s+byModalN[k];},0);
  var livrosLidos=livrosByStatus('lido').filter(function(l){var d=livroDts(l);return d.fim&&inRange(d.fim);}).length;
  function K(n,l,c){return '<div class="kpi'+(c?' '+c:'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
  /* A subaba Saúde é uma carga histórica de janela FIXA — o seletor de período e o
     navegador de datas não se aplicam a ela; mostrar inerte seria armadilha. */
  var isSau=(indTab==='saude');
  var h='<div class="page-head"><h1>Indicadores</h1><div class="spacer"></div>'+(isSau?'':'<div class="seg">'+
    [['dia','Dia'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['alltime','Tudo']].map(function(p){return '<button class="'+(indPeriod===p[0]?'active':'')+'" onclick="indPeriod=\''+p[0]+'\';renderInd()">'+p[1]+'</button>';}).join('')+'</div>')+'</div>';
  if(!isSau)h+='<div class="agenda-bar">'+(indPeriod==='alltime'?'<div class="wknav"><span class="lbl">Tudo</span></div>':'<div class="wknav"><button class="icbtn" onclick="indNav(-1)">◀</button><span class="lbl">'+indLabel()+'</span><button class="icbtn" onclick="indNav(1)">▶</button><button class="btn btn-sm" onclick="indToday()">Hoje</button></div>')+'</div>';
  h+='<div class="sys-tabs">'+[['geral','🏠 Geral'],['trabalho','💼 Trabalho'],['pessoal','🌱 Pessoal'],['saude','🩺 Saúde']].map(function(t){return '<button class="sys-tab'+(indTab===t[0]?' active':'')+'" onclick="indTab=\''+t[0]+'\';renderInd()">'+t[1]+'</button>';}).join('')+'</div>';
  if(indTab==='saude'){
    /* Mesmo container da página Saúde: o bloco é o MESMO, o espaçamento também tem de
       ser — senão as duas superfícies do mesmo conteúdo divergem já na geometria. */
    h+='<div class="flowpage">'+saudeIndicadoresHTML()+'</div>';
  } else if(indTab==='trabalho'){
    h+='<div class="kpis">'+K(fmtHm(workH),'Horas de trabalho')+K(deepPct+'%','Deep work (foco)','ok')+K(fmtHm(estudoH),'Estudo','gold')+K(metaDias,'Dias ≥6h')+'</div>';
    h+='<div class="indcols"><div class="card"><div class="grp-h">Horas por projeto</div>'+donut(byProj,'projeto')+'</div><div class="card"><div class="grp-h">Horas por subtipo</div>'+donut(bySub,'subtipo')+'</div></div>';
    h+='<div class="card" style="margin-top:14px"><div class="grp-h">🧠 Deep work — Foco × Reunião</div>'+donut({'Foco':focoH,'Reunião':reuniaoH},'subtipo')+'</div>';
  } else if(indTab==='pessoal'){
    h+='<div class="kpis">'+K(fmtHm(persH),'Horas pessoais','gold')+K(treinoN,'Treinos (sessões)')+K(livrosLidos,'Livros lidos','ok')+K(fmtHm(saudeH+familiaH),'Saúde+Família')+'</div>';
    h+='<div class="indcols"><div class="card"><div class="grp-h">🏋️ Treino — sessões por modalidade</div>'+donut(byModalN,'subsub','x')+'</div>'+(Object.keys(byGi).length?'<div class="card"><div class="grp-h">🥋 BJJ — Gi × No Gi (sessões)</div>'+donut(byGi,'_gi','x')+'</div>':'')+'</div>';
    if(series().length)h+='<div class="card" style="margin-top:14px"><div class="grp-h">🔥 Séries de treino</div>'+series().map(function(s){var d=serieDts(s),sem=serieSemanas(s),ses=serieSessoes(s.valor),al=(s.pai==='ativa'&&sem>=d.meta)?' · ⚠️ trocar':'';return '<div class="hfin"><span class="hfin-t">'+esc(s.valor)+(s.pai==='ativa'?' <span class="hfin-tag">ativa</span>':'')+'</span><span class="hfin-r">'+ses+'x · '+sem+'/'+d.meta+' sem'+al+'</span></div>';}).join('')+'</div>';
    if(Object.keys(byBook).length)h+='<div class="card" style="margin-top:14px"><div class="grp-h">📖 Leitura por livro — horas feitas</div>'+donut(byBook,'_book')+'</div>';
  } else {
    h+='<div class="kpis">'+K(fmtHm(workH),'Horas de trabalho')+K(fmtHm(persH),'Horas pessoais','gold')+K(ader==null?'—':ader+'%','Aderência · até hoje','ok')+K(plan,'Eventos · período todo')+'</div>';
    h+='<div class="card"><div class="grp-h">⚖️ Balanço Trabalho × Pessoal</div>'+donut({'Trabalho':workH,'Pessoal':persH},'_bal','h',{'Trabalho':'#3D43A2','Pessoal':'#E5A93C'})+'</div>';
    h+='<div class="indcols" style="margin-top:14px"><div class="card"><div class="grp-h">Horas por projeto</div>'+donut(byProj,'projeto')+'</div><div class="card"><div class="grp-h">Horas por subtipo</div>'+donut(bySub,'subtipo')+'</div></div>';
  }
  el('view').innerHTML=h;
}
/* ---------------------------- DONUT (composição) ----------------------------
 * Paleta de fallback: as pseudo-categorias (_bal, _gi, _book, _modal) não existem no
 * CFG, então cfgFind não devolve cor. No gráfico de barras antigo isso não incomodava
 * (cada barra era uma linha separada), mas um donut com todas as fatias da mesma cor
 * é ilegível. Ordem escolhida por contraste entre vizinhos, não por estética. */
var DONUT_PAL=['#3D43A2','#E5A93C','#1FA37A','#2E5E8C','#7A4F9E','#C8462F','#0E9AA7'];
var DONUT_MAX=6;     // acima disso a cauda vira 'Demais' — 12 fatias não se lê
var DONUT_MIN_LBL=8; // % menor que isso não cabe escrito na fatia; fica só na legenda

/** Rótulo do valor absoluto — mesma regra do gráfico de barras que isto substituiu:
 *  unit ausente/'h' = duração em relógio (fmtHm, sem sufixo); qualquer outro = contagem
 *  + sufixo (ex.: '3x'). */
function donutVal(v,unit){return (unit&&unit!=='h')?(v+unit):fmtHm(v);}
function donutCfgCol(cat,k){var c=cfgFind(cat,k);return (c&&c.cor)?c.cor:null;}

/**
 * Donut de composição: o % vive na fatia, o valor absoluto na legenda — a proporção
 * sem perder o número real.
 * map={chave:valor}; cat=categoria do CFG p/ herdar cor; unit igual ao donutVal;
 * cols={chave:cor} opcional, p/ fixar cor onde ela significa algo (Pessoal=gold).
 */
function donut(map,cat,unit,cols){
  var ks=Object.keys(map).filter(function(k){return map[k]>0;});
  if(!ks.length)return '<div class="muted" style="font-size:12px">Sem dados no período.</div>';
  ks.sort(function(a,b){return map[b]-map[a];});
  var tot=0;ks.forEach(function(k){tot+=map[k];});
  var resto=[];
  if(ks.length>DONUT_MAX){resto=ks.slice(DONUT_MAX-1);ks=ks.slice(0,DONUT_MAX-1);}
  var its=ks.map(function(k){return {k:k,v:map[k],col:(cols&&cols[k])||donutCfgCol(cat,k)};});
  if(resto.length){
    var rv=0;resto.forEach(function(k){rv+=map[k];});
    its.push({k:'Demais',v:rv,col:'#9AA0B5',det:resto.length+' itens: '+resto.join(', ')});
  }
  /* cor de fallback só p/ quem o CFG não colore, sem repetir cor já em uso */
  var used=[];its.forEach(function(it){if(it.col)used.push(it.col);});
  its.forEach(function(it,i){
    if(it.col)return;
    for(var j=0;j<DONUT_PAL.length;j++){var p=DONUT_PAL[(i+j)%DONUT_PAL.length];if(used.indexOf(p)<0){it.col=p;used.push(p);return;}}
    it.col=DONUT_PAL[i%DONUT_PAL.length];
  });
  /* % inteiros que somam exatamente 100, pelo método do maior resto: arredonda p/
     baixo e distribui o que faltar entre os maiores restos fracionários (empate =
     fatia maior primeiro). Math.round + jogar a sobra inteira na maior fatia também
     fecharia 100, mas concentra até 3pp num lugar só: com 6 fatias IGUAIS saía
     15/17/17/17/17/17 — valores idênticos exibidos como % diferentes. Aqui cada
     fatia fica a ≤1pp do real. A geometria usa o MESMO % do rótulo, senão o desenho
     e o número discordariam. */
  var soma=0;its.forEach(function(it){var ex=it.v/tot*100;it.pct=Math.floor(ex);it.frac=ex-it.pct;soma+=it.pct;});
  var ord=its.slice().sort(function(a,b){return (b.frac-a.frac)||(b.v-a.v);});
  for(var q=0;q<100-soma&&q<ord.length;q++)ord[q].pct++;
  var R=54,W=24,CX=70,CY=70,C=2*Math.PI*R,off=0,segs='',labs='';
  its.forEach(function(it){
    var len=C*it.pct/100;
    var tt=esc(it.k)+' · '+donutVal(it.v,unit)+' · '+it.pct+'%'+(it.det?' ('+esc(it.det)+')':'');
    segs+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+it.col+'" stroke-width="'+W+
      '" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
      '" transform="rotate(-90 '+CX+' '+CY+')"><title>'+tt+'</title></circle>';
    if(it.pct>=DONUT_MIN_LBL){
      var rad=((off+len/2)/C*360-90)*Math.PI/180;
      labs+='<text class="dn-lbl" x="'+(CX+Math.cos(rad)*R).toFixed(1)+'" y="'+(CY+Math.sin(rad)*R).toFixed(1)+
        '" text-anchor="middle" dominant-baseline="central">'+it.pct+'%</text>';
    }
    off+=len;
  });
  var ctr='<text class="dn-ctr" x="'+CX+'" y="'+(CY-4)+'" text-anchor="middle" dominant-baseline="central">'+donutVal(tot,unit)+'</text>'+
    '<text class="dn-sub" x="'+CX+'" y="'+(CY+12)+'" text-anchor="middle" dominant-baseline="central">total</text>';
  var leg=its.map(function(it){
    return '<div class="dn-row"'+(it.det?' title="'+esc(it.det)+'"':'')+'><span class="dn-sw" style="background:'+it.col+'"></span>'+
      '<span class="dn-k">'+esc(it.k)+'</span><span class="dn-v">'+donutVal(it.v,unit)+' · '+it.pct+'%</span></div>';
  }).join('');
  return '<div class="donut"><svg class="dn-svg" viewBox="0 0 140 140" role="img" aria-label="Composição em donut">'+
    segs+labs+ctr+'</svg><div class="dn-legend">'+leg+'</div></div>';
}

/* ---------------------- SUBABA SAÚDE (render) ----------------------
 * Janela fixa (carga histórica) — independe de indPeriod/indRef. */

/* ---------------------- RÉGUA: z-score, não faixa fixa ----------------------------
 * A banda de "seu normal" saía de faixas que EU escolhi e divergiam do relógio dele —
 * e não tinha como não divergir: não existe faixa de HRV que sirva para todo mundo.
 * A régua agora mede contra a baseline DELE (z-score) e a trilha É o eixo z: média no
 * centro, −3σ a +3σ nas pontas, zonas do status pintadas. Assim o marcador e o texto
 * contam a mesma história, e "2,2σ acima da sua média" é verificável na tela.
 */
var Z_LO=-3,Z_HI=3;
function zPct(z){return Math.max(0,Math.min(100,(z-Z_LO)/(Z_HI-Z_LO)*100));}
/** Zonas do eixo z. goodHigh (HRV): ruim à esquerda. goodLow (FC): ruim à direita. */
function zZonas(goodHigh){
  return goodHigh
    ? [{a:Z_LO,b:-1.5,c:'var(--miss)'},{a:-1.5,b:-0.5,c:'var(--gold)'},{a:-0.5,b:Z_HI,c:'var(--ok)'}]
    : [{a:Z_LO,b:0.5,c:'var(--ok)'},{a:0.5,b:1.5,c:'var(--gold)'},{a:1.5,b:Z_HI,c:'var(--miss)'}];
}
/** Semáforo: verde dentro do normal · amarelo atenção · vermelho fora. */
function zCor(st){
  if(st==='Normal'||st==='Excelente'||st==='Bom')return 'var(--ok)';
  if(st==='Atenção')return 'var(--gold)';
  if(st==='Baixo'||st==='Elevado'||st==='Insuficiente')return 'var(--miss)';
  return 'var(--muted)';
}
/** Cabeçalho comum: título + ℹ️ + pill de status (ou nada, se está coletando). */
function zHead(t,ik,st){
  return '<div class="sau-rh"><span class="sau-rt">'+esc(t)+infoBtn(ik)+'</span>'+
    (st?'<span class="sau-pill" style="background:'+zCor(st)+'">'+esc(st)+'</span>':'')+'</div>';
}
/** Valor + DE QUANDO ele é. A data anda colada no número de propósito: foi exatamente
 *  a separação dos dois que deixou a régua chamar o dado de ontem de "hoje". */
function zVal(at,fmt){
  if(!at)return '<div class="sau-rvl">—</div>';
  return '<div class="sau-rvl">'+esc(fmt(at.v))+
    '<span class="sau-when'+(at.hoje?' hoje':'')+'">'+esc(at.quando)+'</span>'+
    '<span class="sau-src">'+esc(at.fonte||'')+'</span></div>';
}
/**
 * Uma linha da régua com leitura de z-score.
 * o={k,t,fmt,goodHigh,st} — `st` vem de zHrvStatus/zFcStatus (traz status, z, mean, count).
 */
function zRuleHTML(o){
  var at=saudeAtual(o.k),st=o.st;
  var h='<div class="sau-rule">'+zHead(o.t,o.ik,st.coleta?null:st.status)+zVal(at,o.fmt);
  if(st.coleta){
    /* Sem 7 observações DIÁRIAS não há σ — a tela diz isso e o quanto falta, em vez de
       mostrar um "Normal" que não foi medido. */
    h+='<div class="sau-coleta">'+esc(st.msg)+'</div>';
    return h+'</div>';
  }
  var z=st.z,zs=zZonas(o.goodHigh),i;
  h+='<div class="sau-ztrack">';
  for(i=0;i<zs.length;i++)h+='<span class="sau-zz" style="left:'+zPct(zs[i].a).toFixed(1)+'%;width:'+
    (zPct(zs[i].b)-zPct(zs[i].a)).toFixed(1)+'%;background:'+zs[i].c+'"></span>';
  h+='<span class="sau-zmean" title="sua média"></span>';
  h+='<span class="sau-rmark" style="left:'+zPct(z).toFixed(1)+'%"></span>';
  h+='</div>';
  h+='<div class="sau-zax"><span>−3σ</span><span>sua média</span><span>+3σ</span></div>';
  h+='<div class="sau-rf">sua média '+esc(o.fmt(st.mean))+' · '+
    (Math.abs(z)<0.05?'em cima dela':(fmtN(Math.abs(z),1)+'σ '+(z<0?'abaixo':'acima')))+
    ' · '+st.count+' dias de baseline</div>';
  return h+'</div>';
}

var fmtMs=function(v){return fmtN(v,0)+' ms';};
var fmtBpm=function(v){return fmtN(v,0)+' bpm';};
var fmtHrs=function(v){return fmtClock(v*60);};
var fmtKg=function(v){return fmtN(v,1)+' kg';};
/**
 * A régua inteira. HRV e FC saem de z-score (baseline individual); sono sai de horas
 * absolutas (aqui a recomendação É populacional); peso entra SEM semáforo — o peso de
 * um dia é hidratação e sal, e um farol nele contradiria a própria dica do tooltip
 * ("compare semanas, nunca dias").
 */
function saudeReguaHTML(){
  /* Botão editar → MESMO modal do check-in (openCheckin) que a Home usa: corrige/ajusta a
     leitura direto da Saúde, sem ir na Home. Edição unificada — um só modal p/ os dois. */
  var h='<div class="card"><div class="grp-h" style="display:flex;align-items:center;gap:8px">📏 Sua régua — onde você está na sua própria baseline<span style="flex:1"></span><button class="btn btn-sm" onclick="openCheckin()">✎ Editar</button></div><div class="sau-rules">';
  var ah=saudeAtual('hrv');
  h+=zRuleHTML({k:'hrv',ik:'hrv',t:'HRV',fmt:fmtMs,goodHigh:true,
    st:zHrvStatus(ah?ah.v:null,saudeHistD('hrv',Z_JANELA))});
  var af=saudeAtual('fcrep');
  h+=zRuleHTML({k:'fcrep',ik:'fc_rep',t:'FC de repouso',fmt:fmtBpm,goodHigh:false,
    st:zFcStatus(af?af.v:null,saudeHistD('fcrep',Z_JANELA))});
  h+=zSonoRuleHTML();
  h+=zPesoRuleHTML();
  h+='</div></div>';
  return h;
}
/** Sono: threshold absoluto (≥8 Excelente · ≥7 Bom · <7 Insuficiente) — a trilha é a
 *  escala de horas, com a necessidade DELE marcada. Sem z-score: o relógio não publica
 *  sono diário e a recomendação de 7–9h não é individual. */
function zSonoRuleHTML(){
  var at=saudeAtual('sono'),b=saudeBase('sono'),st=zSonoStatus(at?at.v:null);
  var h='<div class="sau-rule">'+zHead('Sono','sono_h',st.status)+zVal(at,fmtHrs);
  var LO=4,HI=10;
  function pc(x){return Math.max(0,Math.min(100,(x-LO)/(HI-LO)*100));}
  h+='<div class="sau-ztrack">'+
    '<span class="sau-zz" style="left:0;width:'+pc(7).toFixed(1)+'%;background:var(--miss)"></span>'+
    '<span class="sau-zz" style="left:'+pc(7).toFixed(1)+'%;width:'+(pc(8)-pc(7)).toFixed(1)+'%;background:var(--gold)"></span>'+
    '<span class="sau-zz" style="left:'+pc(8).toFixed(1)+'%;width:'+(100-pc(8)).toFixed(1)+'%;background:var(--ok)"></span>'+
    ((b&&b.need!=null)?'<span class="sau-rtarget" style="left:'+pc(b.need/60).toFixed(1)+'%" title="sua necessidade"></span>':'')+
    ((at)?'<span class="sau-rmark" style="left:'+pc(at.v).toFixed(1)+'%"></span>':'')+
  '</div>';
  h+='<div class="sau-zax"><span>4h</span><span>7h · 8h</span><span>10h</span></div>';
  h+='<div class="sau-rf">'+(st.msg?esc(st.msg)+' ':'')+
    ((b&&b.need!=null)?('Sua necessidade: '+fmtClock(b.need)+'.'):'')+
    ((b&&b.dur!=null)?(' Sua média: '+fmtClock(b.dur)+'.'):'')+'</div>';
  var cr=zSonoCronico();
  if(cr&&cr.cronico)h+=zSonoCronicoHTML(cr);
  return h+'</div>';
}
/**
 * Privação crônica: FATO + o que ele significa, sem alarme. Não é um "risco alto!" —
 * é a informação de que a sequência já passou do ponto em que a literatura mede efeito,
 * dita com o número dele do lado para ele conferir.
 */
function zSonoCronicoHTML(cr){
  var q=(cr.base==='dia')
    ? (cr.n+' das últimas '+cr.tot+' noites ficaram abaixo de 7h (média '+fmtClock(cr.media*60)+').')
    : ('Suas últimas '+cr.n+' semanas ficaram, em média, em '+fmtClock(cr.media*60)+' por noite — abaixo de 7h.');
  return '<div class="sau-cron"><b>Sono abaixo de 7h de forma sustentada.</b> '+esc(q)+
    ' O efeito da privação aparece com cerca de duas semanas de atraso, então o que se acumula agora se paga depois. '+
    'É o item da régua com mais espaço para ganho.</div>';
}
/** Peso: leitura neutra. A referência é a média de 30 dias — a pesagem do dia oscila
 *  1–2 kg por hidratação e horário, e nada disso é composição corporal. */
function zPesoRuleHTML(){
  var at=saudeAtual('peso'),m30=saudeTailMean('peso',30);
  if(!at&&m30==null)return '';

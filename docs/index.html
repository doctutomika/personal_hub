/* ============================ HOME (Início) ============================
 * Clima + destaque da agenda vêm do próprio app (WX/EVENTS). Esportes, mercado, radar e
 * quotes do dia vêm do feed diário home-AAAA-MM-DD.json (rotina das 6h). Sem o feed,
 * os cards degradam bem e as quotes caem na rotação local (determinística por dia). */
var HOME=null, homeLoaded=false, homeMirTry=false, homeDidTry=false, homeRefreshing=false;
/* ---- Honestidade de data ----------------------------------------------------
 * Quando o DID/feed do dia não roda, o app cai no conteúdo da última edição. Mostrar
 * isso SEM dizer de quando é faz o usuário ler notícia de ontem como se fosse de hoje
 * (aconteceu, e parecia bug). Mesma disciplina do peso/IMC ("média 30d"): declarar a base.
 * edIsoOf() devolve a data REAL da edição carregada; srcDayLbl() só rotula quando não é hoje. */
/** Mês por extenso ("23 de julho de 2026") → índice 0-11, ou -1. */
function mesIdx(nome){var n=String(nome||'').toLowerCase();for(var i=0;i<MONFULL.length;i++)if(MONFULL[i].toLowerCase()===n)return i;return -1;}
/** Data (ISO) da edição carregada. O campo `data` do JSON é TEXTO ("Quinta-feira, 23 de julho
 *  de 2026"), então a ordem é: data_iso (carimbado pelo servidor com o nome do arquivo) >
 *  ISO dentro de `data` > ISO no nome da edição aberta > data por extenso. Sem nenhum: ''
 *  (e aí nada é rotulado — melhor não rotular do que chutar "hoje"). */
function edIsoOf(kind,o){
  if(o&&o.data_iso&&/^\d{4}-\d{2}-\d{2}$/.test(o.data_iso))return o.data_iso;
  var s=(o&&o.data)?String(o.data):'';
  var m=/(\d{4}-\d{2}-\d{2})/.exec(s);if(m)return m[1];
  m=/(\d{4}-\d{2}-\d{2})/.exec(edCur[kind]||'');if(m)return m[1];
  m=/(\d{1,2})\s+de\s+([^\s,]+)\s+de\s+(\d{4})/i.exec(s);
  if(m){var mi=mesIdx(m[2]);if(mi>=0)return m[3]+'-'+pad(mi+1)+'-'+pad(parseInt(m[1],10));}
  return '';
}
/** Rótulo discreto de procedência: '' quando o conteúdo É do dia; senão diz de quando é. */
function srcDayLbl(iso){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return '';
  if(iso===isoOf(TODAY))return '';
  var ont=new Date(TODAY);ont.setDate(ont.getDate()-1);
  var dm=iso.slice(8,10)+'/'+iso.slice(5,7);
  return '<span class="hstale">'+(iso===isoOf(ont)?'de ontem · '+dm:'de '+dm)+'</span>';
}
function homeTxt(s){return String(s==null?'':s).replace(/<span class="pj"[^>]*>[\s\S]*?<\/span>/gi,'').replace(/<[^>]+>/g,'').replace(/\*+/g,'').replace(/\s+/g,' ').trim();}
/** Fallback do card Mercado: extrai o 1º item de mercado direto do DID (mkt/bigtech), quando o feed do dia (cron) não trouxe HOME.mercado. Espelha didHojeItem_ do server. */
function didMktItem(d){if(!d)return null;var aba=null;(d.abas||[]).forEach(function(a){if(!aba&&a.id==='mercados')aba=a;});var secoes=(aba?aba.secoes:d.secoes)||[];var pool=[];['mkt','bigtech'].forEach(function(id){for(var s=0;s<secoes.length;s++)if(secoes[s].id===id)(secoes[s].itens||[]).forEach(function(it){pool.push(it);});});if(!pool.length)return null;var it=pool[0];var f=(it.fontes||[])[0];var o={titulo:homeTxt(it.titulo),resumo:homeTxt(it.resumo||'')};if(f)o.fonte={nome:f.nome,url:f.url};return o;}
/** Esportes: normaliza o feed em uma LISTA genérica de slots.
 *  Formato atual: {slots:[{id,icone,titulo,linhas:[{txt,lbl?,dim?}],fonte?,nota?}]} — quem decide o que
 *  entra é o servidor (o cliente não conhece esporte nenhum). Formato ANTIGO (uma chave fixa por
 *  esporte, valor string/objeto) ainda é aceito: feed velho no Drive não pode quebrar a Home. */
function homeSportsSlots(sp){
  if(!sp)return [];
  if(sp.slots&&sp.slots.length)return sp.slots;
  var out=[],k,v,i;
  for(k in sp){ if(!Object.prototype.hasOwnProperty.call(sp,k))continue;
    v=sp[k]; if(!v)continue;
    var tit=String(k).charAt(0).toUpperCase()+String(k).slice(1),ln=[];
    if(typeof v==='string'){ln.push({txt:v});}
    else if(typeof v==='object'){
      if(v.evento)tit=v.evento; else if(v.titulo)tit=v.titulo;
      if(v.ultimo)ln.push({txt:v.ultimo});
      if(v.proximo)ln.push({txt:'Próximo: '+v.proximo,dim:true});
      if(v.resumo)ln.push({txt:v.resumo});
      if(v.atp&&v.atp.length)ln.push({lbl:'ATP',txt:v.atp.join(' · ')});
      if(v.wta&&v.wta.length)ln.push({lbl:'WTA',txt:v.wta.join(' · ')});
    }
    if(ln.length)out.push({icone:'🏅',titulo:tit,linhas:ln});
  }
  return out;
}
function homeSportsHtml(sp){

}

var SELDON_QUOTES=[  /* MANTER EM SYNC com SRV_SELDON em Code.gs (fonte da verdade do feed) — só fallback offline */

function dayOfYear(){var s=new Date(TODAY.getFullYear(),0,1);return Math.floor((TODAY-s)/86400000);}
/** Destaque da agenda de hoje: ★ no título > primeira Reunião > próximo evento a partir de agora. */
function homeAgenda(){var iso=isoOf(TODAY),evs=eventsOf(iso);if(!evs.length)return null;
  var now=new Date(),nmin=now.getHours()*60+now.getMinutes();
  /* "a fazer" = ainda não feito/marcado E que não passou do horário (fim no futuro) */
  var todo=evs.filter(function(e){return e.status!=='done'&&e.status!=='miss'&&toMin(e.end)>nmin;});
  var star=todo.filter(function(e){return /★|⭐/.test(e.titulo||'');})[0];
  var meet=todo.filter(function(e){return e.subtipo==='Reunião';})[0];
  var wh=0;evs.forEach(function(e){if(isWork(e))wh+=durH(e);});
  return {evs:evs,todo:todo,destaque:star||meet||todo[0]||null,wh:wh};}

function homeRefresh(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();toast('Atualizando…');
  homeLoaded=false;homeMirTry=false;
  api('pullAgenda').then(function(r){if(r&&r.events)EVENTS=r.events;}).catch(function(){}).then(function(){wxLoad();if(page==='home')renderHome();toast('Atualizado ✓');});}
/** ESCOPO HOME (↻ do cabeçalho da página): rebusca TUDO que alimenta a Home — eventos, feed do dia,
 *  DID, MIR e clima. Refaz as 3 buscas do guard — inclusive a do DID, que o ↻ da agenda nunca
 *  refazia (homeDidTry ficava true p/ sempre) — e, no PWA, invalida o cache antes de reler.
 *  Guarda homeRefreshing: dois cliques seguidos não disparam duas rodadas. */
function homeRefreshAll(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();
  if(homeRefreshing)return;
  homeRefreshing=true;toast('Atualizando…');
  if(typeof hubBustCache==='function')hubBustCache();   // PWA: força revalidação na próxima leitura
  /* As 3 flags entram como JÁ TENTADAS porque quem rebusca agora é esta função: em false, o
   * renderHome logo abaixo dispararia as MESMAS chamadas de novo. Se a chamada falhar, a flag
   * volta a false e o guard do renderHome tenta outra vez mais tarde. */
  homeLoaded=true;homeMirTry=true;homeDidTry=true;
  if(page==='home')renderHome();   // ↻ já entra em estado "girando"
  var get=function(fn,ok,undo){return api(fn).then(function(x){if(x&&!x.error)ok(x);},function(){if(undo)undo();});};
  Promise.all([
    get('pullAgenda',function(r){if(r.events)EVENTS=r.events;}),
    get('getHome',function(x){HOME=x;},function(){homeLoaded=false;}),
    get('getDID',function(x){DID=x;},function(){homeDidTry=false;}),
    get('getMIR',function(x){MIR=x;},function(){homeMirTry=false;})

/* ---- Régua do check-in: o número nasce com o contexto do baseline ao lado ----

 * renderiza exatamente como antes da feature — degradação limpa, sem quebrar. */
/* Home e página de Saúde falam do MESMO número: as duas leem o mesmo z (zHrvStatus/
 * zFcStatus). Se a Home dissesse "seu normal é a faixa X–Y" e a régua "1,2σ abaixo", o
 * app daria dois veredictos para o mesmo HRV e um deles estaria errado.
 * (X–Y fica como letra: a faixa basal real do usuário é dado dele, e comentário deste
 *  arquivo é publicado junto com o código — ver o bloco do perfil, mesma regra.) */
function ckHrvRef(v){
  if(!saudeOk())return null;
  var st=zHrvStatus(v,saudeHistD('hrv',Z_JANELA));
  if(st.coleta)return {ref:'coletando baseline',sig:''};
  return {ref:st.status+' · sua média '+st.mean+'ms',sig:saudeSig(st.z<=-0.5?-1:0,false)};
}
function ckFcRef(v){
  if(!saudeOk())return null;
  var st=zFcStatus(v,saudeHistD('fcrep',Z_JANELA));
  if(st.coleta)return {ref:'coletando baseline',sig:''};
  return {ref:st.status+' · sua média '+st.mean+' bpm',sig:saudeSig(st.z>=0.5?1:0,false)};
}
function ckSonoRef(hrs){

    var done=0,miss=0,pend=0;ag.evs.forEach(function(e){if(e.status==='done')done++;else if(e.status==='miss')miss++;else pend++;});
    h+='<div class="hstatus"><span class="hs done">✓ '+done+' feito'+(done===1?'':'s')+'</span><span class="hs pend">○ '+pend+' pendente'+(pend===1?'':'s')+'</span>'+(miss?'<span class="hs miss">✗ '+miss+' não feito'+(miss>1?'s':'')+'</span>':'')+'</div>';
    h+='<div class="hfoot">'+ag.evs.length+' evento'+(ag.evs.length>1?'s':'')+(ag.wh?' · <b>'+fmtHm(ag.wh)+'</b> de trabalho':'')+'<span style="flex:1"></span><button class="btn btn-sm" onclick="go(\'agenda\')">Abrir agenda →</button></div>';
  }else h+='<div class="hempty">Sem compromissos hoje 🎉</div><div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="go(\'agenda\')">Abrir agenda →</button></div>';
  h+='</div>';
  /* Check-in de recuperação — fluxo da manhã, logo depois da agenda do dia */
  h+=checkinCardHTML();
  /* Cruzamento — seção-assinatura do domingo (só aparece se o DID da semana tiver o campo) */
  if(DID&&DID.cruzamento&&DID.cruzamento.length){var cz0=DID.cruzamento[0];
    h+='<div class="card hcard cruz-home"><h3>🔀 O Cruzamento <span class="cz-sub">Saúde × Mercado</span>'+srcDayLbl(isoDid)+'</h3><h4>'+esc(cz0.titulo)+'</h4><p>'+esc(homeTxt(cz0.resumo||''))+'</p>'+/*cz*/
      '<div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="go(\'did\')">Ler no DID →</button></div></div>';
  }
  /* Financeiro — Hoje (reminders do dia) + Próximos (os 2 seguintes) */
  var fuAll=finUpcoming(70);
  var finHoje=fuAll.filter(function(x){return finRelDay(x.date)==='hoje';});
  var finProx=fuAll.filter(function(x){return finRelDay(x.date)!=='hoje';}).slice(0,2);
  var finRow=function(x,due,showRel){return '<div class="hfin'+(due?' due':'')+'"><span class="hfin-d">'+pad(x.date.getDate())+'/'+pad(x.date.getMonth()+1)+'</span><span class="hfin-t">'+esc(x.item.valor)+(finMonths(x.item.cor)?' <span class="hfin-tag">trim.</span>':'')+'</span>'+(showRel?'<span class="hfin-r">'+finRelDay(x.date)+'</span>':'')+'</div>';};
  h+='<div class="card hcard"><h3>💰 Financeiro</h3>';
  h+='<div class="hfin-sec">Hoje</div>';
  h+=finHoje.length?('<div class="hfin-list">'+finHoje.map(function(x){return finRow(x,true,false);}).join('')+'</div>'):'<div class="hempty" style="padding:3px 0 6px">Você não tem compromissos hoje</div>';
  h+='<div class="hfin-sec">Próximos</div>';
  h+=finProx.length?('<div class="hfin-list">'+finProx.map(function(x){return finRow(x,false,true);}).join('')+'</div>'):'<div class="hempty" style="padding:3px 0">Nada à vista</div>';
  h+='<div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="sysTab=\'fin\';go(\'sys\')">Gerenciar →</button></div></div>';
  /* Livro ativo — só aparece se houver livro "Em leitura" */
  var livAtivos=(typeof livrosByStatus==='function')?livrosByStatus('lendo'):[];
  if(livAtivos.length){
    h+='<div class="card hcard"><h3>📖 Lendo agora</h3><div class="hbook-list">'+livAtivos.map(function(l){var d=livroDts(l);var dias=d.ini?daysBetween(d.ini,isoOf(TODAY)):0;var sp=livroHorasSplit(l);return '<div class="hbook"><div class="hbook-t">'+esc(l.valor)+'</div><div class="hbook-m"><b>'+fmtHm(sp.tot)+'</b> lidas'+(sp.base>0?('<span class="hbook-comp">'+esc(livroHorasComp(l))+'</span>'):'')+(d.ini?' · há '+dias+' dia'+(dias===1?'':'s'):'')+(d.modo?' · '+livroModoLbl(d.modo):'')+'</div></div>';}).join('')+'</div>';
    h+='<div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="sysTab=\'livro\';go(\'sys\')">Livros →</button></div></div>';
  }
  /* Mercado — o feed do dia manda; sem ele cai no DID, e aí a data declarada é a do DID (não a do feed). */
  var mk=(HOME&&HOME.mercado)?HOME.mercado:null, mkIso=mk?isoHome:'';
  if(!mk){var mkFb=didMktItem(DID);if(mkFb){mk=mkFb;mkIso=isoDid;}}
  h+='<div class="card hcard"><h3>📈 Mercado'+srcDayLbl(mkIso)+'</h3>';
  if(mk){h+='<h4>'+esc(mk.titulo||'')+'</h4><p>'+esc(mk.resumo||'')+'</p>'+(mk.fonte?'<div class="src">Fonte: <a href="'+(mk.fonte.url||'#')+'" target="_blank" rel="noopener">'+esc(mk.fonte.nome||'')+'</a></div>':'');}
  else h+='<div class="hempty">Sem edição de hoje ainda — a rotina das 6h publica a do dia.</div>';
  h+='<div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="go(\'did\')">Ler o DID →</button></div></div>';
  /* MIR Health — destaque do relatório de saúde (ao vivo da última edição; declara a data se não for a de hoje) */
  var mhi=MIR?mirHomeHi(MIR):'';
  h+='<div class="card hcard"><h3>🩺 MIR Health'+(mhi?srcDayLbl(isoMir):'')+'</h3>';
  h+=mhi?'<p>'+esc(mhi)+'</p>':'<div class="hempty">Abra para ver o relatório de saúde.</div>';
  h+='<div class="hfoot"><span style="flex:1"></span><button class="btn btn-sm" onclick="go(\'mir\')">Abrir MIR Health →</button></div></div>';
  /* Esportes — o servidor manda os slots já decididos (nome de time é DADO, nunca código do cliente) */
  var spH=(HOME&&HOME.esportes)?homeSportsHtml(HOME.esportes):'';
  h+='<div class="card hcard"><h3>🏟️ Esportes'+(spH?stale:'')+'</h3>';
  h+=spH||'<div class="hempty">Sem placar de hoje ainda — chega com a rotina das 6h.</div>';
  h+='</div>';
  /* Radar */
  h+='<div class="card hcard"><h3>🔭 Radar'+((HOME&&HOME.extra)?stale:'')+'</h3>';
  if(HOME&&HOME.extra){h+='<h4>'+esc(HOME.extra.titulo||'')+'</h4><p>'+esc(HOME.extra.resumo||'')+'</p>'+(HOME.extra.fonte?'<div class="src">Fonte: <a href="'+(HOME.extra.fonte.url||'#')+'" target="_blank" rel="noopener">'+esc(HOME.extra.fonte.nome||'')+'</a></div>':'');}
  else h+='<div class="hempty">Sem edição de hoje ainda.</div>';
  h+='</div>';
  h+='</div>';
  /* Quotes — só usa as do feed quando o feed É de hoje; feed velho cairia na frase de ONTEM,
   * enquanto a rotação local (determinística por dia) já dá a frase de hoje. */
  var sq=(isToday&&HOME.seldon)||SELDON_QUOTES[(dayOfYear()+1)%SELDON_QUOTES.length];   /* +1: casa com o índice 'D' (1-based) do servidor — mesma frase do feed */
  h+='<div class="seldon-banner">“'+esc(sq)+'”<div class="sb-a">— Hari Seldon</div></div>';
  var bq=(isToday&&HOME.quote&&HOME.quote.texto)?{t:HOME.quote.texto,a:HOME.quote.autor||''}:BIZ_QUOTES[(dayOfYear()+1)%BIZ_QUOTES.length];   /* +1: casa com o índice 'D' (1-based) do servidor */
  h+='<div class="bq">“'+esc(bq.t)+'”<span class="bq-a">— '+esc(bq.a)+'</span></div>';
  el('view').innerHTML=h;
}

/* ============================ ÁUDIO PRÉ-GERADO (MP3) — DID e MIR ============================
 * A rotina de nuvem publica <kind>-audio-<date>.mp3 na pasta do dia; o app busca via api('getAudio')
 * e toca num <audio> nativo (scrubber do sistema). Sem áudio (mp3:null) ou offline → só avisa.
 * Velocidade própria (AUDIO.rate, persistida em hub_tts_rate) — o antigo TTS (Web Speech) foi removido. */
var AUDIO_CACHE={};   // 'kind|date' -> blob URL (não rebaixa o MP3 num segundo clique)
var AUDIO={open:'',kind:'',url:'',loading:false,autoplay:false,
  rate:(function(){try{var r=parseFloat(localStorage.getItem('hub_tts_rate')||'1');return [1,1.25,1.5].indexOf(r)>=0?r:1;}catch(e){return 1;}})()};
/** Data (ISO) da edição exibida: nome da edição escolhida > campo data do objeto > hoje. */
function audioDateOf(kind){var m=/(\d{4}-\d{2}-\d{2})/.exec(edCur[kind]||'');if(m)return m[1];
  var d=kind==='mir'?MIR:DID,iso=d&&d.data?String(d.data):'';
  return /^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:isoOf(TODAY);}
function audioBlobUrl(b64){var bin=atob(b64),n=bin.length,bytes=new Uint8Array(n);for(var i=0;i<n;i++)bytes[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));}
function audioBtnsHTML(kind){return '<span class="aud-slot" id="audSlot" data-ctx="'+kind+'">'+audioSlotHTML(kind)+'</span>';}
function audioSlotHTML(kind){
  if(AUDIO.open===kind)return audioBarHTML();
  var ld=AUDIO.loading&&AUDIO.kind===kind;
  return '<button class="btn btn-sm aud-btn" onclick="audioPlay(\''+kind+'\')" title="Ouvir o áudio da edição"'+(ld?' disabled':'')+'>'+(ld?'⏳ Carregando…':'🎧 Ouvir')+'</button>';}
/** Nome do arquivo baixado: DID-<data>.mp3 / MIR-<data>.mp3, data da edição aberta (runtime). */
function audioDlName(){var k=AUDIO.open||AUDIO.kind||'did';return k.toUpperCase()+'-'+audioDateOf(k)+'.mp3';}
function audioBarHTML(){
  var dl=AUDIO.url?('<a class="btn btn-sm aud-dl" href="'+AUDIO.url+'" download="'+esc(audioDlName())+'" title="Baixar o MP3">⬇</a>'):'';
  return '<span class="aud-bar">'+
    '<audio id="audEl" controls preload="auto"></audio>'+
    '<button class="btn btn-sm" onclick="audioSkip(-15)" title="Voltar 15 segundos">⏪ 15s</button>'+
    '<button class="btn btn-sm" onclick="audioSkip(15)" title="Avançar 15 segundos">15s ⏩</button>'+
    '<button class="btn btn-sm" id="audRateBtn" onclick="audioRate()" title="Velocidade do áudio">'+String(AUDIO.rate).replace('.',',')+'×</button>'+
    dl+
    '<button class="btn btn-sm" onclick="audioClose()" title="Fechar o áudio">×</button></span>';}
function audioUi(){var s=el('audSlot');if(!s)return;var kind=s.getAttribute('data-ctx');s.innerHTML=audioSlotHTML(kind);if(AUDIO.open===kind)audioWire();}
/** Liga o <audio> ao blob URL (chamado após cada render que inclui a barra). Autoplay só no clique. */
function audioWire(){var a=el('audEl');if(!a||!AUDIO.url)return;a.src=AUDIO.url;a.playbackRate=AUDIO.rate;
  if(AUDIO.autoplay){AUDIO.autoplay=false;var p=a.play();if(p&&p.catch)p.catch(function(){});}}
function audioPlay(kind){
  if(AUDIO.loading)return;
  var date=audioDateOf(kind),key=kind+'|'+date;
  if(AUDIO_CACHE[key]){audioOpenBar(kind,AUDIO_CACHE[key]);return;}
  AUDIO.loading=true;AUDIO.kind=kind;audioUi();toast('Carregando áudio…');
  api('getAudio',kind,date).then(function(r){
    AUDIO.loading=false;
    if(r&&r.mp3){AUDIO_CACHE[key]=audioBlobUrl(r.mp3);audioOpenBar(kind,AUDIO_CACHE[key]);}
    else audioFallback(kind);
  }).catch(function(){AUDIO.loading=false;audioFallback(kind);});}
/** Sem MP3 (ou offline): só avisa — não há mais leitura por voz de fallback. */
function audioFallback(kind){audioUi();toast('Sem áudio desta edição ainda');}
function audioOpenBar(kind,url){
  AUDIO.open=kind;AUDIO.kind=kind;AUDIO.url=url;AUDIO.autoplay=true;audioUi();}
function audioSkip(s){var a=el('audEl');if(!a)return;var d=isFinite(a.duration)&&a.duration>0?a.duration:1e9;
  a.currentTime=Math.max(0,Math.min(d,a.currentTime+s));}
function audioRate(){var seq=[1,1.25,1.5],i=seq.indexOf(AUDIO.rate);AUDIO.rate=seq[(i+1)%seq.length];try{localStorage.setItem('hub_tts_rate',String(AUDIO.rate));}catch(e){}
  var a=el('audEl');if(a)a.playbackRate=AUDIO.rate;var r=el('audRateBtn');if(r)r.textContent=String(AUDIO.rate).replace('.',',')+'×';}
function audioClose(){var a=el('audEl');if(a){try{a.pause();}catch(e){}}AUDIO.open='';AUDIO.url='';AUDIO.autoplay=false;audioUi();}

/* ============================ DID — EXPORT HTML + PDF ============================

 * pelo layout de export e restaurando no afterprint). Paleta = a identidade já usada no app (índigo #3D43A2 / #161A3F +
 * dourado #E5A93C + cores de setor), REDECLARADA aqui de propósito: o export é self-contained e não herda o :root
 * do app, então as cores precisam viajar junto com o arquivo. Mudou a identidade lá em cima? Muda aqui também.

var DID_CSS=`

.did-report .blk.mkt{border-top-color:#3D43A2}.did-report .blk.crypto{border-top-color:#7A4F9E}.did-report .blk.agro{border-top-color:#4E944F}.did-report .blk.bigtech{border-top-color:#5A54C9}.did-report .blk.tech{border-top-color:#0E9AA7}.did-report .blk.consult{border-top-color:#475569}

`;
function didTkStripHTML(arr,cls){if(!arr||!arr.length)return '';return '<div class="ticker'+(cls?' '+cls:'')+'">'+arr.map(function(t){var c=t.d==='up'?'up':(t.d==='down'?'down':'');var ar=t.d==='up'?'▲':(t.d==='down'?'▼':'');return '<div class="tk"><span class="s">'+esc(t.s)+'</span><span class="v '+c+'">'+esc(t.v)+(ar?' '+ar:'')+'</span></div>';}).join('')+'</div>';}
/** No export, remove o markup do chip de frente pessoal do lead e mantém a frase: o
 *  arquivo exportado é para LEITOR EXTERNO e não deve carregar a taxonomia interna de
 *  quem o gerou. Edições novas já vêm sem o chip. */
function stripPj(s){return String(s==null?'':s).replace(/\s*<span class="pj"[^>]*>([\s\S]*?)<\/span>/gi,' $1');}
function didExportBodyHTML(d){
  var dl=d.data||d.dataLabel||'';
  var sub=(d.subtitulo&&!/pessoal/i.test(d.subtitulo))?d.subtitulo:'Inteligência diária de mercados';
  var aba=(d.abas&&d.abas.length)?(d.abas.filter(function(a){return a.id==='mercados';})[0]||d.abas[0]):null;
  var lead=aba?aba.lead:d.lead, secoes=aba?aba.secoes:d.secoes;
  var h='<header><div class="hd-in"><div class="brand">DID<small>'+esc(sub)+'</small></div><div class="hd-meta"><b>'+esc(dl)+'</b><br>'+esc(d.local||'São Paulo')+' · Edição diária</div></div></header>';
  h+=didTkStripHTML(d.ticker);
  h+='<div class="wrap">';
  if(d.cruzamento&&d.cruzamento.length)h+='<div class="cz-export"><h2 class="sec">🔀 O Cruzamento — Saúde × Mercado</h2>'+d.cruzamento.map(function(it){return '<div class="item"><h4>'+esc(it.titulo)+'</h4><p>'+esc(stripPj(it.resumo||''))+'</p>'+(it.porque?'<div class="why"><b>A leitura:</b> '+esc(it.porque)+'</div>':'')+didFontesHTML(it)+'</div>';}).join('')+'</div>';
  if(lead&&lead.length)h+='<h2 class="sec">Sumário Executivo</h2><div class="lead"><ul>'+lead.map(function(x){return '<li>'+stripPj(leadTxt(x))+'</li>';}).join('')+'</ul></div>';
  (secoes||[]).forEach(function(s){
    if(/saude/i.test(s.id||''))return;   // saúde não entra como seção — vai só como teaser-ponte
    h+='<h2 class="sec">'+esc(s.nome)+'</h2><div class="blk '+(s.id||'')+'">'+((s.tickers&&s.tickers.length)?didTkStripHTML(s.tickers,'sec-tk'):'')+(s.itens||[]).map(function(it){return '<div class="item"><h4>'+esc(it.titulo)+'</h4><p>'+esc(it.resumo||'')+'</p>'+(it.porque?'<div class="why"><b>Por que importa:</b> '+esc(it.porque)+'</div>':'')+didFontesHTML(it)+'</div>';}).join('')+'</div>';
  });
  if(d.saude_teaser){var t=d.saude_teaser;h+='<div class="teaser"><div class="tag">🩺 '+esc(t.titulo||'Saúde hoje')+'</div>'+(t.itens||[]).map(function(it){return '<div class="item"><h4>'+esc(it.titulo)+'</h4><p>'+esc(it.resumo||'')+'</p></div>';}).join('')+'<div class="cta">→ Análise completa no <b>MIR Health</b> (relatório de saúde).</div></div>';}
  h+='</div>';
  h+='<footer><b>DID</b> · '+esc(sub)+' · Edição de '+esc(dl)+' · '+esc(d.local||'São Paulo')+'.<br>Cotações indicativas; não constituem recomendação de investimento.</footer>';
  return h;
}
function injectDidCss(){if(!document.getElementById('did-css')){var st=document.createElement('style');st.id='did-css';st.textContent=DID_CSS;document.head.appendChild(st);}}

var MIR_CSS=`
.mir{--green:#1a4d4d;--green-d:#123838;--green-2:#2f3e38;--up:#2fa82f;--down:#e5221c;--gold:#c19f60;--cream:#f3f0e6;--card:#fbfaf4;--ink:#1c2b26;--mut:#5f6b62;--line:#e0dccb;
  background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman","Iowan Old Style",serif;line-height:1.55;font-size:15px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mir *{box-sizing:border-box}
.mir .wrap{max-width:900px;margin:0 auto;padding:0 22px 34px}
.mir header{background:var(--green-d);color:var(--cream);padding:22px;border-bottom:3px solid var(--gold)}
.mir .hd-in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.mir .logo svg{height:50px;width:auto;display:block}
.mir .hd-meta{text-align:right;font-size:13px;opacity:.92;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .hd-meta b{color:#fff}
.mir .tagline{max-width:900px;margin:0 auto;padding:9px 22px 0;font-size:12px;color:var(--mut);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.2px}
.mir h2.sec{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--green);margin:30px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--gold);font-weight:800}
.mir .tk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mir .tk-blk{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:6px;padding:12px 14px}
.mir .tk-blk h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .tk-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:1px dashed var(--line)}
.mir .tk-row:first-of-type{border-top:0}
.mir .tk-s{font-weight:700}
.mir .tk-lbl{display:flex;flex-direction:column;line-height:1.15}
.mir .tk-nm{font-size:10px;color:var(--mut);font-weight:400;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .tk-v{font-variant-numeric:tabular-nums;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;white-space:nowrap}
.mir .up{color:var(--up)} .mir .down{color:var(--down)}
.mir .movers{font-size:11.5px;color:var(--mut);margin:8px 2px 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .exec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:6px;padding:14px 18px;margin-bottom:14px}
.mir .exec ul{margin:0;padding-left:18px} .mir .exec li{margin:7px 0}
.mir .senti{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mir .s-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
.mir .s-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:6px}
.mir .s-name{font-size:11px;font-weight:800;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .badge{font-size:10px;font-weight:800;border-radius:20px;padding:2px 9px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;white-space:nowrap}
.mir .b-pos{background:var(--up)} .mir .b-neu{background:var(--gold)} .mir .b-neg{background:var(--down)}
.mir .s-why{font-size:11.5px;color:var(--mut)}
.mir .blk{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:6px;padding:4px 18px 14px;margin-bottom:14px}
.mir .blk.pharma{border-top-color:var(--green)} .mir .blk.medtech{border-top-color:#2f7d5f} .mir .blk.iadigital{border-top-color:var(--gold)} .mir .blk.brasil{border-top-color:#5f8d3a}
.mir .item{padding:12px 0;border-top:1px solid var(--line)}
.mir .item:first-of-type{border-top:0}
.mir .item h4{margin:0 0 5px;font-size:16px;color:var(--green-d);font-family:Georgia,serif}
.mir .item p{margin:0 0 7px;color:#26332c}
.mir .why{background:#eef2ea;border-left:3px solid var(--up);border-radius:4px;padding:7px 10px;font-size:13px;margin-bottom:6px}
.mir .why b{color:var(--green)}
.mir .src{font-size:12px;color:var(--mut);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .src a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--gold)}
.mir .leitura{background:#eef2ea;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:12px 18px;margin-bottom:14px}
.mir .leitura .tag{display:inline-block;background:var(--green);color:var(--cream);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;border-radius:4px;padding:2px 8px;margin-bottom:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mir .leitura h4{margin:2px 0 5px;color:var(--green-d);font-family:Georgia,serif}
.mir .mon{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 18px}
.mir .mon ul{margin:8px 0;padding-left:18px} .mir .mon li{margin:6px 0}
.mir footer{max-width:900px;margin:26px auto 0;padding:14px 22px 0;border-top:2px solid var(--gold);font-size:11.5px;color:var(--mut);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media(max-width:640px){.mir .tk-grid,.mir .senti{grid-template-columns:1fr}}

  h+='<div class="tagline">'+esc(d.subtitulo||'Market Insight Report on Health — inteligência condensada do mercado de saúde')+'</div>';
  h+='<div class="wrap">';
  h+='<h2 class="sec">Dashboard de mercado — saúde</h2><div class="tk-grid">'+(d.tickers||[]).map(function(b){return '<div class="tk-blk"><h4>'+esc(b.bloco)+'</h4>'+(b.itens||[]).map(function(t){var c=t.d==='up'?'up':(t.d==='down'?'down':'');var ar=t.d==='up'?'▲':(t.d==='down'?'▼':'');return '<div class="tk-row"><span class="tk-lbl"><span class="tk-s">'+esc(t.s)+'</span><span class="tk-nm">'+esc(t.n||'')+'</span></span><span class="tk-v '+c+'">'+esc(t.v)+(ar?' '+ar:'')+'</span></div>';}).join('')+'</div>';}).join('')+'</div>';
  if(d.top_movers){var up=(d.top_movers.up||[]).map(function(t){return '<span class="up">'+esc(t.s)+' '+esc(t.v)+'</span>';}).join(', ');var dn=(d.top_movers.down||[]).map(function(t){return '<span class="down">'+esc(t.s)+' '+esc(t.v)+'</span>';}).join(', ');h+='<p class="movers">'+(d.tickers_nota?esc(d.tickers_nota)+' ':'')+(up?'<b>Altas:</b> '+up+'. ':'')+(dn?'<b>Baixas:</b> '+dn+'.':'')+'</p>';}
  else if(d.tickers_nota)h+='<p class="movers">'+esc(d.tickers_nota)+'</p>';
  h+='<h2 class="sec">Panorama executivo</h2><div class="exec"><ul>'+(d.resumo_executivo||[]).map(function(x){return '<li>'+leadTxt(x)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="senti">'+(d.sentimento||[]).map(function(s){var b=s.nota==='+'?'b-pos':(s.nota==='-'?'b-neg':'b-neu');var lbl=s.nota_txt?String(s.nota_txt).toUpperCase():(s.nota==='+'?'POSITIVO':(s.nota==='-'?'NEGATIVO':'NEUTRO'));return '<div class="s-card"><div class="s-top"><span class="s-name">'+esc(s.setor)+'</span><span class="badge '+b+'">'+esc(lbl)+'</span></div><div class="s-why">'+esc(s.porque||'')+'</div></div>';}).join('')+'</div>';
  (d.abas||[]).forEach(function(a){h+='<h2 class="sec">'+esc(a.nome)+'</h2><div class="blk '+(a.id||'')+'">'+(a.itens||[]).map(function(it){return '<div class="item"><h4>'+esc(it.titulo)+'</h4><p>'+esc(it.resumo||'')+'</p>'+(it.porque?'<div class="why"><b>Por que importa:</b> '+esc(it.porque)+'</div>':'')+didFontesHTML(it)+'</div>';}).join('')+'</div>';});
  if(d.leitura&&d.leitura.length){h+='<h2 class="sec">📚 Ciência &amp; Leitura</h2>'+d.leitura.map(function(L){return '<div class="leitura"><span class="tag">Leitura do dia · via PubMed</span><h4>'+esc(L.titulo)+'</h4><p>'+esc(L.resumo||'')+'</p>'+(L.porque?'<div class="why"><b>Por que importa:</b> '+esc(L.porque)+'</div>':'')+didFontesHTML(L)+'</div>';}).join('');}
  if(d.monitorar&&d.monitorar.length)h+='<h2 class="sec">🎯 O que monitorar</h2><div class="mon"><ul>'+d.monitorar.map(function(x){return '<li>'+esc(leadTxt(x))+'</li>';}).join('')+'</ul></div>';
  h+='</div>';
  h+='<footer><b>MIR Health</b> — Market Insight Report on Health · '+esc(d.publisher||'IHB Strategies')+' · Edição de '+esc(dl)+' · '+esc(d.local||'São Paulo')+'.'+(d.note?'<br>'+esc(d.note):'')+'</footer>';
  return h;
}
function renderMIR(){
  if(!document.getElementById('mir-css')){var st=document.createElement('style');st.id='mir-css';st.textContent=MIR_CSS;document.head.appendChild(st);}
  if(!mirLoaded){mirLoaded=true;
    api('listMIRs').then(function(l){edDates.mir=l||[];if(!edCur.mir&&edDates.mir[0])edCur.mir=edDates.mir[0].name;renderMIR();}).catch(function(){});
    api('getMIR').then(function(x){if(x){MIR=x;if(!edCur.mir&&edDates.mir[0])edCur.mir=edDates.mir[0].name;renderMIR();}}).catch(function(){});}
  var d=MIR;
  if(!d){el('view').innerHTML='<div class="card" style="text-align:center;color:var(--muted);padding:44px">Carregando MIR Health…<br><small>Se não carregar, confira a conexão.</small></div>';return;}
  var bar='<div class="mir-bar no-print">'+edPickHTML('mir')+'<span style="flex:1"></span><button class="btn btn-sm" onclick="reloadMIR()">↻</button>'+audioBtnsHTML('mir')+'<button class="btn btn-sm" onclick="mirDownloadHTML()">⬇ HTML</button><button class="btn btn-primary" onclick="mirPrint()">🖨️ Exportar PDF</button></div>';
  el('view').innerHTML=bar+'<div class="mir">'+mirBodyHTML(d)+'</div>';
  if(AUDIO.open==='mir')audioWire();
}
function reloadMIR(){toast('Atualizando MIR…');api('getMIR').then(function(x){if(x){MIR=x;renderMIR();toast('MIR atualizado');}else toast('Nada novo');}).catch(function(){toast('Falha ao atualizar');});}
function mirPrint(){window.print();}   /* @media print isola o #view (a casca some) */
function mirDownloadHTML(){if(!MIR)return;var dl=MIR.data||MIR.dataLabel||'';var doc='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR Health — '+esc(dl)+'</title><style>body{margin:0;background:#f3f0e6}'+MIR_CSS+'</style></head><body><div class="mir">'+mirBodyHTML(MIR)+'</div></body></html>';var blob=new Blob([doc],{type:'text/html;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='MIR_Health.html';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1500);toast('HTML baixado');}

/* boot */
buildNav();load();

</script>

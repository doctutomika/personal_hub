<style>
:root{
  --space:#0E1130; --ind0:#161A3F; --ind1:#23286B; --ind2:#3D43A2; --ind-soft:#EEF0FA;
  --gold:#E5A93C; --goldL:#F4D38A; --parch:#F4EFE3;
  --bg:#F4F5FB; --surface:#fff; --ink:#1A1C2E; --muted:#6B7088; --line:#E5E7F2;
  --ok:#1F9D57; --okbg:#E7F6EE; --miss:#C8462F; --missbg:#FBEDE9;
  --saude:#1FA37A; --medtech:#2E5E8C; --crypto:#7A4F9E; --agro:#4E944F; --consult:#475569; --mkt:#3D43A2;
  /* NÃO declarar aqui uma cor por FRENTE/projeto nomeada (--<nome-da-frente>): a lista
     de nomes É a taxonomia viva do dono, e este arquivo vai para o repo PÚBLICO — o
     conjunto de variáveis publica o portfólio dele mesmo sem nenhuma delas ser usada.
     É o FIN_PRESETS em CSS. Os pills do DID pintam por SEGMENTO DE MERCADO (--saude,
     --medtech, --agro, --mkt…), que é categoria genérica e não identifica ninguém. */
  /* sub-frentes da aba Saúde (bordas de seção) */
  --suplementar:#1FA37A; --operadoras:#0E7C7B; --prestadores:#2E8BC0; --pharma:#5B6FB5;
  /* sub-frentes da aba Demais Mercados */
  --bigtech:#5A54C9; --tech:#0E9AA7;
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  --r:12px; --r-sm:8px; --r-lg:16px; --sh:0 1px 3px rgba(20,22,50,.07); --sh-md:0 8px 24px rgba(20,22,50,.12);
  --sidebar:248px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}

/* ===== SHELL ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:#ECEEF7;
  color:#2A2E4A;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;border-right:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.sb-brand svg{width:38px;height:38px;flex:0 0 38px;filter:drop-shadow(0 2px 6px rgba(20,22,50,.2))}
.sb-brand .wm{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--ind0);line-height:1.1}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:10px 10px;flex:1}
.sb-link{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:none;background:transparent;
  color:#565B82;font-size:14px;font-weight:600;text-align:left;width:100%;transition:.15s}
.sb-link .ico{font-size:17px;width:20px;text-align:center}
.sb-link:hover{background:rgba(61,67,162,.08);color:var(--ind0)}
.sb-link.active{background:#fff;color:var(--ind0);box-shadow:inset 3px 0 0 var(--gold),var(--sh)}
.sb-foot{padding:14px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:22px 26px 60px;max-width:1640px;width:100%}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ind0)}
.page-head .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}

/* ===== COMPONENTES ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;transition:.15s}
.btn:hover{border-color:var(--ind2);background:#fbfbfe}
.btn-primary{background:var(--ind2);border-color:var(--ind2);color:#fff}
.btn-primary:hover{background:var(--ind1)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#3a2a06}.btn-gold:hover{background:var(--goldL)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn-ghost:hover{background:#eef0f7}
.icbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px}
.icbtn:hover{border-color:var(--ind2);color:var(--ind2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px 18px}
/* ===== Página que EMPILHA cards: quem espaça é o container, não o card =====
   CAUSA RAIZ da sobreposição na página Saúde (mobile E desktop): `.card` nasce sem
   margin de propósito — dentro de .home-grid/.indcols/.kpis quem dá a distância é o
   `gap` do grid, e por isso esses nunca vazaram. A Saúde empilha `.card` solto em fluxo
   de bloco: distância ZERO, borda encostando na borda e o box-shadow de cada card
   caindo por cima do vizinho — a "sobreposição" que aparecia na tela.
   Consertar caso a caso (o style="margin-top:14px" que alguns cards carregavam) só
   apaga o sintoma nos cards lembrados; o vão volta no próximo card empilhado. O
   container assume a distância de uma vez, para todo filho, em qualquer largura. */
.flowpage{display:flex;flex-direction:column;gap:14px}
.flowpage>*{min-width:0}                  /* filho de flex não encolhe sozinho (mesma armadilha do .indcols) */
.flowpage>.page-head{margin-bottom:0}     /* margens que simulavam o vão virariam vão DOBRADO */
.flowpage>.kpis{margin-bottom:0}
.flowpage>.grp-h{margin:2px 0 -8px}       /* grp-h solto é rótulo do card seguinte: cola nele */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;line-height:1.7}
.chip .dot{width:7px;height:7px;border-radius:50%}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:#EAECF6;border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:8px}
.seg button.active{background:#fff;color:var(--ind0);box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ind2);box-shadow:0 0 0 3px rgba(61,67,162,.13)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ===== InfoTooltip: o número com a régua científica ao lado =====
   O balão é filho do BODY e position:fixed — dentro do modal, o overflow-y:auto do
   .modal-body o cortaria. z-index acima do modal (que usa 900). */
.ibtn{width:15px;height:15px;flex:0 0 15px;margin-left:5px;padding:0;border-radius:50%;
  border:1.2px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;
  font-family:var(--serif);font-size:10px;font-weight:700;font-style:italic;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;text-transform:none}
.ibtn:hover{border-color:var(--ind2);color:var(--ind2)}
.infopop{position:fixed;z-index:1200;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 8px 28px rgba(20,22,50,.22);padding:12px 13px;
  font-size:12px;color:var(--ink);line-height:1.45}
.info-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.info-h b{flex:1;min-width:0;font-size:12.5px;color:var(--ind0)}
.info-x{flex:0 0 auto;background:none;border:0;padding:0;font-size:16px;line-height:1;color:var(--muted);cursor:pointer}
.info-x:hover{color:var(--ink)}
.info-d{margin:0 0 7px}
.info-c{margin:0 0 8px;color:#444}
.info-lb{font-weight:800;color:var(--ind1)}
.info-tip{background:var(--ind-soft);border-radius:var(--r-sm);padding:7px 9px;font-size:11.5px;margin-bottom:8px}
.info-tip b{color:var(--ind1)}
.info-src{border-top:1px dashed var(--line);padding-top:7px;font-size:10.5px;color:var(--muted);line-height:1.4}

/* ===== Sensação: 5 carinhas (a selecionada preenche e marca ✓) ===== */
.faces{display:flex;gap:6px;margin-top:6px}
.face{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.face:hover{border-color:var(--ind2)}
.face-e{font-size:20px;line-height:1;filter:grayscale(.55);opacity:.8}
.face.on .face-e{filter:none;opacity:1}
.face-l{font-size:9px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.face.on .face-l{color:#fff}
.face-ck{position:absolute;top:3px;right:4px;font-size:9px;font-weight:800;color:#fff}
@media (max-width:560px){.face-l{font-size:8px}.face-e{font-size:18px}}

/* ===== RPE 0–10: slider com gradiente (cinza→verde→amarelo→laranja→vermelho) =====
   A trilha mostra a escala INTEIRA sempre (é uma escala ancorada, não um progresso):
   o gradiente é o mapa e o handle diz onde você está nele. touch-action:none = o
   arrasto é do slider, não da rolagem da página. */
.rpe{margin-top:6px}
.rpe-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.rpe-v{font-size:19px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.rpe-d{font-size:13px;font-weight:700}
.rpe-hint{font-size:11px;color:var(--muted)}
.rpe-track{position:relative;height:26px;border-radius:8px;cursor:pointer;touch-action:none;
  border:1px solid #C7CBE0;
  background:linear-gradient(90deg,#94A3B8 0%,#93C5FD 20%,#86EFAC 38%,#22C55E 50%,#FDE047 62%,#EAB308 72%,#FB923C 82%,#F97316 90%,#EF4444 100%)}
.rpe-track.empty{filter:grayscale(.72);opacity:.62}
.rpe-track:focus{outline:2px solid var(--ind2);outline-offset:2px}
.rpe-track:focus:not(:focus-visible){outline:none}
.rpe-track.drag{border-color:var(--ind2)}
.rpe-thumb{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:2.5px solid #fff;box-shadow:0 1px 4px rgba(20,22,50,.4);pointer-events:none}
.rpe-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
/* ---- Wizard de lesão (leva 3): boneco anatômico, passos, EVA ---- */
.injwiz{gap:12px}
.rp-check{display:flex!important;align-items:center;gap:8px;text-transform:none!important;font-size:13px!important;font-weight:600!important;color:var(--ink)!important;letter-spacing:0!important;cursor:pointer}
.rp-check input{width:auto;flex:0 0 auto}
.injstep{display:flex;align-items:center;gap:5px}
.injstep-dot{width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--muted)}
.injstep-dot.on{background:var(--ind2);border-color:var(--ind2);color:#fff}
.injstep-dot.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.injstep-bar{flex:1;height:2px;border-radius:2px;background:var(--line)}
.injstep-lbl{font-size:12px;color:var(--muted)}
.injstep-sub{font-size:12px;color:var(--ink)}
.injmap{display:flex;flex-direction:column;align-items:center;gap:8px}
.injmap svg{width:100%;max-width:168px;height:auto;user-select:none;-webkit-user-select:none}
.injreg{fill:var(--surface);stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:fill .12s,stroke .12s}
.injreg:hover{fill:var(--ind-soft);stroke:var(--ind2)}
.injreg.sel{fill:var(--ind-soft);stroke:var(--ind2);stroke-width:2}
.injmap-leg{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.injopts{display:flex;flex-wrap:wrap;gap:8px}
.injopt{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.injopt:hover{border-color:var(--ind2);color:var(--ind2)}
.injopt.sel{border-color:var(--ind2);background:var(--ind-soft);color:var(--ind1)}
.injopt.block{display:flex;flex-direction:column;gap:2px;width:100%}
.injopt-d{font-size:11px;font-weight:500;color:var(--muted)}
.injopt.sel .injopt-d{color:var(--ind2)}
.injback{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:4px}
.injback:hover{color:var(--ink)}
.eva-big{display:flex;flex-direction:column;align-items:center;margin:2px 0 8px}
.eva-num{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.eva-lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.eva-track{position:relative;height:26px;border-radius:8px;cursor:pointer;touch-action:none;border:1px solid #C7CBE0;
  background:linear-gradient(90deg,#10b981 0%,#84cc16 30%,#eab308 55%,#f97316 80%,#ef4444 100%)}
.eva-track.empty{filter:grayscale(.72);opacity:.62}
.eva-track:focus{outline:2px solid var(--ind2);outline-offset:2px}
.eva-track:focus:not(:focus-visible){outline:none}
.eva-track.drag{border-color:var(--ind2)}
.eva-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px;max-width:140px}
.eva-bar-f{height:100%;border-radius:99px}
.lstat{font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.lstat.ativa{background:var(--missbg);color:var(--miss)}
.lstat.rec{background:var(--okbg);color:var(--ok)}
.sau-acts{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
@media (max-width:640px){.rpe-track{height:32px}.rpe-thumb{width:26px;height:26px;margin:-13px 0 0 -13px}}

/* ===== Sono: drum-roll (rolagem de relógio) =====
   5 itens visíveis; o do meio é o escolhido. DRUM_H no Script.html espelha o height de
   .drum-i — mudou aqui, muda lá, ou o snap para de casar com o que está desenhado. */
.drums{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0 4px}
.drumw.empty .drum-list{opacity:.42}
.drum-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.drum-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.drum{position:relative;width:64px;height:170px;overflow:hidden;border-radius:10px;touch-action:none;
  cursor:ns-resize;background:#DEE1EF;border:1px solid #C7CBE0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%)}
.drum:focus{outline:2px solid var(--ind2);outline-offset:2px}
.drum:focus:not(:focus-visible){outline:none}
.drum.drag{border-color:var(--ind2)}
.drum-sel{position:absolute;left:4px;right:4px;top:68px;height:34px;border-radius:7px;
  background:rgba(255,255,255,.75);border:1px solid var(--ind2);pointer-events:none;z-index:1}
.drum-list{position:absolute;left:0;right:0;top:0;z-index:2;will-change:transform;
  transition:transform .12s ease-out}
.drum-i{height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;user-select:none}
.drum-i.on{font-size:19px;font-weight:800;color:var(--ind0)}
.drum-sep{font-size:20px;font-weight:800;color:var(--ind0);padding-top:14px}
/* ===== Mostrador compacto do drum: recolhido = chip; toca = abre a roda ===== */
.drum-wrap{display:block}
.drum-wrap .drum-open{display:none}
.drum-wrap.open .drum-open{display:block}
.drum-wrap.open .drum-chip{display:none}
.drum-chip{display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  background:#DEE1EF;border:1px solid #C7CBE0;border-radius:10px;padding:8px 14px;
  font-size:16px;font-weight:800;color:var(--ind0);font-variant-numeric:tabular-nums;line-height:1.1}
.drum-chip:hover{border-color:var(--ind2)}
.drum-chip.drum-chip-sm{padding:8px 12px;font-size:15px}
.drum-chip-v.muted{color:var(--muted);font-weight:600}
.drum-chip-ed{font-size:12px;color:var(--muted);font-weight:600}
.drum-done-row{text-align:center;margin-top:2px}
/* ===== Check-in do dia (Home) ===== */
/* ===== Gauges do check-in: arrasta/rola, não digita ===== */
.gaus{display:flex;flex-direction:column;gap:15px;margin-top:6px}
.gau{display:flex;flex-direction:column;gap:5px}
.gau-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gau-l{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.gau-set{display:flex;align-items:center;gap:6px}
.gau-v{min-width:66px;text-align:center;font-size:16px;font-weight:800;color:var(--ind2);font-variant-numeric:tabular-nums}
.gau-na{color:var(--muted);font-weight:700}
.gau-nudge{width:26px;height:26px;flex:0 0 26px;border-radius:7px;border:1.5px solid var(--line);background:#fff;
  font-size:15px;font-weight:800;line-height:1;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.gau-nudge:hover{border-color:var(--ind2);color:var(--ind2)}
/* touch-action:none = no celular o dedo arrasta o gauge em vez de rolar a página. Sem isto o gesto se perde. */
.gau-track{position:relative;height:26px;border-radius:8px;background:#DEE1EF;border:1px solid #C7CBE0;
  cursor:pointer;touch-action:none;overflow:hidden}
.gau-track:focus{outline:2px solid var(--ind2);outline-offset:2px}
.gau-track:focus:not(:focus-visible){outline:none}
.gau-track.drag{border-color:var(--ind2)}
.gau-fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ind2);opacity:.5;border-radius:7px 0 0 7px}
/* banda do SEU normal — hachura + bordas sólidas: precisa se ler POR CIMA do fill e da trilha */
.gau-band{position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(45deg,rgba(35,40,107,.26) 0 5px,rgba(35,40,107,.07) 5px 10px);
  border-left:2px solid var(--ind1);border-right:2px solid var(--ind1)}
.gau-target{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.gau-tick{position:absolute;top:7px;bottom:7px;width:1px;background:rgba(20,22,50,.2)}
.gau-thumb{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;border-radius:4px;background:#fff;
  border:2.5px solid var(--ind2);box-shadow:0 1px 4px rgba(20,22,50,.3)}
.gau-f{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gau-ref{font-size:11px;color:var(--muted);line-height:1.3}
.gau-clear{background:none;border:0;padding:0;font-size:11px;color:var(--muted);text-decoration:underline;flex:0 0 auto}
.gau-clear:hover{color:var(--ind2)}
@media (max-width:560px){
  .gau-track{height:34px}
  .gau-nudge{width:34px;height:34px;flex:0 0 34px;font-size:17px}
  .gau-v{font-size:17px;min-width:72px}
}

/* Card do check-in na Home — slots FIXOS: 1 hero (energia) + grade de 4.
   4 divide certo em 4 e em 2 colunas, então nunca sobra célula órfã torta (era o "assimétrico"). */
.ckhero{display:flex;flex-direction:column;gap:5px;background:var(--ind-soft);border-radius:var(--r-sm);padding:8px 10px;margin-top:2px;cursor:pointer}
.ckhero.empty{background:transparent;border:1px dashed var(--line)}
.ckhrow{display:flex;align-items:center;gap:8px}
.ckbars{display:flex;gap:3px;flex:1;min-width:0}
.ckbar{flex:1;height:8px;border-radius:3px;background:var(--line)}
.ckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media (max-width:640px){.ckgrid{grid-template-columns:repeat(2,1fr)}}
.ckcell{display:flex;flex-direction:column;gap:2px;background:var(--ind-soft);border-radius:var(--r-sm);padding:7px 9px;min-height:62px;cursor:pointer}
.ckcell.empty{background:transparent;border:1px dashed var(--line)}
.ckcell.empty .ckv{color:var(--muted)}
.ckl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ckv{font-size:15px;font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums}
/* régua: o baseline ao lado do número, p/ ele nascer com contexto */
.ckref{font-size:9.5px;color:var(--muted);line-height:1.25;margin-top:1px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ind0);color:#fff;
  padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:var(--sh-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(14,17,48,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:var(--r-lg);width:min(540px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-md);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:linear-gradient(120deg,var(--ind1),var(--ind2));color:#fff}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head .x{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px}
.modal-body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:13px}
.modal-foot{display:flex;gap:9px;justify-content:space-between;align-items:center;padding:13px 18px;border-top:1px solid var(--line);background:#FAFAFE}

/* ===== AGENDA ===== */
.agenda-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wknav{display:inline-flex;align-items:center;gap:4px}
.wknav .lbl{font-weight:700;color:var(--ind0);min-width:150px;text-align:center}
/* Desktop: colunas de largura FIXA + rolagem lateral (não espremer os 7 dias num só ecrã).
   O scroll é INTERNO da weekgrid (overflow-x), nunca do body — mesma disciplina do .sau-cols. */
.weekgrid{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:12px;overflow-x:auto;padding-bottom:4px}
.weekgrid::-webkit-scrollbar{height:8px}.weekgrid::-webkit-scrollbar-thumb{background:#D7DAEA;border-radius:4px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.day.today{border-color:var(--ind2);box-shadow:0 0 0 2px rgba(61,67,162,.25)}
.day-head{padding:9px 11px;background:#FAFAFE;border-bottom:1px solid var(--line)}
.day-head .dow{font-weight:700;font-size:13px;color:var(--ind0)}
.day-head .dt{font-size:11px;color:var(--muted)}
.day-head .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.locsel{display:block;width:100%;margin-top:6px;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
.day-sum{font-size:10.5px;color:var(--muted);margin-top:3px}
.day-sum b{color:var(--ind2)}
.day-n{margin-left:6px;font-weight:700;color:var(--ind2)}
.dh-toggle{cursor:pointer}
.dh-t{display:flex;align-items:center;gap:6px}
.chev{font-size:10px;color:var(--muted);transition:transform .15s;display:inline-block}
.day.collapsed .chev{transform:rotate(-90deg)}
.day.collapsed .day-body{display:none}
.wkbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
/* clima */
.wxbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 14px;padding:9px 13px;background:linear-gradient(90deg,#F4F6FD,#EEF0FA);border:1px solid var(--line);border-radius:12px}
.wxbar-date{font-weight:700;color:var(--ind0)}
.wxbar-loc{font-size:12px;color:var(--muted);margin-left:auto}
.wx{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#4a5070;white-space:nowrap}
.wx .wx-ic{font-size:13px;line-height:1}
.wx small{font-weight:500;color:var(--muted)}
.wx .wx-pop{margin-left:4px;color:#2563EB;font-weight:600}
.wx.wx-lg{font-size:14px;font-weight:700;color:var(--ink)}
.wx.wx-lg .wx-ic{font-size:18px}
.day-head .row .wx{flex:none}
.mcell-h{display:flex;align-items:center;justify-content:space-between}
.mcell-wx{font-size:12px;line-height:1}
.day-body{padding:8px;display:flex;flex-direction:column;gap:7px;height:62vh;overflow-y:auto}
.day-body::-webkit-scrollbar{width:6px}.day-body::-webkit-scrollbar-thumb{background:#D7DAEA;border-radius:3px}
.ev{position:relative;border:1px solid var(--line);border-left:3px solid var(--ind2);border-radius:9px;background:#fff;padding:7px 9px;flex:0 0 auto}
.ev:hover{box-shadow:var(--sh-md);cursor:pointer}
.ev[draggable]{cursor:grab}
.ev[draggable]:active{cursor:grabbing}
.ev.dragging{opacity:.45}
.day.drop-hot{outline:2px dashed var(--ind2);outline-offset:-2px;background:var(--okbg)}
.ev-actions{position:absolute;top:6px;right:7px;display:flex;align-items:center;gap:3px;z-index:2}
.ev-del{width:15px;height:15px;border:none;background:transparent;color:#B9BCD0;font-size:15px;line-height:1;border-radius:4px;cursor:pointer;padding:0}
.ev-del:hover{background:var(--missbg);color:var(--miss)}
.ev .t{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px;margin-bottom:2px}
.ev .ti{font-size:12.5px;font-weight:600;margin:1px 0 4px;line-height:1.3}
.ev .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
.ev .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-man{font-size:10px;font-weight:700;color:var(--gold);background:#FBF1DC;border-radius:99px;padding:1px 7px;line-height:1.7}
/* Marcação ✅/❌ — a COR vem do próprio emoji (✅ verde, ❌ vermelho), não do CSS: emoji de cor cheia
   ignoram `color`, então o estado pendente é grayscale+opacidade (neutro, discreto) e o ativo é o emoji
   cheio dentro de um anel tonalizado. done/miss seguem INDEPENDENTES (quem manda é o setStatus). */
.ev .stbtn{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;padding:0;line-height:1;
  filter:grayscale(1);opacity:.5;transition:opacity .12s,filter .12s,background .12s,border-color .12s}
/* Desktop: botões compactos e esmaecidos; o hover do EVENTO os traz a opacidade cheia (reveal),
   e o hover DIRETO no botão tira o grayscale p/ pré-clique. Inativos ficam neutros; ativos (.on)
   seguem coloridos e visíveis SEM hover. No mobile (≤560, sem hover) já são grandes/visíveis. */
.ev:hover .stbtn{opacity:1}
.ev .stbtn:hover{filter:none;opacity:1}
.ev .stbtn.stdone:hover{border-color:var(--ok);background:var(--okbg)}
.ev .stbtn.stmiss:hover{border-color:var(--miss);background:var(--missbg)}
.ev .stbtn.on{filter:none;opacity:1}
.ev .stbtn.stdone.on{background:var(--okbg);border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ev .stbtn.stmiss.on{background:var(--missbg);border-color:var(--miss);box-shadow:inset 0 0 0 1px var(--miss)}
@media (max-width:560px){
  .ev-actions{gap:6px;top:8px;right:8px}
  .ev .stbtn{width:40px;height:40px;font-size:20px;border-radius:9px}
  .ev-del{width:28px;height:28px;font-size:22px}
  .ev .t{padding-right:120px}
  .ev .ti{padding-right:120px}
}
.ev.done{opacity:.62}.ev.done .ti{text-decoration:line-through}
.ev.miss .ti{text-decoration:line-through;color:var(--miss)}
.empty-day{padding:10px;color:#A6A9C2;font-size:11.5px;font-style:italic;text-align:center}
.note-line{font-size:10.5px;color:#8a6d00;background:#FBF4E0;border-radius:6px;padding:3px 6px;margin-top:4px;overflow-wrap:anywhere;word-break:break-word}
.note-line .note-link{color:#3D43A2;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
.field .hint code{background:#EEF0FA;border-radius:4px;padding:1px 4px;font-size:10.5px}
/* visão Dia */
.dayview{max-width:680px}
.dayview .day-head{border-radius:var(--r) var(--r) 0 0}
.dayview-body{padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r)}
/* visão Mês */
.month-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.month-dows div{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mcell:hover{border-color:var(--ind2)}
.mcell.out{background:#FAFAFE;color:#A6A9C2}
.mcell.today{border-color:var(--ind2);box-shadow:inset 0 0 0 1.5px var(--ind2)}
.mcell-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.mcell-evs{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.mev{font-size:10px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mmore{font-size:10px;color:var(--muted);padding:0 2px}
@media (max-width:860px){.month-grid{gap:3px}.mcell{min-height:62px;padding:3px 4px}.mev{font-size:9px;padding:0 3px}.month-dows div{font-size:9px}.dayview{max-width:none}}

/* ===== INDICADORES ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:4px solid var(--ind2)}
.kpi .n{font-size:26px;font-weight:800;color:var(--ind0)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.kpi.gold{border-left-color:var(--gold)}.kpi.ok{border-left-color:var(--ok)}
.indcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Grid item nasce com min-width:auto = min-content, então um card com gráfico de
   N colunas (flex-shrink:0) empurraria a página inteira e estouraria o body no
   mobile. min-width:0 solta o card p/ encolher; quem rola é o .sau-cols dentro. */
.indcols>*{min-width:0}
/* ===== DONUT (composição) =====
   flex-wrap + min-width:0 = a legenda desce p/ baixo do donut no card estreito, em
   vez de esticar o card e estourar o body (mesma armadilha do .indcols acima). */
.donut{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap;max-width:100%}
.dn-svg{flex:0 0 auto;width:140px;height:140px}
.dn-legend{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:7px}
.dn-row{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.dn-sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
/* nome trunca, valor nunca: o número é o que não pode sumir */
.dn-k{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-v{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dn-lbl{font-size:9px;font-weight:800;fill:#fff}
.dn-ctr{font-family:var(--serif);font-size:16px;font-weight:700;fill:var(--ind0)}
.dn-sub{font-size:8.5px;fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ===== SUBABA SAÚDE ===== */
/* sinal discreto de "fora do seu normal" — sem alarmismo: seta pequena, nunca vermelho */
.sausig{font-size:9px;margin-left:4px;vertical-align:middle}
.sausig.good{color:var(--ok)}
.sausig.warn{color:var(--gold)}
/* ===== Régua: leitura de z-score contra a baseline individual =====
   A trilha É o eixo z (−3σ..+3σ, média no centro) com as zonas do status pintadas.
   O contraste vem das zonas, que são cores cheias sobre o card — o problema antigo era
   uma banda #EEF0FA sobre uma trilha #EDEFF7: dois tons do mesmo cinza, invisível. */
.sau-rules{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.sau-rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sau-rt{font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center}
/* pill do status: o semáforo. Texto branco sobre cor cheia — legível nos 3 estados. */
.sau-pill{flex:0 0 auto;font-size:10px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
/* valor + de quando ele é: a data anda colada no número, nunca implícita */
.sau-rvl{font-size:20px;font-weight:800;color:var(--ind0);font-variant-numeric:tabular-nums;
  margin:3px 0 6px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.sau-when{font-size:11px;font-weight:700;color:var(--muted);background:var(--line);
  padding:1px 7px;border-radius:999px;text-transform:none;letter-spacing:0}
.sau-when.hoje{background:var(--ind-soft);color:var(--ind1)}
.sau-src{font-size:10.5px;font-weight:400;color:var(--muted)}
.sau-ztrack{position:relative;height:14px;border-radius:7px;overflow:hidden;border:1px solid #C7CBE0;background:#DEE1EF}
.sau-zz{position:absolute;top:0;bottom:0;opacity:.5}
.sau-zmean{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:rgba(20,22,50,.5);z-index:1}
.sau-rmark{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;z-index:2;
  background:var(--ind0);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(20,22,50,.45)}
.sau-rtarget{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ind0);z-index:1}
.sau-zax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:4px 0 5px}
.sau-rf{font-size:11.5px;color:var(--muted);line-height:1.4}
/* "ainda não dá p/ falar" é um estado, não um erro: calmo, sem cara de alerta */
.sau-coleta{font-size:11.5px;color:var(--muted);font-style:italic;background:var(--ind-soft);
  border-radius:var(--r-sm);padding:7px 9px;margin-top:2px}
/* fato + significado, sem alarme: âmbar, nunca vermelho piscando */
.sau-cron{font-size:12px;color:var(--ink);line-height:1.45;background:#FDF5E6;
  border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:8px 10px;margin-top:9px}
.sau-cron b{color:var(--ind0)}
/* colunas cronológicas (base deslocada — ver saudeCols) */
/* max-width:100% + overflow-x:auto = a régua rola DENTRO do card, em vez de esticá-lo.
   As colunas mantêm flex-shrink:0 de propósito: espremer 12 meses num card de 500px
   deixaria a coluna ilegível — melhor rolar. Vale p/ qualquer N (12 hoje, 13 em ago). */
.sau-cols{display:flex;align-items:flex-end;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.sau-col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px}
.sau-cv{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sau-ct{width:100%;height:76px;display:flex;align-items:flex-end}
.sau-cf{width:100%;border-radius:4px 4px 0 0;min-height:3px}
.sau-cl{font-size:9.5px;color:var(--muted);white-space:nowrap}
.sau-cl.pico{color:var(--ind0);font-weight:800}

/* ===== SISTEMA ===== */
.sys-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sys-tab{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600;padding:8px 14px;border-radius:99px;font-size:13px}
.sys-tab.active{background:var(--ind2);color:#fff;border-color:var(--ind2)}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:#F4F5FB;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td:last-child{white-space:nowrap;text-align:right}
.tbl tr:hover td{background:#FAFAFE}
.grp-h{font-weight:700;color:var(--ind0);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.1)}
.pill-gov{font-size:10px;padding:1px 7px;border-radius:99px;background:#EEF0FA;color:var(--ind2);font-weight:700}
.sub-block{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
.sub-row{display:flex;align-items:center;gap:8px;padding:9px 12px}
.sub-row b{font-size:13px}
.neto-list{padding:5px 12px 9px 34px;background:#FAFAFE;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.neto-row{display:flex;align-items:center;gap:7px;font-size:12.5px}

/* ===== DID ===== */
.did-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px}
.did-mast{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px 22px;border-top:5px solid var(--ind2);text-align:center;margin-bottom:12px}
.did-mast .big{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.08em;color:var(--ind2);line-height:1}
.did-mast .tl{font-size:11.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.did-mast .meta{font-size:12.5px;margin-top:9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.did-mast .meta b{color:var(--ind2)}
.ticker{display:flex;gap:0;overflow-x:auto;background:var(--ind0);border-radius:var(--r);margin-bottom:12px}
.tk{flex:0 0 auto;padding:9px 14px;border-right:1px solid #2a2f55;color:#fff;font-size:12px;white-space:nowrap}
.tk .s{color:#9aa0c8;font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block}
.tk .v{font-weight:700;font-size:13px}.tk .up{color:#5fd99b}.tk .down{color:#f08a7a}
.lead{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ind2);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px 20px;margin-bottom:12px}
.lead h2{font-family:var(--serif);font-size:19px;margin-bottom:10px;color:var(--ind0)}
.lead ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.lead li{font-size:13.5px;padding-left:16px;position:relative}
.lead li:before{content:"▶";position:absolute;left:0;color:var(--ind2);font-size:8px;top:5px}
.pj{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:var(--muted);border-radius:4px;padding:1px 6px;margin-left:3px}
/* DID ao vivo — seções empilhadas em blocos delimitados (mesmo padrão do export/MIR): h2 título + bloco colorido com os itens. Escopado em .did-secs p/ não colidir com .did-report/.mir. */
.did-secs h2.sec{font-family:var(--serif);font-size:16px;color:var(--ink);display:flex;gap:7px;align-items:center;margin:22px 0 10px;padding-bottom:6px;border-top:0;border-bottom:2px solid var(--ind2)}
.did-secs h2.sec:first-child{margin-top:4px}
.did-secs .blk{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--muted);border-radius:var(--r-lg);box-shadow:var(--sh);padding:4px 18px 14px;margin-bottom:14px}
.did-secs .blk .feeds{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
.did-secs .blk.saude{border-top-color:var(--saude)}.did-secs .blk.medtech{border-top-color:var(--medtech)}.did-secs .blk.crypto{border-top-color:var(--crypto)}.did-secs .blk.agro{border-top-color:var(--agro)}.did-secs .blk.consult{border-top-color:var(--consult)}.did-secs .blk.mkt{border-top-color:var(--mkt)}
.did-secs .blk.suplementar{border-top-color:var(--suplementar)}.did-secs .blk.operadoras{border-top-color:var(--operadoras)}.did-secs .blk.prestadores{border-top-color:var(--prestadores)}.did-secs .blk.pharma{border-top-color:var(--pharma)}
.did-secs .blk.bigtech{border-top-color:var(--bigtech)}.did-secs .blk.tech{border-top-color:var(--tech)}
/* mini-sleeve de tickers dentro do box do setor */
.ticker.tk-mini{margin:2px 0 10px;border-radius:9px}
.ticker.tk-mini .tk{padding:5px 10px}
.ticker.tk-mini .tk .s{font-size:9px}
.ticker.tk-mini .tk .v{font-size:11.5px}
/* DID v3: abas + sleeve de saúde + Leitura do dia */
.did-tabs{display:inline-flex;gap:4px;background:var(--ind-soft);padding:4px;border-radius:11px;margin-bottom:13px}
.did-tabs button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:7px 17px;border-radius:8px;cursor:pointer}
.did-tabs button.active{background:#fff;color:var(--ind2);box-shadow:var(--sh)}
.ticker.tk-saude{margin-top:-6px}
.ticker.tk-saude .tk-lab{background:#1a1f4a;color:#aab0e0;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center}
.leitura{background:#fff;border:1px solid var(--line);border-left:5px solid var(--medtech);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px 18px;margin-bottom:12px}
.leitura-tag{font-size:11px;font-weight:700;color:var(--medtech);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.leitura-tag span{color:var(--muted);text-transform:none;letter-spacing:0}
.leitura h4{font-size:15px;font-weight:700;margin-bottom:4px}.leitura p{font-size:13px;color:#333;margin:0 0 6px}
.item{border-top:1px solid var(--line);padding:9px 0}.item:first-of-type{border-top:none}
.item h4{font-size:14px;font-weight:700;margin-bottom:3px}.item p{font-size:13px;color:#333;margin:0 0 5px}
.why{font-size:12.5px;background:var(--ind-soft);border-left:3px solid var(--ind2);border-radius:6px;padding:6px 9px}.why b{color:var(--ind2)}
.src{font-size:11px;margin-top:5px}.src a{color:var(--muted);border-bottom:1px dotted var(--muted);text-decoration:none}
.did-note{background:#FBF4E0;border:1px solid #F0DBA8;border-radius:var(--r);padding:10px 14px;font-size:12px;color:#7a5300;margin-top:14px}

/* ===== RESPONSIVO ===== */
/* (≤1320 antes forçava 4 colunas fluidas; agora a weekgrid é coluna FIXA + rolagem lateral
   na regra default, então não precisa reflow por largura — só o stack ≤860 abaixo.) */
@media (max-width:960px){ .indcols{grid-template-columns:1fr} }
@media (max-width:560px){ .grid2{grid-template-columns:1fr} .ed-cal{max-width:calc(100vw - 24px)} .mir-bar{justify-content:flex-start} }
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh-md)}
  body.nav-open .sidebar{transform:translateX(0)}
  .nav-ov{position:fixed;inset:0;background:rgba(14,17,48,.45);z-index:35;display:none}
  body.nav-open .nav-ov{display:block}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .topbar .ham{font-size:20px;background:none;border:none;color:var(--ind0)}
  .topbar .tt{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ind0)}
  .content{padding:16px 14px calc(env(safe-area-inset-bottom) + 50px)}
  .weekgrid{grid-auto-flow:row;grid-template-columns:1fr;grid-auto-columns:auto;overflow-x:visible;gap:10px}
  .day-body{height:auto;max-height:none;overflow:visible}
}

/* ===== Seletor de edições por CALENDÁRIO (DID + MIR) ===== */
.ed-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ed-pick{position:relative}
.ed-cal{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-md);padding:12px;width:270px}
.ed-cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ed-cal-hd b{font-size:13px;color:var(--ind0)}
.ed-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.ed-dows span{text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.ed-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ed-day{border:0;background:transparent;font:inherit;font-size:12px;height:32px;border-radius:8px;color:var(--muted);cursor:default}
.ed-day.out{opacity:.32}
.ed-day.has{background:var(--ind-soft);color:var(--ind2);font-weight:700;cursor:pointer}
.ed-day.has:hover{background:var(--ind2);color:#fff}
.ed-day.cur{background:var(--ind2);color:#fff}
.ed-day.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ed-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 2px}

/* ===== HOME (Início) ===== */
.home-hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,var(--ind1),var(--ind2));color:#fff;border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh-md)}
.home-hero .hh-sau{font-family:var(--serif);font-size:24px;font-weight:700}
.home-hero .hh-date{font-size:13px;opacity:.88;margin-top:2px}
.home-hero .hh-date::first-letter{text-transform:uppercase}
.home-hero .hh-wx{text-align:right}
.home-hero .wx,.home-hero .wx.wx-lg{color:#fff}
.home-hero .wx small{color:#cfd3ee}
.hh-loc{font-size:11px;opacity:.72;margin-top:2px}
/* ↻ de escopo PÁGINA no hero (rebusca feed+DID+MIR+eventos+clima). Vive no fundo escuro do hero,
   por isso não usa .icbtn (branco): vidro translúcido. Gira enquanto a rodada não termina. */
.home-hero .hh-rf{margin-left:9px;vertical-align:2px;width:27px;height:27px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.13);color:#fff;font-family:inherit;font-size:14px;line-height:1;cursor:pointer}
.home-hero .hh-rf:hover{background:rgba(255,255,255,.24)}
.home-hero .hh-rf:disabled{opacity:.6;cursor:default}
.home-hero .hh-rf.busy{animation:hhspin .9s linear infinite}
@keyframes hhspin{to{transform:rotate(360deg)}}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
.hcard h3{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.hcard h4{font-size:14.5px;font-weight:700;margin:0 0 5px}
.hcard p{font-size:13px;color:#333;margin:0 0 7px}
.hstale{font-size:10px;color:var(--muted);font-weight:400;margin-left:auto}
.hev-destaque{background:var(--ind-soft);border-left:4px solid var(--ind2);border-radius:8px;padding:9px 12px;cursor:pointer;margin-bottom:8px}
.hev-destaque .t{font-size:11px;font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums}
.hev-destaque .ti{font-weight:700;font-size:14.5px;margin:1px 0 5px}
.hev-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.hev{font-size:12.5px;color:#444}
.hev .t{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums}
.hh-per{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:2px 10px;margin-left:10px;vertical-align:middle;letter-spacing:.02em}
.home-status{background:var(--ind0);color:#EDEFFA;border-left:4px solid var(--gold);border-radius:var(--r);padding:10px 16px;font-size:13px;margin-bottom:14px;line-height:1.5}
.home-status b{color:#fff}
.home-amanha{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ind2);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.home-amanha .ha-h{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink)}
.home-amanha .ha-wx{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ind2)}
.home-amanha .ha-sub{font-size:12px;color:var(--muted);margin:2px 0 7px}
.home-amanha .ha-list{display:flex;flex-direction:column;gap:3px}
.home-amanha .ha-ev{font-size:13px;color:#333}
.home-amanha .ha-ev .t{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums;margin-right:4px}
.home-amanha .ha-tag{font-size:9px;font-weight:800;background:#EEF0FA;color:var(--ind2);border-radius:4px;padding:1px 5px;text-transform:uppercase}
.hstatus{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.hs{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.hs.done{background:#E4F5EC;color:#1F9D57}
.hs.pend{background:#EEF0FA;color:#5a5f86}
.hs.miss{background:#FBE9E7;color:#C8462F}
.hfin-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:9px 0 1px}
.hfin-sec:first-of-type{margin-top:2px}
.hbook-list{display:flex;flex-direction:column;gap:8px}
.hbook-t{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink)}
.hbook-m{font-size:12px;color:var(--muted);margin-top:1px}
.hbook-m b{color:var(--ind2)}
/* composição do tempo lido (sessões + ajuste manual): auditoria, não manchete — some no total */
.hbook-comp{font-size:11px;opacity:.8}
.hfin-list{display:flex;flex-direction:column;gap:1px}
.hfin{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.hfin:first-child{border-top:0}
.hfin-d{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums;min-width:44px}
.hfin-t{flex:1;color:#2a2c3e}
.hfin-tag{font-size:9px;font-weight:800;background:var(--ind-soft);color:var(--ind2);border-radius:4px;padding:1px 4px;vertical-align:middle}
.hfin-r{font-size:11px;color:var(--muted);white-space:nowrap}
.hfin.due .hfin-t{color:var(--ind0);font-weight:600}
.hfin.due .hfin-r{background:var(--gold);color:#3a2c00;font-weight:800;border-radius:20px;padding:1px 8px}
.hfoot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.hfoot b{color:var(--ind2)}
.hempty{font-size:13px;color:var(--muted);font-style:italic;padding:8px 0}
.hsp{padding:7px 0;border-top:1px dashed var(--line)}

.hline.muted2{color:var(--muted)}
.hlbl{display:inline-block;background:var(--ind-soft);color:var(--ind2);font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;margin-right:5px}
.seldon-banner{background:var(--ind0);color:#EDEFFA;border-left:5px solid var(--gold);border-radius:var(--r-lg);padding:16px 20px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.6;margin-bottom:12px;box-shadow:var(--sh)}
.seldon-banner .sb-a{font-style:normal;font-size:12px;color:var(--goldL);margin-top:6px;font-family:var(--sans);letter-spacing:.04em}
.bq{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-size:13.5px;font-style:italic;color:#333;box-shadow:var(--sh)}

/* ===== O Cruzamento (Saúde × Mercado) — peça-assinatura de domingo ===== */
.cruzamento{background:linear-gradient(135deg,var(--ind0),#1a4d4d);color:#EDEFFA;border:0;border-left:4px solid var(--gold);margin-bottom:16px}
.cruzamento .cz-h{font-family:var(--serif);font-weight:700;font-size:19px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#fff}
.cz-sub{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--goldL)}
.cruzamento .cz-item{padding:11px 0;border-top:1px solid rgba(255,255,255,.13)}
.cruzamento .cz-item:first-of-type{border-top:0}
.cruzamento .cz-item h4{color:#fff;font-size:15.5px;margin-bottom:4px}
.cruzamento .cz-item p{color:#d8dbf0;font-size:13.5px;margin-bottom:6px;line-height:1.55}
.cruzamento .cz-why{background:rgba(229,169,60,.15);border-left:3px solid var(--gold);border-radius:4px;padding:6px 11px;font-size:13px;color:#EDEFFA;margin-bottom:5px}
.cruzamento .cz-why b{color:var(--goldL)}
.cruzamento .src{color:#aab0e0}.cruzamento .src a{color:var(--goldL)}
.cruz-home{background:linear-gradient(135deg,var(--ind0),#1a4d4d);color:#EDEFFA;border-left:4px solid var(--gold)}
.cruz-home h3,.cruz-home h4{color:#fff}
.cruz-home p{color:#d8dbf0}
.cruz-home .hfoot{border-top-color:rgba(255,255,255,.15);color:#cfd3ee}

@media (max-width:960px){.home-grid{grid-template-columns:1fr}}

/* ===== Áudio pré-gerado (🎧 MP3 da edição) — DID e MIR ===== */
.aud-slot{display:inline-flex;align-items:center;max-width:100%}
.aud-btn{border-color:var(--gold);background:#FBF1DC;color:var(--ind0);font-weight:700}
.aud-btn:hover{background:var(--goldL)}
.aud-btn:disabled{opacity:.6;cursor:default}
.aud-bar{display:inline-flex;align-items:center;gap:6px;background:var(--ind-soft);border:1px solid var(--gold);border-radius:10px;padding:4px 6px;flex-wrap:wrap;max-width:100%}
.aud-bar audio{height:30px;max-width:min(320px,58vw)}
.aud-bar .btn{white-space:nowrap}
.aud-dl{text-decoration:none;color:var(--ink)}
@media (max-width:560px){ .aud-bar audio{max-width:100%} }

/* ===== MIR: barra de ações + card-ponte de saúde no DID ===== */
.mir-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.did-teaser{border-left:5px solid #1a4d4d;margin-top:14px}
.did-teaser h3{font-family:var(--serif);font-size:16px;color:#1a4d4d;display:flex;gap:7px;align-items:center;margin-bottom:4px}
.did-teaser .btn{margin-top:10px;background:#1a4d4d}
.did-teaser .btn:hover{background:#123838}

/* ===== PÁGINA SAÚDE (registro + régua/prontidão + treinos + lesões + jogos + leitura) =====
 * Régua/prontidão (saudePaginaHTML) reusam o CSS .sau-rule/.sau-ready já definido acima;
 * peso/volume/modalidade vivem em Indicadores › Saúde (saudeIndicadoresHTML). Nada aqui os redefine. */

/* Registro de peso: em 500px a linha vira coluna (o botão nunca sai da tela). */
.sau-reg-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:8px;--reg-lbl:15px}
.sau-reg-row .field{flex:1 1 130px;min-width:0;margin:0}
/* ALINHAMENTO DOS RÓTULOS = GEOMETRIA, NÃO ALTURA IGUAL DE CONTROLE.
   Tentativa anterior (align-items:flex-end + "todo controle tem 40px") era FRÁGIL: alinhava
   pelo RODAPÉ e só funcionava enquanto todos os controles medissem o mesmo. O input[type=date]
   no iOS tem sizing INTRÍNSECO próprio (shadow DOM + min-height derivada do font-size) e ignora
   um `height` que não venha com appearance:none — no iPhone ele desenha mais alto que os chips
   do drum, o excesso todo sobe e SÓ o rótulo DIA sobe junto: a escada do print. (No desktop
   ≥485px, onde o QA mediu, o date honra o height e o delta dá 0.00px — por isso passou.)
   Agora o rótulo é a ÂNCORA: os campos começam no topo da linha (align-items:flex-start) e o
   rótulo tem altura de linha FIXA (--reg-lbl). Rótulos alinham por construção, qualquer que
   seja a altura do controle abaixo — iOS, Android ou um date que o navegador resolva mudar.
   nowrap no rótulo porque rótulo em 2 linhas desalinharia de novo. */
.sau-reg-row .field>label{white-space:nowrap;line-height:var(--reg-lbl);min-height:var(--reg-lbl)}
/* Botão não tem rótulo: desce o mesmo tanto que os controles (altura do rótulo + o gap:5px
   do .field) para nascer na mesma linha-base deles. Deriva das duas medidas acima, não é
   número mágico. Quando ele sobra sozinho na 2ª linha (celular), isso vira respiro antes
   da ação primária — aceitável. */
.sau-reg-row .btn{flex:0 0 auto;height:40px;align-self:flex-start;margin-top:calc(var(--reg-lbl) + 5px)}
/* Cinto e suspensório — o alinhamento acima NÃO depende disto. Normaliza a caixa e domestica
   o date do iOS; font-size:16px é o piso que impede o Safari de dar zoom ao focar o campo. */
.sau-reg-row .field>input,.sau-reg-row .drum-chip{height:40px;box-sizing:border-box}
.sau-reg-row .field>input[type=date]{-webkit-appearance:none;appearance:none;min-height:0;font-size:16px}
.sau-reg-row .field>input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
/* Registro de peso numa linha só: peso e hora = chips compactos, dia estreito, botão ao lado */
.sau-reg-one .sp-val-field{flex:0 0 auto;min-width:0}
.sau-reg-one .sp-date-field{flex:0 1 148px}
.sau-reg-one .sp-hora-field{flex:0 0 auto;min-width:0}
.sau-reg-now{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.sau-reg-now b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ind0)}

/* Leitura da rodada (conteúdo escrito fora do app) */
.sau-ins{border-left:5px solid var(--saude)}
.sau-ins-off{border-left:5px solid var(--line)}
.sau-ins-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sau-ins-h h3{font-family:var(--serif);font-size:16px;color:var(--ind0)}
.sau-ins-d{font-size:11.5px;color:var(--muted);margin-left:auto}
.sau-ins-lead{font-size:13.5px;color:var(--ink);margin-bottom:10px}
.sau-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.sau-chip{flex:1 1 150px;min-width:0;background:var(--ind-soft);border-radius:var(--r-sm);padding:8px 10px;border-left:3px solid var(--ind2)}
.sau-chip.good{background:var(--okbg);border-left-color:var(--ok)}
.sau-chip.warn{background:#FDF5E6;border-left-color:var(--gold)}
.sau-chip-t{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sau-chip-d{display:block;font-size:12.5px;color:var(--ink);margin-top:2px}
.sau-ins-b{margin-top:12px}
.sau-ins-i{padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.sau-ins-i b{color:var(--ind0)}
.sau-ins-p{font-size:12px;color:var(--muted);margin-top:2px}
.sau-ul{margin:6px 0 0 18px;font-size:13px}
.sau-ul li{margin:3px 0}
.sau-ins-note{font-size:11px;color:var(--muted);margin-top:10px;font-style:italic}

/* Prontidão: risco do dia + carga (ACWR) + insight — piso calculado no cliente */
.sau-ready-grid{display:flex;gap:16px;margin-top:8px}
.sau-ready-box{flex:1 1 0;min-width:0}
.sau-score{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 8px}
.sau-score-x{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px}
.sau-score-na{color:var(--muted)}
.sau-fatores{display:flex;flex-direction:column;gap:4px}
.sau-fat{font-size:11.5px;color:var(--ink);background:var(--ind-soft);border-radius:6px;padding:3px 8px}
.sau-fat b{color:var(--ind1)}
.sau-insight{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--ind-soft);border-left:4px solid var(--ind2)}
.sau-insight.sev-warning{background:#FDF5E6;border-left-color:var(--gold)}
.sau-insight.sev-critical{background:var(--missbg);border-left-color:var(--miss)}
.sau-insight.sev-ok{background:var(--okbg);border-left-color:var(--ok)}
.sau-insight-i{font-size:16px;line-height:1.35;flex:0 0 auto}
.sau-insight-m{font-size:13px;color:var(--ink);line-height:1.45}
.sau-insight-src{display:block;font-size:10.5px;color:var(--muted);margin-top:5px}
/* Linha de insight no card de check-in da Home */
.ck-insight{font-size:12.5px;color:var(--ink);line-height:1.4;margin-top:10px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--ind-soft);border-left:3px solid var(--ind2)}
.ck-insight.sev-warning{background:#FDF5E6;border-left-color:var(--gold)}
.ck-insight.sev-critical{background:var(--missbg);border-left-color:var(--miss)}
.ck-insight.sev-ok{background:var(--okbg);border-left-color:var(--ok)}

/* Listas de treinos e jogos: mesma linha para os dois (é o mesmo objeto — um registro
   com data, título, medidas e nota). min-width:0 nos filhos = texto longo quebra em vez
   de empurrar a linha e criar rolagem horizontal. */
.sau-list{display:flex;flex-direction:column;margin-top:4px}
.sau-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.sau-row:first-child{border-top:0}
.sau-row.pend{opacity:.62}
.sau-row-d{flex:0 0 58px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.sau-row-m{flex:1;min-width:0}
.sau-row-t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.sau-row-met{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.sau-row-n{font-size:12.5px;color:var(--ink);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;
  border-left:2px solid var(--line);padding-left:8px}
.sau-row .icbtn{flex:0 0 auto}
.sau-tag{font-size:10px;font-weight:700;background:var(--ind-soft);color:var(--ind1);padding:1px 6px;border-radius:999px;white-space:nowrap}
.sau-tag.off{background:var(--line);color:var(--muted)}
.sau-met{font-variant-numeric:tabular-nums}
.sau-res{flex:0 0 auto;font-size:10px;font-weight:800;width:17px;height:17px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:#fff}
.sau-res.v{background:var(--ok)}
.sau-res.d{background:var(--miss)}
.sau-plac{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* Lesões: barra de filtro (status + mês/ano) e paginação. Mesmo padrão funcional dos
   Treinos (filtrar → paginar → repintar só o miolo do card), com classes próprias para
   que mexer aqui não possa regredir o bloco de treinos. */
.sau-lsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sau-lssel{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;
  color:var(--ink);font-size:13px;font-weight:600;font-family:inherit}
.sau-lssel:focus{outline:none;border-color:var(--ind2);box-shadow:0 0 0 3px rgba(61,67,162,.13)}
.sau-lspg{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.sau-lspg-n{margin-left:auto}
.sau-lspg .icbtn:disabled{opacity:.38;cursor:default;border-color:var(--line);color:var(--muted)}

/* Treinos em CARDS: grade que embrulha (nunca rola na horizontal — minmax + auto-fill).
   O card inteiro é o botão (abre o openRpe); min-width:0 deixa texto longo quebrar. */
.sau-tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:4px}
.sau-tcard{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;transition:border-color .12s,box-shadow .12s}
.sau-tcard:hover{border-color:var(--ind2);box-shadow:var(--sh)}
.sau-tcard:focus-visible{outline:2px solid var(--ind2);outline-offset:2px}
.sau-tcard-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sau-tcard-dur{font-weight:700;color:var(--ink)}
.sau-tcard-t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.sau-tcard-met{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sau-tcard-met.empty{font-style:italic;opacity:.85}
.sau-tcard-n{font-size:12px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:7px}
.sau-tcard-inj{font-size:11px;font-weight:600;color:var(--miss);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
@media (max-width:560px){
  .sau-reg-row .btn{width:100%}
  /* Largura no celular: NÃO se força quebra. O alvo é o aparelho do dono (~430px CSS),
     onde a largura útil (430 − 28 do .content − 36 do .card ≈ 366px) comporta os três
     campos numa linha só — peso (chip ~98) + dia (132) + hora (chip ~85) + 2 gaps = ~335 —
     e sobra só o botão para a 2ª linha, que é onde ele fica bem. Abaixo disso a linha
     degrada sozinha, sempre em quebra LIMPA porque cada campo tem piso de largura:
     ~402px ainda cabem os três; ~390/375px a hora desce e forma "hora + Registrar";
     320px (SE) sobram peso + dia em cima e hora + Registrar embaixo. min-width no dia
     impede que o input de data seja espremido até cortar o texto (o .field tem
     min-width:0, que sozinho deixa encolher abaixo do legível). */
  .sau-reg-one{gap:10px}
  .sau-reg-one .sp-date-field{flex:1 1 132px;min-width:132px}
  .sau-reg-one>.btn{flex:1 1 110px;width:auto}
  .sau-row-d{flex-basis:46px}
  .sau-ins-d{margin-left:0}
  .sau-ready-grid{flex-direction:column;gap:14px}
}

/* ===== IMPRESSÃO (Exportar PDF do MIR): isola o #view, esconde a casca ===== */
@media print{
  .sidebar,.nav-ov,.topbar,#hubSync,.toast,.overlay,.no-print,.mir-bar,.did-bar,.ed-bar{display:none!important}
  .app{display:block}
  .main{margin:0!important}
  .content{padding:0!important;max-width:none}
  html,body,.app,.main,.content{background:#fff!important}
  .mir{border:0!important;border-radius:0!important}
}

/* tempo */
function toMin(hhmm){var m=/^(\d{1,2}):(\d{2})/.exec(hhmm||'');return m?(+m[1])*60+(+m[2]):0;}
function durH(e){var a=toMin(e.start),b=toMin(e.end);if(b<=a)b+=1440;return (b-a)/60;}
/** Relógio H:MM (5:30) — notação ÚNICA de tempo em TODA a plataforma: sono/check-in,
 *  agenda, indicadores, treinos e livros. Vale inclusive para agregado grande (142:30).
 *  O STORAGE segue decimal (contrato do backend); o decimal só não aparece mais em tela. */
function fmtClock(min){if(min==null)return '—';var t=Math.round(min),hh=Math.floor(t/60),mm=t%60;return hh+':'+(mm<10?'0':'')+mm;}
/** Horas decimais → relógio (1.5→'1:30', 0.25→'0:15', 7.92→'7:55', 142.5→'142:30').
 *  NUNCA concatenar 'h' no resultado — o ':' já diz que é tempo (senão sai '7:55h').
 *  Substituiu o antigo fmtH (que devolvia '7,92' p/ virar '7,92h'). */
function fmtHm(h){return fmtClock((h==null||isNaN(h))?null:h*60);}
/** Número → string pt-BR com n casas (12.5 → '12,5').
 *  FRONTEIRA: fmtN é para grandeza NÃO-temporal (peso, IMC, HRV, ms, kg) — segue com
 *  vírgula decimal. Qualquer duração vai de fmtHm/fmtClock. */
function fmtN(v,n){if(v==null||isNaN(v))return '—';var f=Math.pow(10,(n==null?1:n));return (Math.round(v*f)/f).toFixed(n==null?1:n).replace('.',',');}
function pad(n){return ('0'+n).slice(-2);}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayOf(d){var x=new Date(d);var dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}

function render(){
  refreshToday(); el('todayStr').textContent=pad(TODAY.getDate())+'/'+pad(TODAY.getMonth()+1);

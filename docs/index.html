<style>
:root{
  --space:#0E1130; --ind0:#161A3F; --ind1:#23286B; --ind2:#3D43A2; --ind-soft:#EEF0FA;
  --gold:#E5A93C; --goldL:#F4D38A; --parch:#F4EFE3;
  --bg:#F4F5FB; --surface:#fff; --ink:#1A1C2E; --muted:#6B7088; --line:#E5E7F2;
  --ok:#1F9D57; --okbg:#E7F6EE; --miss:#C8462F; --missbg:#FBEDE9;
  --saude:#1FA37A; --medtech:#2E5E8C; --crypto:#7A4F9E; --agro:#4E944F; --consult:#475569; --mkt:#3D43A2;
  /* chips de frente (projetos) — usados nos pills do DID v3 */
  --hefesto:#2E5E8C; --iamed:#3E8E9C; --qbem:#1FA37A; --ihb:#3D5A80; --deagro:#4E944F;
  /* sub-frentes da aba Saúde (bordas de seção) */
  --suplementar:#1FA37A; --operadoras:#0E7C7B; --prestadores:#2E8BC0; --pharma:#5B6FB5;
  /* sub-frentes da aba Demais Mercados */
  --bigtech:#5A54C9; --tech:#0E9AA7;
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  --r:12px; --r-sm:8px; --r-lg:16px; --sh:0 1px 3px rgba(20,22,50,.07); --sh-md:0 8px 24px rgba(20,22,50,.12);
  --sidebar:248px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}

/* ===== SHELL ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:#ECEEF7;
  color:#2A2E4A;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;border-right:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.sb-brand svg{width:38px;height:38px;flex:0 0 38px;filter:drop-shadow(0 2px 6px rgba(20,22,50,.2))}
.sb-brand .wm{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--ind0);line-height:1.1}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:10px 10px;flex:1}
.sb-link{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:none;background:transparent;
  color:#565B82;font-size:14px;font-weight:600;text-align:left;width:100%;transition:.15s}
.sb-link .ico{font-size:17px;width:20px;text-align:center}
.sb-link:hover{background:rgba(61,67,162,.08);color:var(--ind0)}
.sb-link.active{background:#fff;color:var(--ind0);box-shadow:inset 3px 0 0 var(--gold),var(--sh)}
.sb-foot{padding:14px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:22px 26px 60px;max-width:1640px;width:100%}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ind0)}
.page-head .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}

/* ===== COMPONENTES ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:10px;transition:.15s}
.btn:hover{border-color:var(--ind2);background:#fbfbfe}
.btn-primary{background:var(--ind2);border-color:var(--ind2);color:#fff}
.btn-primary:hover{background:var(--ind1)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#3a2a06}.btn-gold:hover{background:var(--goldL)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn-ghost:hover{background:#eef0f7}
.icbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px}
.icbtn:hover{border-color:var(--ind2);color:var(--ind2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;line-height:1.7}
.chip .dot{width:7px;height:7px;border-radius:50%}
.muted{color:var(--muted)}
.seg{display:inline-flex;background:#EAECF6;border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:8px}
.seg button.active{background:#fff;color:var(--ind0);box-shadow:var(--sh)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ind2);box-shadow:0 0 0 3px rgba(61,67,162,.13)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ind0);color:#fff;
  padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:200;box-shadow:var(--sh-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(14,17,48,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:var(--r-lg);width:min(540px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-md);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:linear-gradient(120deg,var(--ind1),var(--ind2));color:#fff}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head .x{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px}
.modal-body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:13px}
.modal-foot{display:flex;gap:9px;justify-content:space-between;align-items:center;padding:13px 18px;border-top:1px solid var(--line);background:#FAFAFE}

/* ===== AGENDA ===== */
.agenda-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wknav{display:inline-flex;align-items:center;gap:4px}
.wknav .lbl{font-weight:700;color:var(--ind0);min-width:150px;text-align:center}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.day.today{border-color:var(--ind2);box-shadow:0 0 0 2px rgba(61,67,162,.25)}
.day-head{padding:9px 11px;background:#FAFAFE;border-bottom:1px solid var(--line)}
.day-head .dow{font-weight:700;font-size:13px;color:var(--ind0)}
.day-head .dt{font-size:11px;color:var(--muted)}
.day-head .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.locsel{display:block;width:100%;margin-top:6px;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
.day-sum{font-size:10.5px;color:var(--muted);margin-top:3px}
.day-sum b{color:var(--ind2)}
.day-n{margin-left:6px;font-weight:700;color:var(--ind2)}
.dh-toggle{cursor:pointer}
.dh-t{display:flex;align-items:center;gap:6px}
.chev{font-size:10px;color:var(--muted);transition:transform .15s;display:inline-block}
.day.collapsed .chev{transform:rotate(-90deg)}
.day.collapsed .day-body{display:none}
.wkbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
/* clima */
.wxbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 14px;padding:9px 13px;background:linear-gradient(90deg,#F4F6FD,#EEF0FA);border:1px solid var(--line);border-radius:12px}
.wxbar-date{font-weight:700;color:var(--ind0)}
.wxbar-loc{font-size:12px;color:var(--muted);margin-left:auto}
.wx{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#4a5070;white-space:nowrap}
.wx .wx-ic{font-size:13px;line-height:1}
.wx small{font-weight:500;color:var(--muted)}
.wx .wx-pop{margin-left:4px;color:#2563EB;font-weight:600}
.wx.wx-lg{font-size:14px;font-weight:700;color:var(--ink)}
.wx.wx-lg .wx-ic{font-size:18px}
.day-head .row .wx{flex:none}
.mcell-h{display:flex;align-items:center;justify-content:space-between}
.mcell-wx{font-size:12px;line-height:1}
.day-body{padding:8px;display:flex;flex-direction:column;gap:7px;height:62vh;overflow-y:auto}
.day-body::-webkit-scrollbar{width:6px}.day-body::-webkit-scrollbar-thumb{background:#D7DAEA;border-radius:3px}
.ev{position:relative;border:1px solid var(--line);border-left:3px solid var(--ind2);border-radius:9px;background:#fff;padding:7px 9px;flex:0 0 auto}
.ev:hover{box-shadow:var(--sh-md);cursor:pointer}
.ev-actions{position:absolute;top:6px;right:7px;display:flex;align-items:center;gap:3px;z-index:2}
.ev-del{width:15px;height:15px;border:none;background:transparent;color:#B9BCD0;font-size:15px;line-height:1;border-radius:4px;cursor:pointer;padding:0}
.ev-del:hover{background:var(--missbg);color:var(--miss)}
.ev .t{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:36px;margin-bottom:2px}
.ev .ti{font-size:12.5px;font-weight:600;margin:1px 0 4px;line-height:1.3}
.ev .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
.ev .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-man{font-size:10px;font-weight:700;color:var(--gold);background:#FBF1DC;border-radius:99px;padding:1px 7px;line-height:1.7}
.ev .st{flex:0 0 auto;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);cursor:pointer}
.ev .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.ev .st.miss{background:var(--miss);border-color:var(--miss);color:#fff}
.ev.done{opacity:.62}.ev.done .ti{text-decoration:line-through}
.ev.miss .ti{text-decoration:line-through;color:var(--miss)}
.empty-day{padding:10px;color:#A6A9C2;font-size:11.5px;font-style:italic;text-align:center}
.note-line{font-size:10.5px;color:#8a6d00;background:#FBF4E0;border-radius:6px;padding:3px 6px;margin-top:4px;overflow-wrap:anywhere;word-break:break-word}
.note-line .note-link{color:#3D43A2;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
.field .hint code{background:#EEF0FA;border-radius:4px;padding:1px 4px;font-size:10.5px}
/* visão Dia */
.dayview{max-width:680px}
.dayview .day-head{border-radius:var(--r) var(--r) 0 0}
.dayview-body{padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r)}
/* visão Mês */
.month-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.month-dows div{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mcell:hover{border-color:var(--ind2)}
.mcell.out{background:#FAFAFE;color:#A6A9C2}
.mcell.today{border-color:var(--ind2);box-shadow:inset 0 0 0 1.5px var(--ind2)}
.mcell-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.mcell-evs{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.mev{font-size:10px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mmore{font-size:10px;color:var(--muted);padding:0 2px}
@media (max-width:860px){.month-grid{gap:3px}.mcell{min-height:62px;padding:3px 4px}.mev{font-size:9px;padding:0 3px}.month-dows div{font-size:9px}.dayview{max-width:none}}

/* ===== INDICADORES ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:4px solid var(--ind2)}
.kpi .n{font-size:26px;font-weight:800;color:var(--ind0)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.kpi.gold{border-left-color:var(--gold)}.kpi.ok{border-left-color:var(--ok)}
.indcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.bar .track{height:9px;background:#EDEFF7;border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}

/* ===== SISTEMA ===== */
.sys-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sys-tab{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:600;padding:8px 14px;border-radius:99px;font-size:13px}
.sys-tab.active{background:var(--ind2);color:#fff;border-color:var(--ind2)}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:#F4F5FB;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td:last-child{white-space:nowrap;text-align:right}
.tbl tr:hover td{background:#FAFAFE}
.grp-h{font-weight:700;color:var(--ind0);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.1)}
.pill-gov{font-size:10px;padding:1px 7px;border-radius:99px;background:#EEF0FA;color:var(--ind2);font-weight:700}
.sub-block{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
.sub-row{display:flex;align-items:center;gap:8px;padding:9px 12px}
.sub-row b{font-size:13px}
.neto-list{padding:5px 12px 9px 34px;background:#FAFAFE;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.neto-row{display:flex;align-items:center;gap:7px;font-size:12.5px}

/* ===== DID ===== */
.did-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px}
.did-mast{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px 22px;border-top:5px solid var(--ind2);text-align:center;margin-bottom:12px}
.did-mast .big{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.08em;color:var(--ind2);line-height:1}
.did-mast .tl{font-size:11.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.did-mast .meta{font-size:12.5px;margin-top:9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.did-mast .meta b{color:var(--ind2)}
.ticker{display:flex;gap:0;overflow-x:auto;background:var(--ind0);border-radius:var(--r);margin-bottom:12px}
.tk{flex:0 0 auto;padding:9px 14px;border-right:1px solid #2a2f55;color:#fff;font-size:12px;white-space:nowrap}
.tk .s{color:#9aa0c8;font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block}
.tk .v{font-weight:700;font-size:13px}.tk .up{color:#5fd99b}.tk .down{color:#f08a7a}
.lead{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ind2);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px 20px;margin-bottom:12px}
.lead h2{font-family:var(--serif);font-size:19px;margin-bottom:10px;color:var(--ind0)}
.lead ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.lead li{font-size:13.5px;padding-left:16px;position:relative}
.lead li:before{content:"▶";position:absolute;left:0;color:var(--ind2);font-size:8px;top:5px}
.pj{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff;background:var(--muted);border-radius:4px;padding:1px 6px;margin-left:3px}
.didgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.didgrid .card{margin:0}
.sec{border-top:4px solid var(--muted)}
.sec.saude{border-top-color:var(--saude)}.sec.medtech{border-top-color:var(--medtech)}.sec.crypto{border-top-color:var(--crypto)}.sec.agro{border-top-color:var(--agro)}.sec.consult{border-top-color:var(--consult)}.sec.mkt{border-top-color:var(--mkt)}
.sec.suplementar{border-top-color:var(--suplementar)}.sec.operadoras{border-top-color:var(--operadoras)}.sec.prestadores{border-top-color:var(--prestadores)}.sec.pharma{border-top-color:var(--pharma)}
.sec.bigtech{border-top-color:var(--bigtech)}.sec.tech{border-top-color:var(--tech)}
/* mini-sleeve de tickers dentro do box do setor */
.ticker.tk-mini{margin:2px 0 10px;border-radius:9px}
.ticker.tk-mini .tk{padding:5px 10px}
.ticker.tk-mini .tk .s{font-size:9px}
.ticker.tk-mini .tk .v{font-size:11.5px}
/* DID v3: abas + sleeve de saúde + Leitura do dia */
.did-tabs{display:inline-flex;gap:4px;background:var(--ind-soft);padding:4px;border-radius:11px;margin-bottom:13px}
.did-tabs button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:7px 17px;border-radius:8px;cursor:pointer}
.did-tabs button.active{background:#fff;color:var(--ind2);box-shadow:var(--sh)}
.ticker.tk-saude{margin-top:-6px}
.ticker.tk-saude .tk-lab{background:#1a1f4a;color:#aab0e0;font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center}
.leitura{background:#fff;border:1px solid var(--line);border-left:5px solid var(--medtech);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px 18px;margin-bottom:12px}
.leitura-tag{font-size:11px;font-weight:700;color:var(--medtech);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.leitura-tag span{color:var(--muted);text-transform:none;letter-spacing:0}
.leitura h4{font-size:15px;font-weight:700;margin-bottom:4px}.leitura p{font-size:13px;color:#333;margin:0 0 6px}
.sec h3{font-family:var(--serif);font-size:16px;color:var(--ink);display:flex;gap:7px;align-items:center}
.sec .feeds{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 9px}
.item{border-top:1px solid var(--line);padding:9px 0}.item:first-of-type{border-top:none}
.item h4{font-size:14px;font-weight:700;margin-bottom:3px}.item p{font-size:13px;color:#333;margin:0 0 5px}
.why{font-size:12.5px;background:var(--ind-soft);border-left:3px solid var(--ind2);border-radius:6px;padding:6px 9px}.why b{color:var(--ind2)}
.src{font-size:11px;margin-top:5px}.src a{color:var(--muted);border-bottom:1px dotted var(--muted);text-decoration:none}
.did-note{background:#FBF4E0;border:1px solid #F0DBA8;border-radius:var(--r);padding:10px 14px;font-size:12px;color:#7a5300;margin-top:14px}

/* ===== RESPONSIVO ===== */
@media (max-width:1320px){ .weekgrid{grid-template-columns:repeat(4,1fr)} }
@media (max-width:960px){ .indcols,.didgrid{grid-template-columns:1fr} }
@media (max-width:560px){ .grid2{grid-template-columns:1fr} .ed-cal{max-width:calc(100vw - 24px)} .mir-bar{justify-content:flex-start} }
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh-md)}
  body.nav-open .sidebar{transform:translateX(0)}
  .nav-ov{position:fixed;inset:0;background:rgba(14,17,48,.45);z-index:35;display:none}
  body.nav-open .nav-ov{display:block}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .topbar .ham{font-size:20px;background:none;border:none;color:var(--ind0)}
  .topbar .tt{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ind0)}
  .content{padding:16px 14px calc(env(safe-area-inset-bottom) + 50px)}
  .weekgrid{grid-template-columns:1fr;gap:10px}
  .day-body{height:auto;max-height:none;overflow:visible}
}

/* ===== Seletor de edições por CALENDÁRIO (DID + MIR) ===== */
.ed-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ed-pick{position:relative}
.ed-cal{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-md);padding:12px;width:270px}
.ed-cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ed-cal-hd b{font-size:13px;color:var(--ind0)}
.ed-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.ed-dows span{text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.ed-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ed-day{border:0;background:transparent;font:inherit;font-size:12px;height:32px;border-radius:8px;color:var(--muted);cursor:default}
.ed-day.out{opacity:.32}
.ed-day.has{background:var(--ind-soft);color:var(--ind2);font-weight:700;cursor:pointer}
.ed-day.has:hover{background:var(--ind2);color:#fff}
.ed-day.cur{background:var(--ind2);color:#fff}
.ed-day.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.ed-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 2px}

/* ===== HOME (Início) ===== */
.home-hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,var(--ind1),var(--ind2));color:#fff;border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;box-shadow:var(--sh-md)}
.home-hero .hh-sau{font-family:var(--serif);font-size:24px;font-weight:700}
.home-hero .hh-date{font-size:13px;opacity:.88;margin-top:2px}
.home-hero .hh-date::first-letter{text-transform:uppercase}
.home-hero .hh-wx{text-align:right}
.home-hero .wx,.home-hero .wx.wx-lg{color:#fff}
.home-hero .wx small{color:#cfd3ee}
.hh-loc{font-size:11px;opacity:.72;margin-top:2px}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
.hcard h3{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.hcard h4{font-size:14.5px;font-weight:700;margin:0 0 5px}
.hcard p{font-size:13px;color:#333;margin:0 0 7px}
.hstale{font-size:10px;color:var(--muted);font-weight:400;margin-left:auto}
.hev-destaque{background:var(--ind-soft);border-left:4px solid var(--ind2);border-radius:8px;padding:9px 12px;cursor:pointer;margin-bottom:8px}
.hev-destaque .t{font-size:11px;font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums}
.hev-destaque .ti{font-weight:700;font-size:14.5px;margin:1px 0 5px}
.hev-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.hev{font-size:12.5px;color:#444}
.hev .t{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums}
.hh-per{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:2px 10px;margin-left:10px;vertical-align:middle;letter-spacing:.02em}
.home-status{background:var(--ind0);color:#EDEFFA;border-left:4px solid var(--gold);border-radius:var(--r);padding:10px 16px;font-size:13px;margin-bottom:14px;line-height:1.5}
.home-status b{color:#fff}
.home-amanha{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ind2);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.home-amanha .ha-h{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink)}
.home-amanha .ha-wx{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ind2)}
.home-amanha .ha-sub{font-size:12px;color:var(--muted);margin:2px 0 7px}
.home-amanha .ha-list{display:flex;flex-direction:column;gap:3px}
.home-amanha .ha-ev{font-size:13px;color:#333}
.home-amanha .ha-ev .t{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums;margin-right:4px}
.home-amanha .ha-tag{font-size:9px;font-weight:800;background:#EEF0FA;color:var(--ind2);border-radius:4px;padding:1px 5px;text-transform:uppercase}
.hstatus{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.hs{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px}
.hs.done{background:#E4F5EC;color:#1F9D57}
.hs.pend{background:#EEF0FA;color:#5a5f86}
.hs.miss{background:#FBE9E7;color:#C8462F}
.hfin-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:9px 0 1px}
.hfin-sec:first-of-type{margin-top:2px}
.hbook-list{display:flex;flex-direction:column;gap:8px}
.hbook-t{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink)}
.hbook-m{font-size:12px;color:var(--muted);margin-top:1px}
.hbook-m b{color:var(--ind2)}
.hfin-list{display:flex;flex-direction:column;gap:1px}
.hfin{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.hfin:first-child{border-top:0}
.hfin-d{font-weight:700;color:var(--ind2);font-variant-numeric:tabular-nums;min-width:44px}
.hfin-t{flex:1;color:#2a2c3e}
.hfin-tag{font-size:9px;font-weight:800;background:var(--ind-soft);color:var(--ind2);border-radius:4px;padding:1px 4px;vertical-align:middle}
.hfin-r{font-size:11px;color:var(--muted);white-space:nowrap}
.hfin.due .hfin-t{color:var(--ind0);font-weight:600}
.hfin.due .hfin-r{background:var(--gold);color:#3a2c00;font-weight:800;border-radius:20px;padding:1px 8px}
.hfoot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.hfoot b{color:var(--ind2)}
.hempty{font-size:13px;color:var(--muted);font-style:italic;padding:8px 0}
.hsp{padding:7px 0;border-top:1px dashed var(--line)}
.hsp:first-of-type{border-top:0}
.hsp b{font-size:13px}
.hline{font-size:12.5px;color:#333;margin-top:2px}
.hline.muted2{color:var(--muted)}
.hlbl{display:inline-block;background:var(--ind-soft);color:var(--ind2);font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;margin-right:5px}
.seldon-banner{background:var(--ind0);color:#EDEFFA;border-left:5px solid var(--gold);border-radius:var(--r-lg);padding:16px 20px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.6;margin-bottom:12px;box-shadow:var(--sh)}
.seldon-banner .sb-a{font-style:normal;font-size:12px;color:var(--goldL);margin-top:6px;font-family:var(--sans);letter-spacing:.04em}
.bq{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-size:13.5px;font-style:italic;color:#333;box-shadow:var(--sh)}
.bq .bq-a{font-style:normal;color:var(--muted);font-size:12px;margin-left:8px}
/* ===== O Cruzamento (Saúde × Mercado) — peça-assinatura de domingo ===== */
.cruzamento{background:linear-gradient(135deg,var(--ind0),#1a4d4d);color:#EDEFFA;border:0;border-left:4px solid var(--gold);margin-bottom:16px}
.cruzamento .cz-h{font-family:var(--serif);font-weight:700;font-size:19px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#fff}
.cz-sub{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--goldL)}
.cruzamento .cz-item{padding:11px 0;border-top:1px solid rgba(255,255,255,.13)}
.cruzamento .cz-item:first-of-type{border-top:0}
.cruzamento .cz-item h4{color:#fff;font-size:15.5px;margin-bottom:4px}
.cruzamento .cz-item p{color:#d8dbf0;font-size:13.5px;margin-bottom:6px;line-height:1.55}
.cruzamento .cz-why{background:rgba(229,169,60,.15);border-left:3px solid var(--gold);border-radius:4px;padding:6px 11px;font-size:13px;color:#EDEFFA;margin-bottom:5px}
.cruzamento .cz-why b{color:var(--goldL)}
.cruzamento .src{color:#aab0e0}.cruzamento .src a{color:var(--goldL)}
.cruz-home{background:linear-gradient(135deg,var(--ind0),#1a4d4d);color:#EDEFFA;border-left:4px solid var(--gold)}
.cruz-home h3,.cruz-home h4{color:#fff}
.cruz-home p{color:#d8dbf0}

<div id="hubSync" style="display:none;position:fixed;top:8px;right:10px;z-index:60;align-items:center;gap:6px;font:600 11px -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#161A3F;color:#fff;padding:6px 11px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.2)"></div>
<div id="hubSetup" style="display:none;position:fixed;inset:0;z-index:100;background:#ECEEF7;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><div style="background:#fff;border:1px solid #E5E7F2;border-radius:16px;box-shadow:0 8px 24px rgba(20,22,50,.12);padding:24px 22px;max-width:340px;width:90%"><div style="font-family:Georgia,serif;font-weight:700;font-size:21px;color:#161A3F;text-align:center">Personal Hub</div><div style="font-size:12.5px;color:#6B7088;margin:6px 0 16px;text-align:center">Conecte ao seu banco (uma vez). Rode <code>hubApiInfo()</code> no Apps Script para pegar o token.</div><label style="font-size:11px;color:#6B7088">URL do /exec</label><input id="hs_api" style="width:100%;font-size:12px;padding:9px;border:1px solid #E5E7F2;border-radius:8px;margin:3px 0 10px;box-sizing:border-box"><label style="font-size:11px;color:#6B7088">Token</label><input id="hs_tok" type="password" placeholder="cole o token" style="width:100%;font-size:14px;padding:10px;border:1px solid #E5E7F2;border-radius:8px;margin:3px 0 12px;box-sizing:border-box"><button id="hs_go" style="width:100%;font-size:14px;font-weight:700;padding:12px;border:0;border-radius:9px;background:#3D43A2;color:#fff;cursor:pointer">Conectar</button><div id="hs_err" style="font-size:12px;color:#C8462F;margin-top:9px;min-height:14px;text-align:center"></div></div></div>
<script>
(function(){
  var API=localStorage.getItem('hub_api')||"https://script.google.com/macros/s/AKfycbz6TgZmviSz3JJkx38rN9Jfryw_N98IYS5cMW5R2YaSpkJPJiyW3ak1jAE8mmBOP2ij9w/exec";
  var TOKEN=localStorage.getItem('hub_token')||'';
  var EMPTY={config:[],events:[],locations:{}};
  function cget(k,def){try{var v=localStorage.getItem('hub_c_'+k);return v?JSON.parse(v):def;}catch(e){return def;}}
  function cset(k,v){try{localStorage.setItem('hub_c_'+k,JSON.stringify(v));}catch(e){}}
  function on(){return navigator.onLine!==false;}
  function canNet(){return on()&&!!API&&!!TOKEN;}
  function getJSON(api,extra){return fetch(API+'?api='+api+'&token='+encodeURIComponent(TOKEN)+(extra||''),{method:'GET'}).then(function(r){return r.json();});}
  function postJSON(action,data){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:TOKEN,action:action,data:data})}).then(function(r){return r.json();});}
  function pend(){return cget('pending',{});}
  function setPend(p){cset('pending',p);}
  function queue(a,data){var p=pend();p[a]={data:data};setPend(p);badge();}
  function applyPending(d){var p=pend();if(p.saveEvents)d.events=p.saveEvents.data;if(p.saveConfig)d.config=p.saveConfig.data;if(p.saveLocations){var m={};(p.saveLocations.data||[]).forEach(function(r){m[r.date]=r.loc;});d.locations=m;}return d;}
  function flush(){
    if(!canNet())return Promise.resolve(false);
    var p=pend(),acts=Object.keys(p);if(!acts.length)return Promise.resolve(true);
    return acts.reduce(function(ch,a){return ch.then(function(){return postJSON(a,p[a].data).then(function(res){if(res&&res.ok){var pp=pend();delete pp[a];setPend(pp);}});});},Promise.resolve()).then(function(){badge();return true;},function(){badge();return false;});
  }
  function badge(){var n=Object.keys(pend()).length;var el=document.getElementById('hubSync');if(!el)return;if(!on()){el.style.display='flex';el.textContent='● offline'+(n?(' · '+n+' p/ enviar'):'');}else if(n){el.style.display='flex';el.textContent='↑ enviando '+n+'…';}else{el.style.display='none';}}
  window.addEventListener('online',function(){badge();flush();});
  window.addEventListener('offline',badge);
  var RUN={
    getBootstrap:function(){return flush().then(function(){if(canNet())return getJSON('bootstrap').then(function(d){if(d&&!d.error)cset('bootstrap',applyPending(d));return cget('bootstrap',EMPTY);});return cget('bootstrap',EMPTY);}).catch(function(){return cget('bootstrap',EMPTY);});},
    getDID:function(){if(canNet())return getJSON('did').then(function(d){if(d&&!d.error)cset('did',d);return cget('did',null);}).catch(function(){return cget('did',null);});return Promise.resolve(cget('did',null));},
    getMIR:function(){if(canNet())return getJSON('mir').then(function(d){if(d&&!d.error)cset('mir',d);return cget('mir',null);}).catch(function(){return cget('mir',null);});return Promise.resolve(cget('mir',null));},
    getHome:function(){if(canNet())return getJSON('home').then(function(d){if(d&&!d.error)cset('home',d);return cget('home',null);}).catch(function(){return cget('home',null);});return Promise.resolve(cget('home',null));},
    getWeather:function(){if(canNet())return getJSON('weather').then(function(d){if(d&&!d.error)cset('weather',d);return cget('weather',null);}).catch(function(){return cget('weather',null);});return Promise.resolve(cget('weather',null));},
    listDIDs:function(){if(canNet())return getJSON('dids').then(function(d){if(Array.isArray(d))cset('dids',d);return cget('dids',[]);}).catch(function(){return cget('dids',[]);});return Promise.resolve(cget('dids',[]));},
    getDIDByName:function(name){if(canNet())return getJSON('didByName','&name='+encodeURIComponent(name)).catch(function(){return null;});return Promise.resolve(null);},
    listMIRs:function(){if(canNet())return getJSON('mirs').then(function(d){if(Array.isArray(d))cset('mirs',d);return cget('mirs',[]);}).catch(function(){return cget('mirs',[]);});return Promise.resolve(cget('mirs',[]));},
    getMIRByName:function(name){if(canNet())return getJSON('mirByName','&name='+encodeURIComponent(name)).catch(function(){return null;});return Promise.resolve(null);},
    pullAgenda:function(){if(canNet())return getJSON('pull').then(function(r){if(r&&r.events){var b=cget('bootstrap',EMPTY);b.events=r.events;cset('bootstrap',b);}return r||{events:[],applied:0};}).catch(function(){return {events:cget('bootstrap',EMPTY).events||[],applied:0};});return Promise.resolve({events:cget('bootstrap',EMPTY).events||[],applied:0});},
    saveAllEvents:function(a){var b=cget('bootstrap',EMPTY);b.events=a;cset('bootstrap',b);queue('saveEvents',a);flush();return true;},
    saveAllConfig:function(a){var b=cget('bootstrap',EMPTY);b.config=a;cset('bootstrap',b);queue('saveConfig',a);flush();return true;},
    saveAllLocations:function(a){var b=cget('bootstrap',EMPTY);var m={};(a||[]).forEach(function(r){m[r.date]=r.loc;});b.locations=m;cset('bootstrap',b);queue('saveLocations',a);flush();return true;},
    exportState:function(){return 'No PWA os dados sincronizam automaticamente ao reconectar.';},
    requestRefresh:function(){return true;}
  };
  function mk(){var ok=null,er=null;var a={withSuccessHandler:function(f){ok=f;return a;},withFailureHandler:function(f){er=f;return a;}};Object.keys(RUN).forEach(function(n){a[n]=function(){var ar=arguments;Promise.resolve().then(function(){return RUN[n].apply(null,ar);}).then(function(r){if(ok)ok(r);},function(e){if(er)er(e);});return a;};});return a;}
  window.google={script:{get run(){return mk();}}};
  function setup(){var g=document.getElementById('hubSetup');if(!g)return;var ai=document.getElementById('hs_api');if(ai)ai.value=API;g.style.display=(TOKEN?'none':'flex');var go=document.getElementById('hs_go');if(go)go.onclick=function(){var ap=(document.getElementById('hs_api').value||'').trim(),tk=(document.getElementById('hs_tok').value||'').trim();if(!tk){document.getElementById('hs_err').textContent='Cole o token.';return;}API=ap;TOKEN=tk;try{localStorage.setItem('hub_api',ap);localStorage.setItem('hub_token',tk);}catch(e){}g.style.display='none';if(window.load)window.load();flush();};}
  function warm(){if(!canNet())return;getJSON('did').then(function(d){if(d&&!d.error)cset('did',d);}).catch(function(){});getJSON('mir').then(function(d){if(d&&!d.error)cset('mir',d);}).catch(function(){});getJSON('home').then(function(d){if(d&&!d.error)cset('home',d);}).catch(function(){});getJSON('weather').then(function(d){if(d&&!d.error)cset('weather',d);}).catch(function(){});getJSON('dids').then(function(d){if(Array.isArray(d))cset('dids',d);}).catch(function(){});getJSON('mirs').then(function(d){if(Array.isArray(d))cset('mirs',d);}).catch(function(){});getJSON('bootstrap').then(function(d){if(d&&!d.error)cset('bootstrap',applyPending(d));}).catch(function(){});}
  function boot(){badge();setup();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});flush().then(warm);}
  if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
  window.__hubReset=function(){['hub_token','hub_api'].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});location.reload();};
})();

/* ============================ DADOS / SEED ============================ */
var MARK='<defs><radialGradient id="sbg" cx="34%" cy="50%" r="80%"><stop offset="0%" stop-color="#CDD1EC"/><stop offset="100%" stop-color="#B9BFE0"/></radialGradient></defs><rect x="4" y="4" width="112" height="112" rx="26" fill="url(#sbg)" stroke="#A9AFD6" stroke-width="1.5"/>__FAN__<circle cx="34" cy="60" r="6.2" fill="#23286B"/>';
(function buildMark(){
  var paths='';
  for(var i=0;i<7;i++){var t=(i/6)-0.5,ex=94,ey=60+t*0.92*60,mid=i===3;
    paths+='<path d="M 34 60 C 61 60 70 '+(60+t*0.92*60*0.6).toFixed(1)+' '+ex+' '+ey.toFixed(1)+'" fill="none" stroke="'+(mid?'#E5A93C':'#3D43A2')+'" stroke-width="'+(mid?3.4:2)+'" stroke-linecap="round" opacity="'+(mid?1:.82)+'"/>';}
  paths+='<circle cx="94" cy="60" r="4.6" fill="#E5A93C"/><circle cx="94" cy="60" r="8.5" fill="none" stroke="#E5A93C" stroke-width="1" opacity=".45"/>';
  document.getElementById('seldonmark').outerHTML='<g>'+MARK.replace('__FAN__',paths)+'</g>';
})();

function api(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,a);});}
var DID={};
var CFG=[],EVENTS=[],LOCS={};
var WX={};        /* previsão por dia: { 'AAAA-MM-DD': {tmax,tmin,icon,desc,pop} } */
var WXMETA=null;  /* { local, updatedAt } */
function wxLoad(){ api('getWeather').then(function(w){ WX={}; WXMETA=null; if(w&&w.dias){ (w.dias||[]).forEach(function(d){ if(d&&d.date)WX[d.date]=d; }); WXMETA={local:w.local||'',updatedAt:w.updatedAt||''}; if(page==='agenda')renderAgenda(); else if(page==='home')renderHome(); } }).catch(function(){}); }
function wxOf(iso){ return WX[iso]||null; }
function wxChip(iso){ var w=wxOf(iso); if(!w)return ''; var t=(w.tmax!=null?Math.round(w.tmax)+'°':''); var lo=(w.tmin!=null?'<small>/'+Math.round(w.tmin)+'°</small>':''); var rain=(w.pop!=null&&w.pop>=30?'<span class="wx-pop">💧'+Math.round(w.pop)+'%</span>':''); return '<span class="wx" title="'+esc(w.desc||'')+(w.pop!=null?(' · chuva '+Math.round(w.pop)+'%'):'')+'"><span class="wx-ic">'+(w.icon||'')+'</span>'+t+lo+rain+'</span>'; }
function wxToday(){ var w=wxOf(isoOf(TODAY)); if(!w)return ''; return '<span class="wx wx-lg" title="'+esc(w.desc||'')+'"><span class="wx-ic">'+(w.icon||'')+'</span> '+(w.tmax!=null?Math.round(w.tmax)+'°':'')+(w.tmin!=null?' / '+Math.round(w.tmin)+'°':'')+(w.desc?' · '+esc(w.desc):'')+'</span>'; }
function dateFull(d){ return DOW[(d.getDay()+6)%7]+', '+d.getDate()+' de '+MONFULL[d.getMonth()].toLowerCase()+' de '+d.getFullYear(); }
function wxBarHTML(){ return '<div class="wxbar"><span class="wxbar-date">'+dateFull(TODAY)+'</span>'+wxToday()+(WXMETA&&WXMETA.local?'<span class="wxbar-loc">'+esc(WXMETA.local)+'</span>':'')+'</div>'; }
function saveCfg(){api('saveAllConfig',CFG).catch(function(){toast('Falha ao salvar config');});}
function saveEv(){api('saveAllEvents',EVENTS).catch(function(){toast('Falha ao salvar');});}
function saveLocs(){var a=Object.keys(LOCS).filter(function(k){return LOCS[k];}).map(function(k){return {date:k,loc:LOCS[k]};});api('saveAllLocations',a).catch(function(){toast('Falha ao salvar local');});}
function getLoc(iso){return LOCS[iso]||'';}
function setLoc(iso,v){if(v)LOCS[iso]=v;else delete LOCS[iso];saveLocs();renderAgenda();}
function locSelect(iso,cur){return '<select class="locsel" title="Local (gerencie em Sistema)" onclick="event.stopPropagation()" onchange="setLoc(\''+iso+'\',this.value)"><option value="">· local</option>'+locOptgroups(cur)+'</select>';}
function load(){var v=document.getElementById('view');if(v)v.innerHTML='<div style="padding:48px;text-align:center;color:#6B7088">Carregando…</div>';api('getBootstrap').then(function(d){CFG=(d&&d.config)||[];EVENTS=(d&&d.events)||[];LOCS=(d&&d.locations)||{};if(dedupEventIds())saveEv();render();wxLoad();}).catch(function(e){var vv=document.getElementById('view');if(vv)vv.innerHTML='<div class="card">Erro ao carregar: '+((e&&e.message)||e)+'</div>';});}
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&refreshToday()&&page==='agenda')renderAgenda(); });
function reloadAgenda(){toast('Atualizando…');
  api('pullAgenda').then(function(r){if(r&&r.events)EVENTS=r.events;renderAgenda();
    toast((r&&r.applied)?('Agenda atualizada — '+r.applied+' do cron'):'Agenda atualizada');})
  .catch(function(){toast('Falha ao atualizar');});}

/* helpers de config */
function byCat(c){return CFG.filter(function(x){return x.cat===c;}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function cfgFind(cat,valor){return CFG.find(function(x){return x.cat===cat&&x.valor===valor;});}
function subtiposOf(tipo){return byCat('subtipo').filter(function(s){return s.pai===tipo;});}
function tipoOf(subtipo){var s=cfgFind('subtipo',subtipo);return s?s.pai:'';}
function colorOf(e){var p=e.projeto&&cfgFind('projeto',e.projeto);if(p)return p.cor;var s=cfgFind('subtipo',e.subtipo);if(s)return s.cor;return '#3D43A2';}
function isWork(e){return tipoOf(e.subtipo)==='Trabalho';}
function cfgById(id){return CFG.find(function(c){return c.id===id;});}
function subRow(tipoVal,subVal){return CFG.find(function(x){return x.cat==='subtipo'&&x.valor===subVal&&x.pai===tipoVal;});}
function subsByPai(pid){return CFG.filter(function(x){return x.cat==='subsub'&&x.pai===pid;}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function subsubOf(tipoVal,subVal){var s=subRow(tipoVal,subVal);return s?subsByPai(s.id):[];}

/* tempo */
function toMin(hhmm){var m=/^(\d{1,2}):(\d{2})/.exec(hhmm||'');return m?(+m[1])*60+(+m[2]):0;}
function durH(e){var a=toMin(e.start),b=toMin(e.end);if(b<=a)b+=1440;return (b-a)/60;}
function fmtH(h){return (Math.round(h*100)/100).toString().replace('.',',');}
function pad(n){return ('0'+n).slice(-2);}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayOf(d){var x=new Date(d);var dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;}
var DOW=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
var MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MONFULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ============================ SHELL / ROUTER ============================ */
var NAV=[{k:'home',ic:'🏠',t:'Início'},{k:'agenda',ic:'🗓️',t:'Agenda'},{k:'did',ic:'📰',t:'DID · Mercados'},{k:'mir',ic:'🩺',t:'MIR Health'},{k:'ind',ic:'📊',t:'Indicadores'},{k:'sys',ic:'⚙️',t:'Sistema'}];
var page='home';   // o app sempre abre na Home (o "bom dia" do dia); a navegação continua persistindo em hub_view p/ usos internos
var TODAY=(window.__HUB_TODAY?new Date(window.__HUB_TODAY+'T00:00:00'):new Date()); TODAY.setHours(0,0,0,0); // data real (harness pode fixar via __HUB_TODAY)
/** Recalcula "hoje" (o app pode ficar aberto virando o dia). Retorna true se a data mudou. */
function refreshToday(){ if(window.__HUB_TODAY)return false; var n=new Date(); n.setHours(0,0,0,0); if(isoOf(n)!==isoOf(TODAY)){TODAY=n; return true;} return false; }
var agView='semana';
var cur=new Date(TODAY);
function weekStart(){return mondayOf(cur);}
function $(s){return document.querySelector(s);}
function el(id){return document.getElementById(id);}
function toast(t){var e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},1500);}
function toggleNav(){document.body.classList.toggle('nav-open');}
function closeNav(){document.body.classList.remove('nav-open');}
function buildNav(){el('sbnav').innerHTML=NAV.map(function(n){return '<button class="sb-link'+(n.k===page?' active':'')+'" onclick="go(\''+n.k+'\')"><span class="ico">'+n.ic+'</span>'+n.t+'</button>';}).join('');}
function go(k){page=k;try{localStorage.setItem('hub_view',k);}catch(e){}closeNav();buildNav();render();}
function setView(k){go(k);}
function render(){
  refreshToday(); el('todayStr').textContent=pad(TODAY.getDate())+'/'+pad(TODAY.getMonth()+1);
  el('topTitle').textContent=(NAV.find(function(n){return n.k===page;})||{}).t||'Hub';
  if(page==='home')renderHome();else if(page==='agenda')renderAgenda();else if(page==='did')renderDID();else if(page==='mir')renderMIR();else if(page==='ind')renderInd();else renderSys();
  window.scrollTo(0,0);
}
el('todayStr').textContent=pad(TODAY.getDate())+'/'+pad(TODAY.getMonth()+1);

/* ============================ AGENDA ============================ */
function weekDays(){var m=weekStart();var a=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);a.push(d);}return a;}
function eventsOf(iso){return EVENTS.filter(function(e){return e.date===iso;}).sort(function(a,b){return toMin(a.start)-toMin(b.start);});}
function renderAgenda(){ if(agView==='dia')return renderDay(); if(agView==='mes')return renderMonth(); return renderWeek(); }
/* Acordeon da semana: colapsa o corpo do dia, deixando só o cabeçalho (data/clima/local/horas). */
var agCollapsed=(function(){try{return JSON.parse(localStorage.getItem('hub_wk_collapsed')||'{}');}catch(e){return {};}})();
function saveCollapsed(){try{localStorage.setItem('hub_wk_collapsed',JSON.stringify(agCollapsed));}catch(e){}}
function toggleDay(iso){agCollapsed[iso]=!agCollapsed[iso];saveCollapsed();var el2=document.querySelector('.day[data-iso="'+iso+'"]');if(el2)el2.classList.toggle('collapsed',!!agCollapsed[iso]);}
function collapseAllDays(v){weekDays().forEach(function(d){agCollapsed[isoOf(d)]=v;});saveCollapsed();renderWeek();}
function navAg(n){ if(agView==='dia')cur.setDate(cur.getDate()+n); else if(agView==='mes')cur.setMonth(cur.getMonth()+n); else cur.setDate(cur.getDate()+n*7); cur=new Date(cur); renderAgenda(); window.scrollTo(0,0); }
function agHeader(label,sub){
  return '<div class="page-head"><h1>Agenda</h1><div class="seg">'+
    [['mes','Mês'],['semana','Semana'],['dia','Dia']].map(function(v){return '<button class="'+(agView===v[0]?'active':'')+'" onclick="agView=\''+v[0]+'\';renderAgenda();window.scrollTo(0,0)">'+v[1]+'</button>';}).join('')+'</div>'+
    '<div class="spacer"></div><button class="btn btn-sm" onclick="reloadAgenda()">↻ Atualizar</button><button class="btn btn-primary" onclick="openEvent(null)">＋ Evento</button></div>'+
    '<div class="agenda-bar"><div class="wknav"><button class="icbtn" onclick="navAg(-1)">◀</button><span class="lbl">'+label+'</span><button class="icbtn" onclick="navAg(1)">▶</button><button class="btn btn-sm" onclick="goToday()">Hoje</button></div>'+(sub?'<div class="muted" style="font-size:12.5px">'+sub+'</div>':'')+'</div>';
}
function dayHeadHTML(d,iso){return '<div class="day-head"><div class="row"><div><div class="dow">'+DOW[(d.getDay()+6)%7]+'</div><div class="dt">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</div></div>'+wxChip(iso)+'</div>'+locSelect(iso,getLoc(iso))+'</div>';}
function renderWeek(){
  var days=weekDays(), label=pad(days[0].getDate())+'–'+pad(days[6].getDate())+' '+MON[days[6].getMonth()]+' '+days[6].getFullYear();
  var w=0,p=0; EVENTS.forEach(function(e){if(days.some(function(d){return isoOf(d)===e.date;})){if(isWork(e))w+=durH(e);else p+=durH(e);}});
  var h=agHeader(label,'<b>'+fmtH(w)+'h</b> trab · '+fmtH(p)+'h pess')+wxBarHTML();
  var allCol=days.every(function(d){return agCollapsed[isoOf(d)];});
  h+='<div class="wkbar"><button class="btn btn-sm" onclick="collapseAllDays('+(allCol?'false':'true')+')">'+(allCol?'▾ Expandir todos':'▸ Colapsar todos')+'</button></div>';
  h+='<div class="weekgrid">';
  days.forEach(function(d){
    var iso=isoOf(d),evs=eventsOf(iso),today=isoOf(d)===isoOf(TODAY),wH=0;evs.forEach(function(e){if(isWork(e))wH+=durH(e);});
    h+='<div class="day'+(today?' today':'')+(agCollapsed[iso]?' collapsed':'')+'" data-iso="'+iso+'"><div class="day-head"><div class="row dh-toggle" onclick="toggleDay(\''+iso+'\')" title="Colapsar/expandir dia"><div class="dh-t"><span class="chev">▾</span><div><div class="dow">'+DOW[(d.getDay()+6)%7]+'</div><div class="dt">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</div></div></div>'+wxChip(iso)+'</div>'+locSelect(iso,getLoc(iso))+'<div class="day-sum">'+(wH?('<b>'+fmtH(wH)+'h</b> trabalho'):'&nbsp;')+(evs.length?'<span class="day-n">'+evs.length+' ev</span>':'')+'</div></div><div class="day-body">';
    if(!evs.length)h+='<div class="empty-day">Sem compromissos</div>';
    evs.forEach(function(e){h+=evCard(e);});
    h+='</div></div>';
  });
  h+='</div>';
  el('view').innerHTML=h;
}
function renderDay(){
  var d=new Date(cur), iso=isoOf(d), evs=eventsOf(iso), w=0,p=0;
  evs.forEach(function(e){if(isWork(e))w+=durH(e);else p+=durH(e);});
  var label=DOW[(d.getDay()+6)%7]+', '+pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear();
  var h=agHeader(label,(w?'<b>'+fmtH(w)+'h</b> trab':'')+(p?((w?' · ':'')+fmtH(p)+'h pess'):'')+((w||p)&&evs.length?' · ':'')+(evs.length?evs.length+' evento'+(evs.length>1?'s':''):''))+wxBarHTML();
  h+='<div class="dayview"><div class="day">'+dayHeadHTML(d,iso)+'<div class="dayview-body">';
  if(!evs.length)h+='<div class="empty-day">Sem compromissos</div>';
  evs.forEach(function(e){h+=evCard(e);});
  h+='</div></div></div>';
  el('view').innerHTML=h;
}
function renderMonth(){
  var first=new Date(cur.getFullYear(),cur.getMonth(),1), gridStart=mondayOf(first);
  var monthH=0; EVENTS.forEach(function(e){var dt=parseISO(e.date);if(dt.getMonth()===cur.getMonth()&&dt.getFullYear()===cur.getFullYear()&&isWork(e))monthH+=durH(e);});
  var h=agHeader(MONFULL[cur.getMonth()]+' '+cur.getFullYear(),'<b>'+fmtH(monthH)+'h</b> trabalho no mês')+wxBarHTML();
  h+='<div class="month"><div class="month-dows">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="month-grid">';
  for(var i=0;i<42;i++){
    var d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    var iso=isoOf(d), evs=eventsOf(iso), inM=d.getMonth()===cur.getMonth(), today=iso===isoOf(TODAY);
    h+='<div class="mcell'+(inM?'':' out')+(today?' today':'')+'" onclick="cur=parseISO(\''+iso+'\');agView=\'dia\';renderAgenda();window.scrollTo(0,0)">'+

      evs.slice(0,4).map(function(e){var c=colorOf(e);return '<div class="mev" style="background:'+hex2bg(c)+';color:'+c+'">'+esc(e.start)+' '+esc(e.titulo)+'</div>';}).join('')+
      (evs.length>4?'<div class="mmore">+'+(evs.length-4)+' mais</div>':'')+'</div></div>';
  }
  h+='</div></div>';

function evCard(e){
  var col=colorOf(e),st=e.status,cls=st==='done'?'done':(st==='miss'?'miss':'');
  var sym=st==='done'?'✓':(st==='miss'?'✗':'○');
  var sub=cfgFind('subtipo',e.subtipo);
  var chips='';
  if(e.projeto){var p=cfgFind('projeto',e.projeto);chips+='<span class="chip" style="background:'+hex2bg(p?p.cor:col)+';color:'+(p?p.cor:col)+'"><span class="dot" style="background:'+(p?p.cor:col)+'"></span>'+e.projeto+'</span>';}
  if(e.subtipo)chips+='<span class="chip" style="background:#EEF0FA;color:#5a5f86">'+e.subtipo+'</span>';
  if(e.subsub)chips+='<span class="chip" style="background:#F4EFE3;color:#7a5300">'+esc(e.subsub)+(e.detalhe?': '+esc(e.detalhe):'')+'</span>';
  var tlabel=e.start+'–'+e.end;
  return '<div class="ev '+cls+'" style="border-left-color:'+col+'" onclick="openEvent(\''+e.id+'\')">'+
    '<div class="ev-actions"><span class="st '+cls+'" title="feito/não/—" onclick="event.stopPropagation();cycleStatus(\''+e.id+'\')">'+sym+'</span><button class="ev-del" title="Cancelar evento" onclick="event.stopPropagation();delEvent(\''+e.id+'\')">×</button></div>'+
    '<div class="t">'+tlabel+'</div>'+
    '<div class="ti">'+esc(e.titulo)+'</div>'+
    '<div class="meta">'+(e.fonte==='user'?'<span class="ev-man" title="Evento manual — não alterado pelo cron">✎ manual</span>':'')+chips+'</div>'+(e.note?'<div class="note-line">'+noteHTML(e.note)+'</div>':'')+'</div>';
}
function hex2bg(hex){return hex+'1a';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/** Renderiza a nota: suporta hiperlink com rótulo [texto](url) e também linka URLs nuas. */
function noteHTML(raw){
  raw=String(raw==null?'':raw);
  function anchor(url,label){return '<a class="note-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+esc(label)+'</a>';}
  var re=/\[([^\]]+)\]\(\s*((?:https?|file|mailto):[^\s)]+)\s*\)|((?:https?|file):\/\/[^\s]+|mailto:[^\s]+)/g;
  var out='',idx=0,m;
  while((m=re.exec(raw))){ out+=esc(raw.slice(idx,m.index)); if(m[1]){out+=anchor(m[2],m[1]);} else {out+=anchor(m[3],m[3]);} idx=re.lastIndex; }
  out+=esc(raw.slice(idx));
  return out;
}

    '<div class="grid2"><div class="field"><label>Início</label><input id="m_start" type="time" step="900" value="'+e.start+'"></div>'+
      '<div class="field"><label>Fim</label><input id="m_end" type="time" step="900" value="'+e.end+'"></div></div>'+
    '<div class="grid2"><div class="field"><label>Tipo</label><select id="m_tipo" onchange="fillSub()">'+tipoOpts+'</select></div>'+
      '<div class="field"><label>Subtipo</label><select id="m_sub" onchange="fillSubsub()"></select></div></div>'+
    '<div class="field" id="m_subsub_wrap" style="display:none"><label id="m_subsub_lbl">Detalhe</label><select id="m_subsub" onchange="fillDetalhe()"></select></div>'+
    '<div class="field" id="m_detalhe_wrap" style="display:none"><label id="m_detalhe_lbl">Detalhe</label><select id="m_detalhe"></select></div>'+
    '<div class="field"><label>Projeto / Empresa</label><select id="m_proj">'+projOpts+'</select></div>'+
    '<div class="field"><label>Nota (opcional)</label><textarea id="m_note" rows="2" placeholder="Observação — link: [texto curto](https://… ou file:///…)">'+esc(e.note)+'</textarea><div class="hint">Dica: <code>[Minutas NSP](https://…)</code> mostra só o texto e abre o link.</div></div>'+
    '<div class="muted" id="m_calc" style="font-size:12px"></div>'+
    '</div>'+
    '<div class="modal-foot"><div style="display:flex;gap:8px">'+(isNew?'':'<button class="btn btn-sm btn-ghost" onclick="dupEvent()">⧉ Duplicar</button><button class="btn btn-sm btn-ghost" style="color:var(--miss)" onclick="delEvent(\''+e.id+'\')">Excluir</button>')+'</div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm btn-primary" onclick="saveEvent(\''+(e.id||'')+'\')">Salvar</button></div></div>');
  fillSub(e.subtipo); fillSubsub(e.subsub); fillDetalhe(e.detalhe);
  el('m_start').addEventListener('change',autoEnd);   // ao mudar o início, fim vai p/ +1h automaticamente
  ['m_end','m_tipo'].forEach(function(idd){el(idd).addEventListener('change',calcDur);});calcDur();
}
/** Ao escolher a hora de início, joga o fim para 1h depois (padrão 1h). */
function autoEnd(){var a=toMin(el('m_start').value);var b=(a+60)%1440;el('m_end').value=pad(Math.floor(b/60))+':'+pad(b%60);calcDur();}
/** Duplica o evento aberto: abre um NOVO com os mesmos dados (ajuste a data/hora e salve → vira outro). */
function dupEvent(){var ss=(el('m_subsub_wrap').style.display==='none')?'':el('m_subsub').value;var pf={titulo:el('m_ti').value.trim(),date:el('m_date').value,start:el('m_start').value,end:el('m_end').value,subtipo:el('m_sub').value,subsub:ss,projeto:el('m_proj').value,local:el('m_loc').value,note:el('m_note').value.trim(),detalhe:(el('m_detalhe_wrap')&&el('m_detalhe_wrap').style.display!=='none'&&el('m_detalhe'))?el('m_detalhe').value:''};openEvent(null,pf);toast('Duplicado — ajuste data/hora e salve');}
function fillSub(sel){var tipo=el('m_tipo').value;var subs=subtiposOf(tipo);el('m_sub').innerHTML=subs.map(function(s){return '<option value="'+s.valor+'"'+(s.valor===sel?' selected':'')+'>'+s.valor+'</option>';}).join('');}
function fillSubsub(sel){var tipo=el('m_tipo').value,sub=el('m_sub').value;var nn=subsubOf(tipo,sub);var w=el('m_subsub_wrap');
  if(!nn.length){w.style.display='none';el('m_subsub').innerHTML='';fillDetalhe();return;}

/** 4º nível "detalhe" — opções dependem do subsub: Livro→livros, Academia→séries, BJJ→Gi/No Gi. */
var DETALHE_OF={

  'Academia':{label:'Qual série',opts:function(){var o={ativa:0,encerrada:1};return series().slice().sort(function(a,b){return (o[a.pai||'ativa']||0)-(o[b.pai||'ativa']||0);}).map(function(l){return {v:l.valor,t:l.valor+(l.pai==='encerrada'?' · encerrada':' · ativa')};});}},

function fillDetalhe(sel){var w=el('m_detalhe_wrap');if(!w)return;var ss=el('m_subsub')?el('m_subsub').value:'';var cfg=DETALHE_OF[ss];
  if(!cfg){w.style.display='none';return;}

function calcDur(){var a=toMin(el('m_start').value),b=toMin(el('m_end').value);if(b<=a)b+=1440;var h=(b-a)/60;var work=el('m_tipo').value==='Trabalho';el('m_calc').innerHTML='Duração: <b>'+fmtH(h)+'h</b>'+(work?' · conta como trabalho':' · pessoal');}
function saveEvent(id){
  var ss=(el('m_subsub_wrap').style.display==='none')?'':el('m_subsub').value;
  var o={titulo:el('m_ti').value.trim(),date:el('m_date').value,start:el('m_start').value,end:el('m_end').value,subtipo:el('m_sub').value,subsub:ss,projeto:el('m_proj').value,local:el('m_loc').value,note:el('m_note').value.trim(),detalhe:(el('m_detalhe_wrap')&&el('m_detalhe_wrap').style.display!=='none'&&el('m_detalhe'))?el('m_detalhe').value:''};
  if(!o.titulo){toast('Dê um título');return;}
  if(!o.date){toast('Escolha a data');return;}   // input de data nativo pode ser limpo → evita evento órfão sem data
  if(id){var e=EVENTS.find(function(x){return x.id===id;});Object.assign(e,o);e.fonte='user';}else{o.id=uniqEvtId();o.status='';o.fonte='user';EVENTS.push(o);}
  saveEv();closeModal();toast('Salvo');renderAgenda();
}
/** ID de evento GARANTIDAMENTE único (evita colisão entre duplicados → marcar um marcava o outro). */
function uniqEvtId(){var id;do{id='evt-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e7).toString(36);}while(EVENTS.some(function(e){return e.id===id;}));return id;}
/** Corrige ids duplicados já existentes nos dados (mantém o 1º, reatribui os demais). Retorna true se mudou. */
function dedupEventIds(){var seen={},changed=false;EVENTS.forEach(function(e){if(!e.id||seen[e.id]){e.id=uniqEvtId();changed=true;}seen[e.id]=1;});return changed;}
function delEvent(id){var e=EVENTS.find(function(x){return x.id===id;});if(!e)return;if(!confirm('Cancelar o evento "'+(e.titulo||'')+'"?'))return;EVENTS=EVENTS.filter(function(x){return x.id!==id;});saveEv();closeModal();toast('Evento cancelado');renderAgenda();}

/* ============================ INDICADORES ============================ */
var indPeriod='semana';
var indRef=new Date(TODAY);
function indMonday(){return mondayOf(indRef);}
function inRange(iso){var d=parseISO(iso);
  if(indPeriod==='alltime')return true;
  if(indPeriod==='dia')return iso===isoOf(indRef);
  if(indPeriod==='semana'){var m=indMonday(),e=new Date(m);e.setDate(m.getDate()+6);return d>=m&&d<=e;}
  if(indPeriod==='mes')return d.getFullYear()===indRef.getFullYear()&&d.getMonth()===indRef.getMonth();
  if(indPeriod==='ano')return d.getFullYear()===indRef.getFullYear();
  return true;}
function indLabel(){
  if(indPeriod==='alltime')return 'Tudo';
  if(indPeriod==='dia')return DOW[(indRef.getDay()+6)%7]+', '+pad(indRef.getDate())+'/'+pad(indRef.getMonth()+1)+'/'+indRef.getFullYear();
  if(indPeriod==='semana'){var m=indMonday(),e=new Date(m);e.setDate(m.getDate()+6);return pad(m.getDate())+'–'+pad(e.getDate())+' '+MON[e.getMonth()]+' '+e.getFullYear();}
  if(indPeriod==='mes')return MONFULL[indRef.getMonth()]+' '+indRef.getFullYear();
  if(indPeriod==='ano')return ''+indRef.getFullYear();
  return '';}
function indNav(n){
  if(indPeriod==='dia')indRef.setDate(indRef.getDate()+n);
  else if(indPeriod==='semana')indRef.setDate(indRef.getDate()+n*7);
  else if(indPeriod==='mes')indRef.setMonth(indRef.getMonth()+n);
  else if(indPeriod==='ano')indRef.setFullYear(indRef.getFullYear()+n);
  indRef=new Date(indRef);renderInd();}
function indToday(){indRef=new Date(TODAY);renderInd();}
var indTab='geral';
function renderInd(){
  var evs=EVENTS.filter(function(e){return inRange(e.date);});
  var workH=0,persH=0,done=0,plan=0,byProj={},bySub={},byBook={};
  var focoH=0,reuniaoH=0,estudoH=0,atendN=0,diasTrab={},byModalN={},byGi={},saudeH=0,familiaH=0;
  evs.forEach(function(e){var h=durH(e),w=isWork(e),dn=e.status==='done';
    if(w)workH+=h;else persH+=h;plan++;if(dn)done++;
    if(e.projeto)byProj[e.projeto]=(byProj[e.projeto]||0)+h;
    bySub[e.subtipo]=(bySub[e.subtipo]||0)+h;
    if(e.subsub==='Livro'&&dn&&e.detalhe)byBook[e.detalhe]=(byBook[e.detalhe]||0)+h;
    if(e.subtipo==='Foco')focoH+=h;else if(e.subtipo==='Reunião')reuniaoH+=h;else if(e.subtipo==='Estudo')estudoH+=h;else if(e.subtipo==='Atendimento'&&dn)atendN++;
    if(w&&dn)diasTrab[e.date]=(diasTrab[e.date]||0)+h;
    if(e.subtipo==='Treino'||e.subtipo==='Esporte'){var k=e.subsub||e.subtipo;if(dn)byModalN[k]=(byModalN[k]||0)+1;if(e.subsub==='BJJ'&&dn&&e.detalhe)byGi[e.detalhe]=(byGi[e.detalhe]||0)+1;}
    else if(e.subtipo==='Saúde')saudeH+=h;else if(e.subtipo==='Família')familiaH+=h;});
  var ader=plan?Math.round(done/plan*100):0;
  var metaDias=Object.keys(diasTrab).filter(function(d){return diasTrab[d]>=6;}).length;
  var deepPct=(focoH+reuniaoH)?Math.round(focoH/(focoH+reuniaoH)*100):0;
  var treinoN=Object.keys(byModalN).reduce(function(s,k){return s+byModalN[k];},0);
  var livrosLidos=livrosByStatus('lido').filter(function(l){var d=livroDts(l);return d.fim&&inRange(d.fim);}).length;

function bars(map,cat,unit){var keys=Object.keys(map);if(!keys.length)return '<div class="muted" style="font-size:12px">Sem dados no período.</div>';

  return '<div class="bars">'+keys.map(function(k){var c=cfgFind(cat,k);var col=c?c.cor:'#3D43A2';var pct=Math.round(map[k]/max*100);
    var lbl=(unit&&unit!=='h')?(map[k]+unit):(fmtH(map[k])+'h');
    return '<div class="bar"><div class="top"><span>'+esc(k)+'</span><span class="muted">'+lbl+'</span></div><div class="track"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';}).join('')+'</div>';
}

/* ============================ COMPROMISSOS FINANCEIROS (cat:'fin') ============================
 * Recorrentes, guardados como config (sem migrar schema): ordem=dia do mês, pai=regra de dia útil
 * ('exato'|'antes'|'depois'), cor=periodicidade (''=mensal | 'tri:1,4,7,10'=trimestral, meses 1-based).
 * Ajuste de dia útil considera fins de semana + feriados NACIONAIS FIXOS (móveis/municipais não). */
var BR_HOL=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];  // nacionais de data fixa
function isBizDay(d){var wd=d.getDay();if(wd===0||wd===6)return false;return BR_HOL.indexOf(pad(d.getMonth()+1)+'-'+pad(d.getDate()))<0;}
function finMonths(cor){var m=/^tri:([\d,]+)/.exec(cor||'');return m?m[1].split(',').map(function(x){return (+x)-1;}):null;}   // →0-based, null=mensal
function finApplies(item,m0){var mm=finMonths(item.cor);return !mm||mm.indexOf(m0)>=0;}
function finEffDate(dia,rule,y,m0){var dim=new Date(y,m0+1,0).getDate();var d=new Date(y,m0,Math.min(dia,dim));if(rule==='exato')return d;var step=(rule==='antes')?-1:1;var g=0;while(!isBizDay(d)&&g<15){d.setDate(d.getDate()+step);g++;}return d;}
function finUpcoming(win){var t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());var end=new Date(t);end.setDate(end.getDate()+win);var out=[];
  byCat('fin').forEach(function(it){[0,1].forEach(function(mo){var ref=new Date(t.getFullYear(),t.getMonth()+mo,1);if(!finApplies(it,ref.getMonth()))return;var d=finEffDate(+it.ordem||1,it.pai||'exato',ref.getFullYear(),ref.getMonth());if(d>=t&&d<=end)out.push({item:it,date:d});});});
  out.sort(function(a,b){return a.date-b.date;});return out;}
function finRelDay(d){var t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());var n=Math.round((d-t)/86400000);return n===0?'hoje':(n===1?'amanhã':'em '+n+' dias');}
var FIN_RULES={exato:'no dia exato',antes:'ou dia útil anterior',depois:'ou dia útil posterior'};
function finRuleLabel(c){return (+c.ordem===1&&c.pai==='depois')?'1º dia útil':(FIN_RULES[c.pai||'exato']||'');}
var FIN_PRESETS=[
 {dia:1, pai:'depois',cor:'',           valor:'Emitir NFs (Unimed e QBem)'},

function finSeedDefaults(){if(byCat('fin').length){toast('Já há compromissos');return;}FIN_PRESETS.forEach(function(p,i){CFG.push({id:'fin-'+(i+1),cat:'fin',valor:p.valor,cor:p.cor,ordem:p.dia,pai:p.pai,gov:'usuario'});});saveCfg();toast('Lista padrão carregada');renderSys();}

  if(!items.length)return h+'<div class="hempty" style="text-align:center;padding:22px">Nenhum compromisso ainda.<br>Clique em <b>Carregar lista padrão</b> para começar.</div>';
  h+='<table class="tbl"><thead><tr><th style="width:56px">Dia</th><th>Compromisso</th><th style="width:160px">Regra</th><th style="width:96px">Período</th><th style="width:76px">Ações</th></tr></thead><tbody>';

/* ============================ LIVROS (cat:'livro') ============================
 * Guardados como config sem migrar schema: valor=título, pai=status ('espera'|'lendo'|'lido'),
 * cor="iniciado|concluido" (ISO), ordem. "Em leitura" = livro ativo; tempo de leitura = dias início→fim.
 * Ao marcar um evento Leitura→Livro como feito, o app usa o livro ativo (pergunta se houver >1). */
var LIVRO_ST={espera:'Na lista de espera',lendo:'Em leitura',lido:'Lido'};
function livros(){return CFG.filter(function(x){return x.cat==='livro';}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function livrosByStatus(s){return livros().filter(function(l){return (l.pai||'espera')===s;});}
function livroDts(l){var p=String(l.cor||'').split('|');return {ini:p[0]||'',fim:p[1]||'',horas:parseFloat(p[2])||0,modo:p[3]||''};}
function livroSetDts(l,d){l.cor=(d.ini||'')+'|'+(d.fim||'')+'|'+(d.horas||0)+'|'+(d.modo||'');}
function livroModoLbl(m){return {fisico:'📕 Físico',kindle:'📱 Kindle',phygital:'📖 Phygital'}[m]||'';}
function daysBetween(a,b){return Math.max(0,Math.round((parseISO(b)-parseISO(a))/86400000));}
function livroTempo(l){var d=livroDts(l),hrs=livroHoras(l),parts=[];if(d.ini&&d.fim)parts.push('lido em '+(daysBetween(d.ini,d.fim)||1)+' dias');else if(d.ini)parts.push('lendo há '+(daysBetween(d.ini,isoOf(TODAY))||0)+' dias');if(hrs)parts.push(fmtH(hrs)+'h lidas');if(d.modo)parts.push(livroModoLbl(d.modo));return parts.join(' · ');}
function sysLivros(){
  var h='<div class="muted" style="font-size:12px;margin-bottom:8px">Seus livros por status. <b>Em leitura</b> = livro ativo. O <b>tempo de leitura</b> conta os dias de início→fim. Ao marcar a leitura de <b>Livro</b> na agenda, o sistema usa o livro ativo (pergunta se houver mais de um).</div>';
  h+='<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-sm btn-primary" onclick="openLivro(\'\')">＋ Livro</button></div>';
  if(!livros().length)return h+'<div class="hempty" style="text-align:center;padding:22px">Nenhum livro ainda. Adicione o que está lendo.</div>';
  [['lendo','📖 Em leitura'],['espera','🕒 Na lista de espera'],['lido','✓ Lido']].forEach(function(g){
    var items=livrosByStatus(g[0]); if(!items.length)return;
    h+='<div class="grp-h"><b>'+g[1]+'</b> <span class="muted" style="font-size:11px">('+items.length+')</span></div>';
    items.forEach(function(l){var t=livroTempo(l);
      h+='<div class="sub-block"><div class="sub-row"><b>'+esc(l.valor)+'</b>'+(t?' <span class="muted" style="font-size:11px">'+esc(t)+'</span>':'')+'<span style="flex:1"></span>'+
        '<select class="locsel" style="max-width:130px" onchange="livroStatus(\''+l.id+'\',this.value)">'+['espera','lendo','lido'].map(function(st){return '<option value="'+st+'"'+((l.pai||'espera')===st?' selected':'')+'>'+LIVRO_ST[st]+'</option>';}).join('')+'</select>'+
        '<button class="icbtn" title="editar" onclick="openLivro(\''+l.id+'\')">✎</button><button class="icbtn" title="excluir" onclick="delCfg(\''+l.id+'\')">×</button></div></div>';
    });
  });
  return h;
}
function livroApplyStatus(l,st){var d=livroDts(l);
  if(st==='lendo'&&!d.ini)d.ini=isoOf(TODAY);
  if(st==='lido'){if(!d.ini)d.ini=isoOf(TODAY);d.fim=isoOf(TODAY);}
  if(st==='espera'){d.ini='';d.fim='';}
  livroSetDts(l,d);l.pai=st;}   /* preserva horas */
function livroStatus(id,st){var l=cfgById(id);if(!l)return;livroApplyStatus(l,st);saveCfg();toast(esc(l.valor)+': '+LIVRO_ST[st]);renderSys();}

    '<div class="field"><label>Modo de leitura</label><select id="lv_modo">'+['fisico','kindle','phygital'].map(function(m){var lm=(livroDts(c).modo||'fisico');return '<option value="'+m+'"'+(lm===m?' selected':'')+'>'+({fisico:'📕 Físico',kindle:'📱 Kindle',phygital:'📖 Phygital (ambos)'}[m])+'</option>';}).join('')+'</select></div></div>'+
    '<div class="field"><label>Horas base (ajuste)</label><input id="lv_hrs" type="number" step="0.5" min="0" value="'+livroDts(c).horas+'"><div class="hint">As horas de leitura são somadas automaticamente dos eventos Livro marcados como feito. Este campo é só um ajuste manual/base.</div></div></div>'+

/** CRITÉRIO de horas de leitura: horas base (ajuste manual) + soma da duração dos eventos Leitura→Livro
 *  DESTE livro marcados como ✓ feito. Robusto ao tri-estado (só conta o estado final 'done'). */
function livroHoras(l){var base=livroDts(l).horas||0;var ev=EVENTS.reduce(function(s,e){return s+((e.subsub==='Livro'&&e.status==='done'&&(e.detalhe||'')===l.valor)?durH(e):0);},0);return base+ev;}
/** Eventos de leitura (feitos) de um livro num intervalo [iso1,iso2] — usado no indicador. */
function livroEventos(nome,iso1,iso2){return EVENTS.filter(function(e){return e.subsub==='Livro'&&e.status==='done'&&(e.detalhe||'')===nome&&(!iso1||e.date>=iso1)&&(!iso2||e.date<=iso2);});}

/* ============================ SÉRIES DE TREINO (cat:'serie') — Academia → série ============================
 * cor="ini|fim|meta" (datas + meta em semanas, default 8); pai=status ('ativa'|'encerrada').
 * Sessões CALCULADAS dos eventos subsub='Academia' com detalhe===série marcados feito. */
var SERIE_ST={ativa:'Ativa',encerrada:'Encerrada'};
function series(){return CFG.filter(function(x){return x.cat==='serie';}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});}
function seriesByStatus(s){return series().filter(function(l){return (l.pai||'ativa')===s;});}
function serieDts(l){var p=String(l.cor||'').split('|');return {ini:p[0]||'',fim:p[1]||'',meta:parseInt(p[2])||8};}
function serieSetDts(l,d){l.cor=(d.ini||'')+'|'+(d.fim||'')+'|'+(d.meta||8);}
function serieSessoes(nome,iso1,iso2){return EVENTS.filter(function(e){return e.subsub==='Academia'&&e.status==='done'&&(e.detalhe||'')===nome&&(!iso1||e.date>=iso1)&&(!iso2||e.date<=iso2);}).length;}
function serieSemanas(l){var d=serieDts(l);if(!d.ini)return 0;return Math.max(0,Math.round(daysBetween(d.ini,d.fim||isoOf(TODAY))/7));}
function serieInfo(l){var d=serieDts(l),parts=[],ses=serieSessoes(l.valor);parts.push(ses+'x');if(d.ini){var sem=serieSemanas(l),al=(!d.fim&&sem>=d.meta)?' · ⚠️ trocar':'';parts.push(sem+'/'+d.meta+' sem'+al);}return parts.join(' · ');}
function serieApply(l,st){var d=serieDts(l);if(st==='ativa'){if(!d.ini)d.ini=isoOf(TODAY);d.fim='';}if(st==='encerrada'&&!d.fim)d.fim=isoOf(TODAY);serieSetDts(l,d);l.pai=st;}
function serieStatus(id,st){var l=cfgById(id);if(!l)return;serieApply(l,st);saveCfg();toast(l.valor+': '+SERIE_ST[st]);renderSys();}

/* ============================ HOME (Início) ============================
 * Clima + destaque da agenda vêm do próprio app (WX/EVENTS). Esportes, mercado, radar e
 * quotes do dia vêm do feed diário home-AAAA-MM-DD.json (rotina das 6h). Sem o feed,
 * os cards degradam bem e as quotes caem na rotação local (determinística por dia). */

/* ============================ LEITURA POR VOZ (TTS) — DID e MIR ============================
 * Web Speech API (speechSynthesis): voz do sistema, local (funciona offline), sem custo/API.
 * Lê o conteúdo editorial (lead, itens, "por que importa"); PULA tickers (números soam mal).
 * iOS: começa por toque (o botão) e pausa com a tela bloqueada — melhor com o app aberto. */
var TTS={gen:0,chunks:[],i:0,playing:false,paused:false,ctx:'',voice:null,rate:(function(){try{var r=parseFloat(localStorage.getItem('hub_tts_rate')||'1');return [1,1.25,1.5].indexOf(r)>=0?r:1;}catch(e){return 1;}})()};
function ttsSupported(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance);}
function ttsVoice(){if(TTS.voice)return TTS.voice;var vs=ttsSupported()?speechSynthesis.getVoices():[];TTS.voice=vs.filter(function(v){return v.lang==='pt-BR'||v.lang==='pt_BR';})[0]||vs.filter(function(v){return /^pt/i.test(v.lang);})[0]||null;return TTS.voice;}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){TTS.voice=null;};
function ttsStripHtml(s){var d=document.createElement('div');d.innerHTML=String(s==null?'':s);return (d.textContent||'').replace(/\*+/g,'').replace(/\s+/g,' ').trim();}
function ttsName(s){return String(s||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{20BF}]/gu,'').replace(/&/g,' e ').replace(/·/g,' ').replace(/\s+/g,' ').trim();}
function ttsSentences(t){var parts=String(t).split(/([.!?…;]+\s+)/),out=[],cur='';for(var i=0;i<parts.length;i++){cur+=parts[i];if(i%2===1){out.push(cur);cur='';}}if(cur)out.push(cur);return out;}
function ttsSplit(t){t=String(t||'').trim();if(!t)return [];if(t.length<=240)return [t];var out=[],cur='';ttsSentences(t).forEach(function(p){if((cur+p).length>240){if(cur.trim())out.push(cur.trim());cur=p;}else cur+=p;});if(cur.trim())out.push(cur.trim());return out;}
function ttsPush(a,s){ttsSplit(ttsStripHtml(s)).forEach(function(x){a.push(x);});}
/** Roteiro de narração do DID: sumário → seções (título/resumo/porquê) → teaser de saúde. */
function didSpeechChunks(d){if(!d)return [];var a=[],dl=d.data||d.dataLabel||'';
  a.push('DID. '+((d.subtitulo&&!/pessoal/i.test(d.subtitulo))?d.subtitulo:'Inteligência diária de mercados')+'.'+(dl?(' Edição de '+dl+'.'):''));
  var aba=(d.abas&&d.abas.length)?(d.abas.filter(function(x){return x.id==='mercados';})[0]||d.abas[0]):null;
  var lead=aba?aba.lead:d.lead, secoes=aba?aba.secoes:d.secoes;
  if(lead&&lead.length){a.push('Sumário executivo.');lead.forEach(function(x){ttsPush(a,x);});}
  (secoes||[]).forEach(function(s){if(/saude/i.test(s.id||''))return;a.push('Seção: '+ttsName(s.nome)+'.');(s.itens||[]).forEach(function(it){ttsPush(a,it.titulo+'.');ttsPush(a,it.resumo);if(it.porque)ttsPush(a,'Por que importa: '+it.porque);});});
  if(d.saude_teaser){a.push('Saúde hoje.');(d.saude_teaser.itens||[]).forEach(function(it){ttsPush(a,it.titulo+'. '+(it.resumo||''));});a.push('Análise completa no MIR Health.');}
  a.push('Fim da edição.');return a;}
/** Roteiro de narração do MIR: panorama → sentimento → top movers (nomes) → blocos → leitura → monitorar. */
function mirSpeechChunks(d){if(!d)return [];var a=[],dl=d.data||d.dataLabel||'';
  a.push('MIR Health. Market Insight Report on Health.'+(dl?(' Edição de '+dl+'.'):''));
  if(d.resumo_executivo&&d.resumo_executivo.length){a.push('Panorama executivo.');d.resumo_executivo.forEach(function(x){ttsPush(a,x);});}
  if(d.sentimento&&d.sentimento.length){a.push('Sentimento por setor.');d.sentimento.forEach(function(s){var n=s.nota==='+'?'positivo':(s.nota==='-'?'negativo':'neutro');ttsPush(a,s.setor+': '+(s.nota_txt||n)+'. '+(s.porque||''));});}
  if(d.top_movers){var up=(d.top_movers.up||[]).map(function(t){return t.n||t.s;}),dn=(d.top_movers.down||[]).map(function(t){return t.n||t.s;});if(up.length)a.push('Maiores altas: '+up.join(', ')+'.');if(dn.length)a.push('Maiores baixas: '+dn.join(', ')+'.');}
  (d.abas||[]).forEach(function(ab){a.push('Seção: '+ttsName(ab.nome)+'.');(ab.itens||[]).forEach(function(it){ttsPush(a,it.titulo+'.');ttsPush(a,it.resumo);if(it.porque)ttsPush(a,'Por que importa: '+it.porque);});});
  (d.leitura||[]).forEach(function(L){a.push('Ciência e leitura.');ttsPush(a,L.titulo+'.');ttsPush(a,L.resumo);if(L.porque)ttsPush(a,'Por que importa: '+L.porque);});
  if(d.monitorar&&d.monitorar.length){a.push('O que monitorar.');d.monitorar.forEach(function(x){ttsPush(a,x);});}
  a.push('Fim da edição.');return a;}
function ttsNext(){if(!TTS.playing)return;if(TTS.i>=TTS.chunks.length){ttsStopHard();ttsUi();return;}
  var g=TTS.gen,u=new SpeechSynthesisUtterance(TTS.chunks[TTS.i]);u.lang='pt-BR';var v=ttsVoice();if(v)u.voice=v;u.rate=TTS.rate;
  u.onend=function(){if(g!==TTS.gen||!TTS.playing)return;TTS.i++;ttsNext();};
  u.onerror=function(){if(g!==TTS.gen||!TTS.playing)return;TTS.i++;ttsNext();};
  try{speechSynthesis.speak(u);}catch(e){}}
function ttsPlay(chunks,ctx){ttsStopHard();TTS.gen++;TTS.chunks=chunks;TTS.i=0;TTS.ctx=ctx;TTS.playing=true;TTS.paused=false;ttsNext();ttsUi();}
function ttsStopHard(){TTS.gen++;TTS.playing=false;TTS.paused=false;TTS.chunks=[];TTS.i=0;TTS.ctx='';try{speechSynthesis.cancel();}catch(e){}}
function ttsStop(){ttsStopHard();ttsUi();}
function ttsToggle(kind){if(!ttsSupported()){toast('Leitura por voz não suportada neste navegador');return;}
  if(TTS.playing&&TTS.ctx===kind){if(TTS.paused){try{speechSynthesis.resume();}catch(e){}TTS.paused=false;}else{try{speechSynthesis.pause();}catch(e){}TTS.paused=true;}ttsUi();return;}
  var chunks=kind==='mir'?mirSpeechChunks(MIR):didSpeechChunks(DID);
  if(!chunks.length){toast('Nada para ler ainda');return;}
  ttsPlay(chunks,kind);}
function ttsRate(){var seq=[1,1.25,1.5],i=seq.indexOf(TTS.rate);TTS.rate=seq[(i+1)%seq.length];try{localStorage.setItem('hub_tts_rate',String(TTS.rate));}catch(e){}
